name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/pribadi/easydl
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "EasyDownloader"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.pribadi.easydl'
            compileSdk 34
            defaultConfig {
              applicationId 'com.pribadi.easydl'
              minSdk 29
              targetSdk 34
              versionCode 8
              versionName '4.4'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="Easy Downloader"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:usesCleartextTraffic="true"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.SEND"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
            <monochrome android:drawable="@drawable/ic_mono"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:type="radial" android:gradientRadius="76dp" android:centerX="0.5" android:centerY="0.5" android:startColor="#16473A" android:endColor="#06100D"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#2400E676" android:pathData="M54,54m-19,0a19,19 0 1,0 38,0a19,19 0 1,0 -38,0"/>
            <path android:fillColor="#00E676" android:strokeColor="#00E676" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            <group android:pivotX="54" android:pivotY="54" android:rotation="180">
              <path android:fillColor="#00E676" android:strokeColor="#00E676" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <group android:pivotX="54" android:pivotY="54" android:rotation="90">
              <path android:fillColor="#69F0AE" android:strokeColor="#69F0AE" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <group android:pivotX="54" android:pivotY="54" android:rotation="270">
              <path android:fillColor="#69F0AE" android:strokeColor="#69F0AE" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <path android:fillColor="#00000000" android:strokeColor="#B300E676" android:strokeWidth="1.4" android:pathData="M54,54m-6.5,0a6.5,6.5 0 1,0 13,0a6.5,6.5 0 1,0 -13,0"/>
            <path android:fillColor="#EFFFF6" android:pathData="M54,54m-3.4,0a3.4,3.4 0 1,0 6.8,0a3.4,3.4 0 1,0 -6.8,0"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_mono.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:strokeColor="#000000" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            <group android:pivotX="54" android:pivotY="54" android:rotation="90">
              <path android:fillColor="#000000" android:strokeColor="#000000" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <group android:pivotX="54" android:pivotY="54" android:rotation="180">
              <path android:fillColor="#000000" android:strokeColor="#000000" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <group android:pivotX="54" android:pivotY="54" android:rotation="270">
              <path android:fillColor="#000000" android:strokeColor="#000000" android:strokeWidth="2.4" android:strokeLineJoin="round" android:pathData="M54,45 L44.5,34.5 L50,34.5 L50,23 L58,23 L58,34.5 L63.5,34.5 Z"/>
            </group>
            <path android:fillColor="#000000" android:pathData="M54,54m-3.4,0a3.4,3.4 0 1,0 6.8,0a3.4,3.4 0 1,0 -6.8,0"/>
          </vector>
          EOF
          cat > app/src/main/java/com/pribadi/easydl/MainActivity.kt <<'EOF'
          package com.pribadi.easydl

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileDescriptor
          import java.io.IOException
          import java.io.OutputStream
          import java.math.BigInteger
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.nio.ByteBuffer

          class Media(
              val url: String,
              val video: Boolean,
              val thumb: String,
              val ref: String = "",
              val live: Boolean = false,
              val alts: List<String> = emptyList(),
              val still: String = "",
              val audio: String = "",
              val webm: Boolean = false,
              val label: String = "",
              val ua: String = "",
              val size: Long = 0L,
              val asize: Long = 0L,
              val ytId: String = "",
              val itag: Int = 0,
              val aitag: Int = 0
          )

          class Fmt(val url: String, val h: Int, val mime: String, val codecs: String, val br: Long, val size: Long, val fps: Int, val itag: Int = 0)

          class AuthFail(code: Int) : IOException("Instagram refused the request (HTTP $code)")

          class MainActivity : Activity() {
              private lateinit var input: EditText
              private lateinit var status: TextView
              private lateinit var list: LinearLayout
              private lateinit var btn: Button
              private lateinit var host: FrameLayout
              private lateinit var allBox: CheckBox
              private lateinit var loader: FrameLayout
              private lateinit var loaderText: TextView
              private lateinit var barFill: View
              private lateinit var loginHost: LinearLayout
              private lateinit var loginBox: FrameLayout
              private lateinit var loginTitle: TextView
              private var web: WebView? = null
              private var loginWeb: WebView? = null
              private var anim: ValueAnimator? = null
              private var bulk = false
              private var chosen = BooleanArray(0)
              private var ytMode = false
              private var ytSel = 0
              private val items = ArrayList<Media>()
              private val overlays = ArrayList<View>()
              private val captured = ArrayList<String>()
              private val seen = HashSet<Int>()
              private val handler = Handler(Looper.getMainLooper())
              @Volatile private var gen = 0
              private var lastLink = ""
              private var knownCode = ""
              private var plat = ""
              private var diag = ""
              private var lastErr = ""
              private var skipClipUntil = 0L
              private var loginRetry = ""
              private var fbTotal = 0
              private var pollStop = false
              private var thRetried = false
              private var thEmbedTried = false
              private var thLoginDone = false
              private var loginSite = ""
              private var fbLast = 0
              private var fbStall = 0
              private var vetting = false
              private val netVideos = ArrayList<String>()

              private val UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
              private val UAD = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
              private val LINK = Regex("https?://(?:[\\w-]+\\.)*(?:tiktok\\.com|x\\.com|twitter\\.com|threads\\.net|threads\\.com|facebook\\.com|fb\\.watch|fb\\.com|instagram\\.com|youtube\\.com|youtu\\.be)/\\S*")
              private class YC(val name: String, val id: String, val ver: String, val ua: String, val android: Boolean = false, val embed: Boolean = false, val vision: Boolean = false)

              private val YT = listOf(
                  YC("VISIONOS", "101", "1.02", "Mozilla/5.0 (Macintosh; Intel Mac OS X 15_7_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Safari/605.1.15", vision = true),
                  YC("ANDROID_VR", "28", "1.65.10", "com.google.android.apps.youtube.vr.oculus/1.65.10 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip", android = true),
                  YC("ANDROID_VR", "28", "1.62.27", "com.google.android.apps.youtube.vr.oculus/1.62.27 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip", android = true),
                  YC("TVHTML5_SIMPLY_EMBEDDED_PLAYER", "85", "2.0", "Mozilla/5.0 (PlayStation; PlayStation 4/12.00) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.4 Safari/605.1.15", embed = true),
                  YC("WEB_EMBEDDED_PLAYER", "56", "1.20250310.01.00", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36", embed = true),
                  YC("TVHTML5", "7", "7.20250219.14.00", "Mozilla/5.0 (ChromiumStylePlatform) Cobalt/Version")
              )

              private val JS_M = """function M(t){return t.indexOf('image_versions2')>-1||t.indexOf('video_versions')>-1||t.indexOf('itemStruct')>-1||t.indexOf('playable_url')>-1||t.indexOf('browser_native')>-1||t.indexOf('viewer_image')>-1||t.indexOf('photo_image')>-1||t.indexOf('og:image')>-1}"""

              private val HOOK = """(function(){if(window.__h)return;window.__h=1;
          $JS_M
          var f=window.fetch;
          if(f){window.fetch=function(){return f.apply(this,arguments).then(function(r){try{r.clone().text().then(function(t){if(M(t))B.put(t)})}catch(e){}return r})}}
          var o=XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.send=function(){this.addEventListener('load',function(){try{var t=this.responseText;if(t&&M(t))B.put(t)}catch(e){}});return o.apply(this,arguments)};
          })();"""

              private val SCRIPTS = """(function(){$JS_M
          Array.from(document.querySelectorAll('script[type="application/json"]')).forEach(function(s){var t=s.textContent;if(M(t))B.put(t)})})()"""

              private val SCRIPTS_FB = """(function(){$JS_M
          Array.from(document.querySelectorAll('script[type="application/json"]')).forEach(function(s){var t=s.textContent;if(M(t))B.put(t)});
          var h=document.documentElement.outerHTML;if(M(h))B.put(h)})()"""

              inner class Bridge(private val g: Int) {
                  @JavascriptInterface
                  fun put(s: String) {
                      if (g != gen) return
                      synchronized(captured) { if (captured.size < 40 && seen.add(s.hashCode())) captured.add(s) }
                  }
              }

              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()

              private fun shortcode(pk: String): String {
                  val alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
                  var n = BigInteger(pk)
                  val base = BigInteger.valueOf(64)
                  val sb = StringBuilder()
                  while (n.signum() > 0) {
                      val qr = n.divideAndRemainder(base)
                      sb.append(alpha[qr[1].toInt()])
                      n = qr[0]
                  }
                  return sb.reverse().toString()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  input = EditText(this).apply { hint = "Paste a link, or share it to this app"; setSingleLine() }
                  status = TextView(this).apply {
                      text = "Copy a link from Threads, X, TikTok, Facebook, Instagram or YouTube, then open this app."
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  allBox = CheckBox(this).apply {
                      text = "Select all"
                      visibility = View.GONE
                      setOnCheckedChangeListener { _, c -> if (!bulk) for (i in chosen.indices) setSel(i, c) }
                  }
                  btn = Button(this).apply {
                      text = "Download"
                      isEnabled = false
                      setOnClickListener { download() }
                  }
                  host = FrameLayout(this)
                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(40), dp(16), dp(16))
                      addView(input)
                      addView(status)
                      addView(ScrollView(this@MainActivity).apply { addView(list) }, LinearLayout.LayoutParams(-1, 0, 1f))
                      addView(LinearLayout(this@MainActivity).apply {
                          gravity = Gravity.END
                          addView(allBox)
                      }, LinearLayout.LayoutParams(-1, -2))
                      addView(btn)
                      addView(host, LinearLayout.LayoutParams(1, 1))
                  }

                  // loading bar: a long box with a green fill that grows while we wait
                  val barW = (resources.displayMetrics.widthPixels * 0.7f).toInt()
                  val track = GradientDrawable().apply { setColor(Color.WHITE); setStroke(dp(2), Color.BLACK); cornerRadius = dp(10).toFloat() }
                  val fillShape = GradientDrawable().apply { setColor(Color.rgb(46, 160, 67)); cornerRadius = dp(7).toFloat() }
                  barFill = View(this).apply {
                      background = fillShape
                      pivotX = 0f
                      scaleX = 0f
                  }
                  val bar = FrameLayout(this).apply {
                      background = track
                      addView(barFill, FrameLayout.LayoutParams(-1, -1).apply { setMargins(dp(3), dp(3), dp(3), dp(3)) })
                  }
                  loaderText = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.DKGRAY)
                      setPadding(dp(24), dp(14), dp(24), 0)
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      addView(bar, LinearLayout.LayoutParams(barW, dp(22)))
                      addView(loaderText, LinearLayout.LayoutParams(-1, -2))
                  }
                  loader = FrameLayout(this).apply {
                      visibility = View.GONE
                      isClickable = true
                      setBackgroundColor(Color.argb(245, 250, 250, 250))
                      addView(box, FrameLayout.LayoutParams(-1, -2, Gravity.CENTER))
                  }

                  // in-app login screen (only used for Instagram / Facebook stories)
                  loginTitle = TextView(this).apply { setPadding(dp(16), dp(12), dp(8), dp(12)) }
                  loginBox = FrameLayout(this)
                  loginHost = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setBackgroundColor(Color.WHITE)
                      setPadding(0, dp(32), 0, 0)
                      addView(LinearLayout(this@MainActivity).apply {
                          gravity = Gravity.CENTER_VERTICAL
                          addView(loginTitle, LinearLayout.LayoutParams(0, -2, 1f))
                          addView(Button(this@MainActivity).apply {
                              text = "Cancel"
                              setOnClickListener { finishLogin(false) }
                          })
                          addView(Button(this@MainActivity).apply {
                              text = "Done"
                              setOnClickListener { finishLogin(true) }
                          })
                      }, LinearLayout.LayoutParams(-1, -2))
                      addView(loginBox, LinearLayout.LayoutParams(-1, 0, 1f))
                  }

                  val root = FrameLayout(this)
                  root.addView(content, FrameLayout.LayoutParams(-1, -1))
                  root.addView(loader, FrameLayout.LayoutParams(-1, -1))
                  root.addView(loginHost, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)
                  if (savedInstanceState == null) handleShare(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleShare(intent)
              }

              override fun onBackPressed() {
                  if (loginHost.visibility == View.VISIBLE) finishLogin(false) else super.onBackPressed()
              }

              private fun handleShare(i: Intent?) {
                  if (i == null || i.action != Intent.ACTION_SEND) return
                  val t = i.getStringExtra(Intent.EXTRA_TEXT) ?: return
                  val link = LINK.find(t)?.value
                  if (link == null) {
                      status.text = "No supported link found in the shared text."
                      return
                  }
                  skipClipUntil = SystemClock.elapsedRealtime() + 2000
                  start(link)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || SystemClock.elapsedRealtime() < skipClipUntil) return
                  if (loginHost.visibility == View.VISIBLE) return
                  val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  val text = cm.primaryClip?.takeIf { it.itemCount > 0 }
                      ?.getItemAt(0)?.coerceToText(this)?.toString() ?: return
                  val link = LINK.find(text)?.value ?: return
                  if (link == lastLink) return
                  start(link)
              }

              private fun say(s: String) = runOnUiThread {
                  status.text = s
                  loaderText.text = s
              }

              private fun fail(my: Int, s: String) = runOnUiThread {
                  if (my == gen) {
                      pollStop = true
                      lastLink = ""
                      busy(false)
                      status.text = s
                  }
              }

              private fun busy(on: Boolean) = runOnUiThread {
                  anim?.cancel()
                  anim = null
                  if (!on) {
                      barFill.scaleX = 1f
                      loader.visibility = View.GONE
                      return@runOnUiThread
                  }
                  loader.visibility = View.VISIBLE
                  loaderText.text = status.text
                  barFill.scaleX = 0f
                  val ms = when (plat) {
                      "x" -> 6000L
                      "yt" -> 8000L
                      "tt", "th", "ig" -> 16000L
                      else -> 22000L
                  }
                  anim = ValueAnimator.ofFloat(0f, 0.93f).apply {
                      duration = ms
                      interpolator = DecelerateInterpolator()
                      addUpdateListener { barFill.scaleX = it.animatedValue as Float }
                      start()
                  }
              }

              private fun hasCookie(site: String, key: String): Boolean =
                  (CookieManager.getInstance().getCookie(site) ?: "").contains(key)

              private fun open(u: String, ref: String = "", ua: String = UA): HttpURLConnection {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", ua)
                  if (ref.isNotEmpty()) {
                      c.setRequestProperty("Referer", ref)
                      CookieManager.getInstance().getCookie(u)?.let { c.setRequestProperty("Cookie", it) }
                  }
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  return c
              }

              private fun get(u: String): String = open(u).inputStream.bufferedReader().readText()

              // every WebView is brand new for every link, so data from an earlier link can never leak in
              private fun newWeb(my: Int, ua: String): WebView {
                  host.removeAllViews()
                  web?.destroy()
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.settings.userAgentString = ua
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.addJavascriptInterface(Bridge(my), "B")
                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val u = request.url
                          if (u.scheme == "http" || u.scheme == "https") return false
                          val id = u.getQueryParameter("id")?.substringBefore("_")
                          if (plat == "th" && u.scheme == "barcelona" && id != null && id.isNotEmpty() && id.all { it.isDigit() }) {
                              val c = shortcode(id)
                              knownCode = c
                              view.loadUrl("https://www.threads.com/t/$c")
                          }
                          return true
                      }

                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): android.webkit.WebResourceResponse? {
                          if (plat == "tt") {
                              val u = request.url.toString()
                              val l = u.lowercase()
                              if (!l.contains("audio") && (l.contains("mime_type=video") || l.contains("/video/tos"))) {
                                  synchronized(netVideos) {
                                      if (netVideos.size < 30 && netVideos.none { it.substringBefore("?") == u.substringBefore("?") }) netVideos.add(u)
                                  }
                              }
                          }
                          return null
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          if (plat != "tt") view.evaluateJavascript(HOOK, null)
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          if (plat != "tt") view.evaluateJavascript(HOOK, null)
                      }
                  }
                  host.addView(w, FrameLayout.LayoutParams(1, 1))
                  web = w
                  return w
              }

              // ---------- entry point for every link ----------
              private fun platformOf(l: String): String {
                  val s = l.lowercase()
                  return when {
                      s.contains("tiktok.com") -> "tt"
                      s.contains("threads.") -> "th"
                      s.contains("instagram.com") -> "ig"
                      s.contains("youtube.com") || s.contains("youtu.be") -> "yt"
                      s.contains("facebook.com") || s.contains("fb.watch") || s.contains("fb.com") -> "fb"
                      else -> "x"
                  }
              }

              private fun start(link: String) {
                  lastLink = link
                  input.setText(link)
                  val my = ++gen
                  list.removeAllViews()
                  items.clear()
                  overlays.clear()
                  chosen = BooleanArray(0)
                  ytMode = false
                  btn.isEnabled = false
                  allBox.visibility = View.GONE
                  diag = ""
                  lastErr = ""
                  knownCode = ""
                  fbTotal = 0
                  pollStop = false
                  thRetried = false
                  thEmbedTried = false
                  fbLast = 0
                  fbStall = 0
                  vetting = false
                  synchronized(netVideos) { netVideos.clear() }
                  synchronized(captured) { captured.clear(); seen.clear() }
                  plat = platformOf(link)
                  say("Loading…")
                  busy(true)
                  when (plat) {
                      "x" -> startX(link, my)
                      "yt" -> startYt(link, my)
                      "ig" -> startIg(link, my)
                      "fb" -> startFb(link, my)
                      else -> startWeb(link, my)
                  }
              }

              private fun showLogin(site: String, retry: String) {
                  busy(false)
                  loginRetry = retry
                  loginSite = site
                  loginTitle.text = "Log in to $site once, then tap Done"
                  loginBox.removeAllViews()
                  loginWeb?.destroy()
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.settings.userAgentString = UA
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.webViewClient = WebViewClient()
                  loginBox.addView(w, FrameLayout.LayoutParams(-1, -1))
                  loginWeb = w
                  w.loadUrl(when (site) {
                      "Instagram" -> "https://www.instagram.com/accounts/login/"
                      "Threads" -> "https://www.threads.com/login"
                      else -> "https://m.facebook.com/login/"
                  })
                  loginHost.visibility = View.VISIBLE
                  status.text = "Login needed to read this content."
              }

              private fun finishLogin(ok: Boolean) {
                  if (ok && loginSite == "Threads") thLoginDone = true
                  CookieManager.getInstance().flush()
                  loginHost.visibility = View.GONE
                  loginBox.removeAllViews()
                  loginWeb?.destroy()
                  loginWeb = null
                  if (ok && loginRetry.isNotEmpty()) {
                      start(loginRetry)
                  } else {
                      lastLink = ""
                      status.text = "Login cancelled."
                  }
              }

              // ---------- X ----------
              private fun startX(link: String, my: Int) {
                  val id = Regex("/status(?:es)?/(\\d+)").find(link)?.groupValues?.get(1)
                  if (id == null) {
                      fail(my, "Unrecognized X link. Use a post link (it contains /status/ and a number).")
                      return
                  }
                  val user = Regex("(?:x|twitter)\\.com/([A-Za-z0-9_]+)/status").find(link)?.groupValues?.get(1) ?: "i"
                  say("Fetching from X…")
                  val js = """(function(){return ((Number('$id')/1e15)*Math.PI).toString(36).replace(/(0+|\.)/g,'')})()"""
                  newWeb(my, UA).evaluateJavascript(js) { r ->
                      val token = (r ?: "").trim('"')
                      Thread {
                          try {
                              var found: List<Media> = try {
                                  parseX(get("https://cdn.syndication.twimg.com/tweet-result?id=$id&lang=en&token=$token"))
                              } catch (e: Exception) {
                                  emptyList()
                              }
                              if (found.isEmpty()) found = viaFx(user, id, 0)
                              runOnUiThread {
                                  if (my == gen) {
                                      if (found.isEmpty()) fail(my, "No photo or video found. The post may have no media, be deleted, or be from a locked account.")
                                      else show(found)
                                  }
                              }
                          } catch (e: Exception) {
                              fail(my, "Failed: ${e.message}")
                          }
                      }.start()
                  }
              }

              private fun parseX(text: String): List<Media> {
                  val j = JSONObject(text)
                  val out = ArrayList<Media>()
                  xMedia(j.optJSONArray("mediaDetails"), out)
                  xMedia(j.optJSONObject("quoted_tweet")?.optJSONArray("mediaDetails"), out)
                  return out
              }

              private fun xMedia(md: JSONArray?, out: ArrayList<Media>) {
                  if (md == null) return
                  for (i in 0 until md.length()) {
                      val m = md.optJSONObject(i) ?: continue
                      val base = m.optString("media_url_https")
                      val thumb = if (base.isEmpty()) "" else "$base?name=small"
                      if (m.optString("type") == "photo") {
                          if (base.isNotEmpty()) out.add(Media("$base?name=orig", false, thumb))
                      } else {
                          val vs = m.optJSONObject("video_info")?.optJSONArray("variants") ?: continue
                          var best = ""
                          var br = -1L
                          for (k in 0 until vs.length()) {
                              val v = vs.optJSONObject(k) ?: continue
                              if (v.optString("content_type") != "video/mp4") continue
                              val b = v.optLong("bitrate")
                              if (b > br) { br = b; best = v.optString("url") }
                          }
                          if (best.isNotEmpty()) out.add(Media(best, true, thumb))
                      }
                  }
              }

              // backup: FxTwitter (reads sensitive posts, quoted posts and posts that only link to another post)
              private fun viaFx(user: String, id: String, depth: Int): List<Media> {
                  val body = try { get("https://api.fxtwitter.com/$user/status/$id") } catch (e: Exception) { return emptyList() }
                  val t = try { JSONObject(body).optJSONObject("tweet") } catch (e: Exception) { null } ?: return emptyList()
                  val out = ArrayList<Media>()
                  fxMedia(t, out)
                  fxMedia(t.optJSONObject("quote"), out)
                  if (out.isEmpty() && depth == 0) {
                      val others = Regex("status(?:es)?/(\\d+)").findAll(t.optString("text"))
                          .map { it.groupValues[1] }.filter { it != id }.distinct().toList()
                      for (o in others) {
                          val r = viaFx("i", o, 1)
                          if (r.isNotEmpty()) return r
                      }
                  }
                  return out
              }

              private fun fxMedia(t: JSONObject?, out: ArrayList<Media>) {
                  val md = t?.optJSONObject("media") ?: return
                  val all = md.optJSONArray("all")
                  if (all != null && all.length() > 0) {
                      for (i in 0 until all.length()) fxOne(all.optJSONObject(i), out)
                  } else {
                      val ph = md.optJSONArray("photos")
                      val vi = md.optJSONArray("videos")
                      if (ph != null) for (i in 0 until ph.length()) fxOne(ph.optJSONObject(i)?.also { it.put("type", "photo") }, out)
                      if (vi != null) for (i in 0 until vi.length()) fxOne(vi.optJSONObject(i)?.also { it.put("type", "video") }, out)
                  }
              }

              private fun fxOne(m: JSONObject?, out: ArrayList<Media>) {
                  if (m == null) return
                  val url = m.optString("url")
                  if (url.isEmpty()) return
                  if (m.optString("type") == "photo") {
                      val base = url.substringBefore("?")
                      out.add(Media("$base?name=orig", false, "$base?name=small"))
                  } else {
                      out.add(Media(url, true, m.optString("thumbnail_url")))
                  }
              }

              // ---------- Threads / TikTok / Instagram posts / Facebook (through a hidden browser) ----------
              private fun startWeb(link: String, my: Int) {
                  say("Opening post… (up to 25 seconds)")
                  newWeb(my, UA).loadUrl(link)
                  poll(my, 0)
              }

              private fun startFb(link: String, my: Int) {
                  if (link.contains("/stories/") && !hasCookie("https://www.facebook.com", "c_user=")) {
                      showLogin("Facebook", link)
                      return
                  }
                  say("Opening Facebook post… (up to 25 seconds)")
                  newWeb(my, UAD).loadUrl(link)
                  poll(my, 0)
              }

              private fun poll(my: Int, tick: Int) {
                  if (my != gen || pollStop) return
                  val w = web ?: return
                  w.evaluateJavascript(if (plat == "fb" && tick % 2 == 0) SCRIPTS_FB else SCRIPTS, null)
                  val url = w.url ?: ""
                  val docs = synchronized(captured) { ArrayList(captured) }
                  var found: List<Media> = emptyList()
                  when (plat) {
                      "tt" -> {
                          val id = Regex("/(?:video|photo)/(\\d+)").find(url)?.groupValues?.get(1) ?: ""
                          if (id.isNotEmpty()) found = parseTT(docs, id)
                          if (found.isEmpty() && tick >= 10) found = parseTT(docs, "")
                          if (found.isNotEmpty() && found.none { it.video }) {
                              // photo post: watch the page traffic for a few seconds in case live photo clips load
                              found = if (tick < 5) emptyList() else withNet(found)
                          }
                          if (found.isNotEmpty() && found.any { it.live } && !vetting) {
                              vetThen(my, found)
                              return
                          }
                      }
                      "th", "ig" -> {
                          val rx = if (plat == "th") "/(?:post|t)/([A-Za-z0-9_-]+)" else "/(?:p|reel|reels|tv)/([A-Za-z0-9_-]+)"
                          val code = Regex(rx).find(url)?.groupValues?.get(1) ?: knownCode
                          if (code.isNotEmpty() || (plat == "th" && tick >= 12)) {
                              found = parseTh(docs, code)
                              if (found.isEmpty() && plat == "th" && tick >= 20 && code.isNotEmpty()) found = parseTh(docs, "")
                              if (found.isNotEmpty() && found.any { it.video } && !vetting) {
                                  vetThen(my, found)
                                  return
                              }
                          }
                      }
                      "fb" -> if (tick >= 2) {
                          found = parseFb(docs, tick >= 18)
                          if (found.isNotEmpty() && !found[0].video && fbTotal > found.size && tick < 40) {
                              if (found.size > fbLast) { fbLast = found.size; fbStall = 0 } else fbStall++
                              if (fbStall < 8) {
                                  say("Loading Facebook photos… (${found.size} of $fbTotal)")
                                  fbNudge(w)
                                  found = emptyList()
                              } else {
                                  diag = "Facebook only provided ${found.size} of $fbTotal photos"
                              }
                          }
                      }
                  }
                  if (found.isNotEmpty()) {
                      show(found)
                      return
                  }
                  if (plat == "th") {
                      val cur = if (url.startsWith("http")) url else lastLink
                      if (tick == 12 && docs.isEmpty() && !thRetried) {
                          // nothing arrived: try once more as a desktop browser
                          thRetried = true
                          say("Trying another way…")
                          newWeb(my, UAD).loadUrl(cur)
                          handler.postDelayed({ poll(my, 4) }, 1000)
                          return
                      }
                      if (tick == 18 && !thEmbedTried) {
                          thEmbedTried = true
                          say("Trying the Threads embed page…")
                          val m = Regex("@([^/]+)/post/([A-Za-z0-9_-]+)").find(cur)
                          if (m != null) {
                              Thread {
                                  val r = thEmbed(m.groupValues[1], m.groupValues[2])
                                  runOnUiThread { if (my == gen && !pollStop && r.isNotEmpty()) show(r) }
                              }.start()
                          }
                      }
                  }
                  if ((plat == "ig" || plat == "fb") && tick >= 4 && url.contains("login")) {
                      if (plat == "ig" && !hasCookie("https://www.instagram.com", "sessionid=")) { showLogin("Instagram", lastLink); return }
                      if (plat == "fb" && !hasCookie("https://www.facebook.com", "c_user=")) { showLogin("Facebook", lastLink); return }
                  }
                  if (tick >= (if (plat == "fb" && fbTotal > 0) 30 else 25)) {
                      if (plat == "th" && !thLoginDone && !hasCookie("https://www.threads.com", "sessionid=")) { showLogin("Threads", lastLink); return }
                      if (plat == "ig" && !hasCookie("https://www.instagram.com", "sessionid=")) { showLogin("Instagram", lastLink); return }
                      if (plat == "fb" && !hasCookie("https://www.facebook.com", "c_user=")) { showLogin("Facebook", lastLink); return }
                      fail(my, "Nothing found. url=$url; data=${docs.size}; ${kinds(docs)}")
                      return
                  }
                  handler.postDelayed({ poll(my, tick + 1) }, 1000)
              }

              // last resort for Threads: read the public embed page without JavaScript
              private fun thEmbed(user: String, code: String): List<Media> {
                  val html = try {
                      open("https://www.threads.com/@$user/post/$code/embed/", "", UAD).inputStream.bufferedReader().readText()
                  } catch (e: Exception) { return emptyList() }
                  val clean = html.replace("&amp;", "&").replace("\\/", "/").replace("\\u0026", "&")
                  val out = LinkedHashMap<String, Media>()
                  for (m in Regex("https://[^\"'\\s<>\\\\]+").findAll(clean)) {
                      val u = m.value
                      val l = u.lowercase()
                      if (!(l.contains("cdninstagram.com") || l.contains("fbcdn.net"))) continue
                      if (l.contains("t51.2885-19") || l.contains("s150x150") || l.contains("s320x320")) continue
                      val name = u.substringBefore("?").substringAfterLast("/")
                      if (l.contains(".mp4")) out.putIfAbsent(name, Media(u, true, "", "https://www.threads.com/"))
                      else if (l.contains(".jpg") || l.contains(".webp") || l.contains(".heic")) out.putIfAbsent(name, Media(u, false, u, "https://www.threads.com/"))
                  }
                  return out.values.take(20).toList()
              }

              private fun kinds(docs: List<String>): String =
                  listOf("image_versions2", "video_versions", "carousel_media", "itemStruct", "viewer_image")
                      .joinToString(",") { k -> "$k=${docs.count { it.contains(k) }}" }

              private fun withNet(found: List<Media>): List<Media> {
                  val net = synchronized(netVideos) { ArrayList(netVideos) }
                  if (net.isEmpty()) return found
                  val have = found.map { it.url.substringBefore("?") }.toSet()
                  val extra = net.filter { it.substringBefore("?") !in have }
                      .map { Media(it, true, found[0].thumb, "https://www.tiktok.com/", live = true) }
                  return found + extra
              }

              // opens the photo viewer of a Facebook album and flips through the photos so all of them get loaded
              private fun fbNudge(w: WebView) {
                  w.evaluateJavascript("""(function(){
          if(!window.__o){var a=document.querySelector('a[href*="/photo"],a[href*="photo.php"],a[href*="pcb."]');if(a){window.__o=1;a.click()}return}
          var t=document.activeElement||document.body;
          ['keydown','keyup'].forEach(function(n){var e=new KeyboardEvent(n,{key:'ArrowRight',code:'ArrowRight',keyCode:39,which:39,bubbles:true});t.dispatchEvent(e);document.dispatchEvent(e)});
          var nx=document.querySelector('[aria-label="Next photo"],[aria-label="Next"]');if(nx)nx.click()})()""", null)
              }

              private fun jsonRoots(d: String): List<JSONObject> {
                  val s = d.trim().removePrefix("for (;;);")
                  val roots = ArrayList<JSONObject>()
                  try {
                      roots.add(JSONObject(s))
                  } catch (e: Exception) {
                      for (line in s.split("\n")) {
                          try { roots.add(JSONObject(line)) } catch (e2: Exception) { }
                      }
                  }
                  return roots
              }

              // ----- TikTok -----
              private fun parseTT(docs: List<String>, id: String): List<Media> {
                  for (d in docs) {
                      for (r in jsonRoots(d)) {
                          val item = findItem(r, id) ?: continue
                          val res = collectTT(item)
                          if (res.isNotEmpty()) return res
                      }
                  }
                  return emptyList()
              }

              private fun findItem(n: Any?, id: String): JSONObject? {
                  if (n is JSONObject) {
                      val s = n.optJSONObject("itemStruct")
                      if (s != null && (id.isEmpty() || s.optString("id") == id)) return s
                      for (k in n.keys()) findItem(n.opt(k), id)?.let { return it }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) findItem(n.opt(i), id)?.let { return it }
                  }
                  return null
              }

              // every link that looks like a video file inside some JSON (used to find live photo clips)
              private fun videoUrls(n: Any?, skip: Set<String>, out: LinkedHashSet<String> = LinkedHashSet()): List<String> {
                  if (n is JSONObject) {
                      for (k in n.keys()) {
                          if (k in skip) continue
                          videoUrls(n.opt(k), skip, out)
                      }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) videoUrls(n.opt(i), skip, out)
                  } else if (n is String && n.startsWith("http")) {
                      val l = n.lowercase()
                      if (!l.contains("audio") && (l.contains("mime_type=video") || l.contains("/video/tos") || Regex("\\.mp4(\\?|$)").containsMatchIn(l))) out.add(n)
                  }
                  return out.toList()
              }

              private fun keyList(o: JSONObject?): String {
                  if (o == null) return "-"
                  val l = ArrayList<String>()
                  for (k in o.keys()) l.add(k)
                  return l.take(25).joinToString(",")
              }

              private fun collectTT(item: JSONObject): List<Media> {
                  val ref = "https://www.tiktok.com/"
                  val out = ArrayList<Media>()
                  val ip = item.optJSONObject("imagePost")
                  val imgs = ip?.optJSONArray("images")
                  if (imgs != null && imgs.length() > 0) {
                      var live = 0
                      for (i in 0 until imgs.length()) {
                          val o = imgs.optJSONObject(i) ?: continue
                          val u = o.optJSONObject("imageURL")?.optJSONArray("urlList")?.optString(0) ?: ""
                          val vs = videoUrls(o, emptySet())
                          if (vs.isNotEmpty()) {
                              out.add(Media(vs[0], true, u, ref, live = true, alts = vs.drop(1), still = u))
                              live++
                          } else if (u.isNotEmpty()) {
                              out.add(Media(u, false, u, ref))
                          }
                      }
                      if (live == 0) {
                          val first = out.firstOrNull()?.thumb ?: ""
                          for (u in videoUrls(item, setOf("music")).distinct().take(12)) {
                              out.add(Media(u, true, first, ref, live = true))
                              live++
                          }
                      }
                      if (live == 0) {
                          diag = "TikTok's web page lists photos only. If this post has live photos, their clips are not included in the web data."
                      }
                      return out
                  }
                  val v = item.optJSONObject("video") ?: return out
                  val h264 = ArrayList<Pair<Long, String>>()
                  val other = ArrayList<Pair<Long, String>>()
                  val rates = v.optJSONArray("bitrateInfo")
                  if (rates != null) {
                      for (i in 0 until rates.length()) {
                          val r = rates.optJSONObject(i) ?: continue
                          val u = r.optJSONObject("PlayAddr")?.optJSONArray("UrlList")?.optString(0) ?: ""
                          if (u.isEmpty()) continue
                          val e = Pair(r.optLong("Bitrate"), u)
                          if (r.optString("CodecType").contains("264")) h264.add(e) else other.add(e)
                      }
                  }
                  val urls = ArrayList<String>()
                  h264.sortedByDescending { it.first }.forEach { urls.add(it.second) }
                  v.optString("downloadAddr").takeIf { it.startsWith("http") }?.let { urls.add(it) }
                  v.optString("playAddr").takeIf { it.startsWith("http") }?.let { urls.add(it) }
                  if (urls.isEmpty()) other.sortedByDescending { it.first }.forEach { urls.add(it.second) }
                  val all = urls.distinct().take(6)
                  val cover = v.optString("cover").ifEmpty { v.optString("originCover") }
                  // the app later measures every candidate and downloads the biggest file (highest quality)
                  if (all.isNotEmpty()) out.add(Media(all[0], true, cover, ref, alts = all.drop(1)))
                  return out
              }

              // ----- Threads / Instagram posts -----
              private fun parseTh(docs: List<String>, code: String): List<Media> {
                  for (d in docs) {
                      for (r in jsonRoots(d)) {
                          val p = findPost(r, code) ?: continue
                          val res = collectTh(p)
                          if (res.isNotEmpty()) return res
                      }
                  }
                  return emptyList()
              }

              private fun findPost(n: Any?, code: String): JSONObject? {
                  if (n is JSONObject) {
                      if ((code.isEmpty() || n.optString("code") == code) &&
                          (n.has("image_versions2") || n.has("video_versions") || n.has("carousel_media"))) return n
                      for (k in n.keys()) findPost(n.opt(k), code)?.let { return it }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) findPost(n.opt(i), code)?.let { return it }
                  }
                  return null
              }

              private fun collectTh(p: JSONObject): List<Media> {
                  val out = ArrayList<Media>()
                  val car = p.optJSONArray("carousel_media")
                  if (car != null && car.length() > 0) {
                      for (i in 0 until car.length()) oneTh(car.optJSONObject(i))?.let { out.add(it) }
                  } else {
                      oneTh(p)?.let { out.add(it) }
                  }
                  return out
              }

              private fun oneTh(o: JSONObject?): Media? {
                  if (o == null) return null
                  val thumb = best(o.optJSONObject("image_versions2")?.optJSONArray("candidates")) ?: ""
                  val vids = cands(o.optJSONArray("video_versions"))
                  return if (vids.isNotEmpty()) Media(vids[0], true, thumb, alts = vids.drop(1))
                  else if (thumb.isNotEmpty()) Media(thumb, false, thumb)
                  else null
              }

              // all video links of a post, biggest picture first (entries without a picture size are usually audio only)
              private fun cands(a: JSONArray?): List<String> {
                  if (a == null) return emptyList()
                  val l = ArrayList<Pair<Long, String>>()
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      val u = o.optString("url")
                      if (u.isEmpty()) continue
                      l.add(Pair(o.optLong("width") * o.optLong("height"), u))
                  }
                  return l.sortedByDescending { it.first }.map { it.second }
              }

              private fun kindOf(h: ByteArray, n: Int): String {
                  if (n >= 3 && h[0] == 'I'.code.toByte() && h[1] == 'D'.code.toByte() && h[2] == '3'.code.toByte()) return "audio"
                  if (n >= 2 && (h[0].toInt() and 0xFF) == 0xFF && (h[1].toInt() and 0xE0) == 0xE0) return "audio"
                  if (n >= 12 && String(h, 4, 4) == "ftyp" && String(h, 8, 4) == "M4A ") return "audio"
                  return "other"
              }

              // read the first bytes of a file to see what it really is
              private fun sniff(u: String, ref: String): String {
                  val c = open(u, ref)
                  c.setRequestProperty("Range", "bytes=0-15")
                  val h = ByteArray(16)
                  var n = 0
                  try {
                      c.inputStream.use { i ->
                          while (n < 16) {
                              val r = i.read(h, n, 16 - n)
                              if (r < 0) break
                              n += r
                          }
                      }
                  } finally {
                      c.disconnect()
                  }
                  return kindOf(h, n)
              }

              // Threads / Instagram: make sure every "video" really is a video (not an audio file) before showing it
              private fun vetThen(my: Int, found: List<Media>) {
                  vetting = true
                  pollStop = true
                  say("Checking files…")
                  Thread {
                      val good = ArrayList<Media>()
                      for (m in found) {
                          if (!m.video) { good.add(m); continue }
                          var pick: String? = null
                          for (u in (listOf(m.url) + m.alts).distinct()) {
                              val k = try { sniff(u, m.ref) } catch (e: Exception) { "other" }
                              if (k != "audio") { pick = u; break }
                          }
                          if (pick != null) good.add(Media(pick, true, m.thumb, m.ref, live = m.live, still = m.still))
                      }
                      runOnUiThread {
                          if (my == gen) {
                              if (good.isEmpty()) fail(my, "This post has no photo or video of its own (only sound or a link preview), so there is nothing to download.")
                              else show(good)
                          }
                      }
                  }.start()
              }

              private fun best(a: JSONArray?, needSize: Boolean = false): String? {
                  if (a == null) return null
                  var url: String? = null
                  var area = -1L
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      val u = o.optString("url")
                      if (u.isEmpty()) continue
                      val s = o.optLong("width") * o.optLong("height")
                      if (needSize && s <= 0L) continue
                      if (s > area) { area = s; url = u }
                  }
                  return url
              }

              // ---------- Instagram stories / highlights (needs login) ----------
              private fun startIg(link: String, my: Int) {
                  val hl = Regex("instagram\\.com/stories/highlights/(\\d+)").find(link)?.groupValues?.get(1)
                  val su = Regex("instagram\\.com/stories/([A-Za-z0-9._]+)(?:/(\\d+))?").find(link)
                  var shareHl: String? = null
                  val sm = Regex("instagram\\.com/s/([A-Za-z0-9_=-]+)").find(link)
                  if (sm != null) {
                      try {
                          val d = String(Base64.decode(sm.groupValues[1], Base64.URL_SAFE))
                          if (d.startsWith("highlight:")) shareHl = d.removePrefix("highlight:")
                      } catch (e: Exception) { }
                  }
                  val reelHl = hl ?: shareHl
                  val user = su?.groupValues?.get(1)
                  if (reelHl != null || (user != null && user != "highlights")) {
                      val sid = Regex("story_media_id=(\\d+)").find(link)?.groupValues?.get(1)
                          ?: su?.groupValues?.get(2)?.ifEmpty { null }
                      igStory(link, my, reelHl, user, sid)
                  } else {
                      say("Opening Instagram post… (up to 25 seconds)")
                      newWeb(my, UAD).loadUrl(link)
                      poll(my, 0)
                  }
              }

              private fun igApi(u: String, cookie: String): String {
                  val csrf = Regex("csrftoken=([^;]+)").find(cookie)?.groupValues?.get(1) ?: ""
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("X-IG-App-ID", "936619743392459")
                  c.setRequestProperty("X-CSRFToken", csrf)
                  c.setRequestProperty("X-Requested-With", "XMLHttpRequest")
                  c.setRequestProperty("Cookie", cookie)
                  c.setRequestProperty("Referer", "https://www.instagram.com/")
                  c.setRequestProperty("Accept", "*/*")
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  val code = c.responseCode
                  if (code == 400 || code == 401 || code == 403) throw AuthFail(code)
                  if (code >= 400) throw IOException("HTTP $code")
                  return c.inputStream.bufferedReader().readText()
              }

              private fun walkMedia(n: Any?, out: ArrayList<JSONObject>, ids: HashSet<String>) {
                  if (n is JSONObject) {
                      if (n.has("video_versions") || n.has("image_versions2")) {
                          if (ids.add(n.optString("pk", n.optString("id")))) out.add(n)
                          return
                      }
                      for (k in n.keys()) walkMedia(n.opt(k), out, ids)
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) walkMedia(n.opt(i), out, ids)
                  }
              }

              private fun igStory(link: String, my: Int, hlId: String?, user: String?, storyId: String?) {
                  val cookie = CookieManager.getInstance().getCookie("https://www.instagram.com") ?: ""
                  if (!cookie.contains("sessionid=")) {
                      showLogin("Instagram", link)
                      return
                  }
                  say("Fetching stories…")
                  Thread {
                      try {
                          var reel = if (hlId != null) "highlight:$hlId" else ""
                          if (reel.isEmpty()) {
                              val j = JSONObject(igApi("https://www.instagram.com/api/v1/users/web_profile_info/?username=$user", cookie))
                              reel = j.optJSONObject("data")?.optJSONObject("user")?.optString("id") ?: ""
                              if (reel.isEmpty()) throw IOException("User not found")
                          }
                          val body = igApi("https://www.instagram.com/api/v1/feed/reels_media/?reel_ids=" + URLEncoder.encode(reel, "UTF-8"), cookie)
                          val nodes = ArrayList<JSONObject>()
                          walkMedia(JSONObject(body), nodes, HashSet())
                          var found: List<Media> = nodes.mapNotNull { oneTh(it) }
                          if (storyId != null) {
                              val idx = nodes.indexOfFirst { it.optString("pk") == storyId || it.optString("id").startsWith(storyId) }
                              if (idx >= 0) found = listOfNotNull(oneTh(nodes[idx]))
                          }
                          runOnUiThread {
                              if (my == gen) {
                                  if (found.isEmpty()) fail(my, "No active stories found (they disappear after 24 hours).")
                                  else show(found)
                              }
                          }
                      } catch (e: AuthFail) {
                          runOnUiThread { if (my == gen) showLogin("Instagram", link) }
                      } catch (e: Exception) {
                          fail(my, "Failed: ${e.message}")
                      }
                  }.start()
              }

              // ----- Facebook -----
              private fun dec(s: String): String = try {
                  JSONObject("{\"a\":\"$s\"}").getString("a")
              } catch (e: Exception) {
                  s.replace("\\/", "/").replace("\\u0026", "&").replace("&amp;", "&")
              }

              private fun grab(d: String, rx: String): String? {
                  val m = Regex(rx).find(d) ?: return null
                  return dec(m.groupValues[1])
              }

              private fun tick0(docs: List<String>) = docs.size > 0

              private fun parseFb(docs: List<String>, final: Boolean): List<Media> {
                  val ref = "https://www.facebook.com/"
                  var hd = ""
                  var sd = ""
                  var thumb = ""
                  val photos = LinkedHashMap<String, String>()
                  var og = ""
                  for (d in docs) {
                      if (hd.isEmpty()) hd = grab(d, "\"browser_native_hd_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"playable_url_quality_hd\":\"([^\"]+)\"")
                          ?: grab(d, "\"hd_src\":\"([^\"]+)\"") ?: ""
                      if (sd.isEmpty()) sd = grab(d, "\"browser_native_sd_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"playable_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"sd_src\":\"([^\"]+)\"") ?: ""
                      if (thumb.isEmpty()) thumb = grab(d, "\"preferred_thumbnail\":\\{\"image\":\\{\"uri\":\"([^\"]+)\"") ?: ""
                      if (og.isEmpty()) og = Regex("property=\"og:image\" content=\"([^\"]+)\"").find(d)?.groupValues?.get(1)?.replace("&amp;", "&") ?: ""
                      for (m in Regex("\"all_subattachments\":\\{\"count\":(\\d+)").findAll(d)) {
                          val c = m.groupValues[1].toIntOrNull() ?: 0
                          if (c > fbTotal) fbTotal = c
                      }
                      for (m in Regex("\"(?:viewer_image|photo_image)\":\\{[^}]*?\"uri\":\"([^\"]+)\"").findAll(d)) {
                          val u = dec(m.groupValues[1])
                          photos.putIfAbsent(u.substringBefore("?").substringAfterLast("/"), u)
                      }
                  }
                  if (hd.isNotEmpty() || sd.isNotEmpty()) {
                      val first = if (hd.isNotEmpty()) hd else sd
                      val alts = if (hd.isNotEmpty() && sd.isNotEmpty()) listOf(sd) else emptyList()
                      return listOf(Media(first, true, thumb.ifEmpty { og }, ref, alts = alts))
                  }
                  if (photos.isNotEmpty() && (final || tick0(docs))) return photos.values.take(30).map { Media(it, false, it, ref) }
                  if (final && og.isNotEmpty()) return listOf(Media(og, false, og, ref))
                  return emptyList()
              }

              // ---------- YouTube ----------
              private fun startYt(link: String, my: Int) {
                  val id = Regex("(?:youtu\\.be/|[?&]v=|/shorts/|/live/|/embed/)([A-Za-z0-9_-]{11})").find(link)?.groupValues?.get(1)
                  if (id == null) {
                      fail(my, "Could not find a video ID in this YouTube link.")
                      return
                  }
                  val isShort = link.contains("/shorts/")
                  say("Reading YouTube formats…")
                  Thread {
                      try {
                          val r = ytFetch(id)
                          runOnUiThread {
                              if (my == gen) {
                                  if (isShort) autoOne(r.first[0]) else showYt(r.first, r.second)
                              }
                          }
                      } catch (e: Exception) {
                          fail(my, "YouTube: ${e.message}")
                      }
                  }.start()
              }

              private fun visitorId(): String = try {
                  val h = open("https://www.youtube.com/", "", UAD).inputStream.bufferedReader().readText()
                  Regex("\"(?:VISITOR_DATA|visitorData)\":\"([^\"]+)\"").find(h)?.groupValues?.get(1) ?: ""
              } catch (e: Exception) { "" }

              private fun ytPlayer(id: String, c: YC, visitor: String): JSONObject {
                  val client = JSONObject().put("clientName", c.name).put("clientVersion", c.ver).put("hl", "en").put("gl", "US")
                      .put("userAgent", c.ua)
                  if (c.android) client.put("deviceMake", "Oculus").put("deviceModel", "Quest 3")
                      .put("androidSdkVersion", 32).put("osName", "Android").put("osVersion", "12L")
                  if (c.vision) client.put("deviceMake", "Apple").put("deviceModel", "RealityDevice17,1")
                      .put("osName", "visionOS").put("osVersion", "26.5.23O471")
                  if (visitor.isNotEmpty()) client.put("visitorData", visitor)
                  val ctx = JSONObject().put("client", client)
                  if (c.embed) ctx.put("thirdParty", JSONObject().put("embedUrl", "https://www.youtube.com/watch?v=$id"))
                  val body = JSONObject().put("context", ctx)
                      .put("videoId", id).put("contentCheckOk", true).put("racyCheckOk", true)
                  val u = URL("https://www.youtube.com/youtubei/v1/player?prettyPrint=false").openConnection() as HttpURLConnection
                  u.requestMethod = "POST"
                  u.doOutput = true
                  u.setRequestProperty("Content-Type", "application/json")
                  u.setRequestProperty("User-Agent", c.ua)
                  u.setRequestProperty("X-YouTube-Client-Name", c.id)
                  u.setRequestProperty("X-YouTube-Client-Version", c.ver)
                  u.setRequestProperty("Origin", "https://www.youtube.com")
                  if (visitor.isNotEmpty()) u.setRequestProperty("X-Goog-Visitor-Id", visitor)
                  u.connectTimeout = 20000
                  u.readTimeout = 30000
                  u.outputStream.use { it.write(body.toString().toByteArray()) }
                  val text = try {
                      u.inputStream.bufferedReader().readText()
                  } catch (e: Exception) {
                      throw IOException("HTTP ${u.responseCode}")
                  }
                  return JSONObject(text)
              }

              private fun ytFetch(id: String): Pair<List<Media>, String> {
                  var reason = ""
                  val visitor = visitorId()
                  for (c in YT) {
                      try {
                          val j = ytPlayer(id, c, visitor)
                          val sd = j.optJSONObject("streamingData")
                          if (sd == null) {
                              if (reason.isEmpty()) reason = j.optJSONObject("playabilityStatus")?.optString("reason") ?: "no streams"
                              continue
                          }
                          val opts = buildYt(id, sd, c.ua)
                          if (opts.isNotEmpty()) return Pair(opts, j.optJSONObject("videoDetails")?.optString("title") ?: "")
                          if (reason.isEmpty()) reason = "no direct download formats for this video"
                      } catch (e: Exception) {
                          if (reason.isEmpty()) reason = e.message ?: "network error"
                      }
                  }
                  throw IOException((if (reason.isEmpty()) "video unavailable" else reason) + " (all ${YT.size} methods failed)")
              }

              // the same file (same format number and size) as offered through every other YouTube route
              private fun ytSources(id: String, itag: Int, size: Long, skip: String): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val visitor = visitorId()
                  for (c in YT) {
                      try {
                          val sd = ytPlayer(id, c, visitor).optJSONObject("streamingData") ?: continue
                          for (pass in 0..1) {
                              val a = sd.optJSONArray(if (pass == 0) "formats" else "adaptiveFormats") ?: continue
                              for (i in 0 until a.length()) {
                                  val o = a.optJSONObject(i) ?: continue
                                  if (o.optInt("itag") != itag) continue
                                  val u = o.optString("url")
                                  if (u.isEmpty() || u == skip) continue
                                  val cl = o.optString("contentLength").toLongOrNull() ?: 0L
                                  if (size > 0 && cl != size) continue
                                  out.add(Pair(u, c.ua))
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out
              }

              private fun mb(b: Long): String = if (b > 0) " · ${b / 1048576} MB" else ""

              private fun buildYt(id: String, sd: JSONObject, ua: String): List<Media> {
                  val prog = ArrayList<Fmt>()
                  val vmp4 = ArrayList<Fmt>()
                  val vweb = ArrayList<Fmt>()
                  var amp4: Fmt? = null
                  var aweb: Fmt? = null
                  for (pass in 0..1) {
                      val a = sd.optJSONArray(if (pass == 0) "formats" else "adaptiveFormats") ?: continue
                      for (i in 0 until a.length()) {
                          val o = a.optJSONObject(i) ?: continue
                          val u = o.optString("url")
                          if (u.isEmpty()) continue
                          val mt = o.optString("mimeType")
                          val mime = mt.substringBefore(";").trim()
                          val codecs = mt.substringAfter("codecs=\"", "").substringBefore("\"")
                          val f = Fmt(u, o.optInt("height"), mime, codecs, o.optLong("bitrate"),
                              o.optString("contentLength").toLongOrNull() ?: 0L, o.optInt("fps"), o.optInt("itag"))
                          if (pass == 0) {
                              if (mime == "video/mp4") prog.add(f)
                          } else if (mime == "video/mp4" && codecs.startsWith("avc1")) {
                              vmp4.add(f)
                          } else if (mime == "video/webm" && codecs.startsWith("vp")) {
                              vweb.add(f)
                          } else if (mime == "audio/mp4") {
                              val cur = amp4
                              if (cur == null || f.br > cur.br) amp4 = f
                          } else if (mime == "audio/webm") {
                              val cur = aweb
                              if (cur == null || f.br > cur.br) aweb = f
                          }
                      }
                  }
                  val thumb = "https://i.ytimg.com/vi/$id/hqdefault.jpg"
                  val res = ArrayList<Pair<Int, Media>>()
                  val heights = (vmp4.map { it.h } + vweb.map { it.h }).filter { it > 0 }.distinct().sortedDescending()
                  val am = amp4
                  val aw = aweb
                  for (h in heights) {
                      val m = vmp4.filter { it.h == h }.maxByOrNull { it.br }
                      val w = vweb.filter { it.h == h }.maxByOrNull { it.br }
                      if (m != null && am != null) {
                          res.add(Pair(h, Media(m.url, true, thumb, audio = am.url, label = "${h}p${if (m.fps > 30) m.fps.toString() else ""} · MP4${mb(m.size + am.size)}",
                              ua = ua, size = m.size, asize = am.size, ytId = id, itag = m.itag, aitag = am.itag)))
                      } else if (w != null && aw != null) {
                          res.add(Pair(h, Media(w.url, true, thumb, audio = aw.url, webm = true, label = "${h}p${if (w.fps > 30) w.fps.toString() else ""} · WebM${mb(w.size + aw.size)}",
                              ua = ua, size = w.size, asize = aw.size, ytId = id, itag = w.itag, aitag = aw.itag)))
                      }
                  }
                  for (p in prog) {
                      if (p.h in heights && res.isNotEmpty()) continue
                      res.add(Pair(p.h, Media(p.url, true, thumb, label = "${p.h}p · MP4 (with sound)${mb(p.size)}", ua = ua, size = p.size, ytId = id, itag = p.itag)))
                  }
                  return res.sortedByDescending { it.first }.map { it.second }
              }

              private fun autoOne(m: Media) {
                  busy(false)
                  items.clear()
                  items.add(m)
                  overlays.clear()
                  chosen = booleanArrayOf(true)
                  ytMode = false
                  say("Downloading…")
                  download()
              }

              private fun showYt(opts: List<Media>, title: String) {
                  busy(false)
                  items.clear()
                  items.addAll(opts)
                  overlays.clear()
                  chosen = BooleanArray(0)
                  ytMode = true
                  ytSel = 0
                  allBox.visibility = View.GONE
                  list.removeAllViews()
                  status.text = "Choose a quality, then tap Download."
                  if (title.isNotEmpty()) list.addView(TextView(this).apply {
                      text = title
                      textSize = 15f
                      setPadding(0, 0, 0, dp(8))
                  })
                  val total = resources.displayMetrics.widthPixels - dp(32)
                  val tw = total * 2 / 5
                  val th = tw * 4 / 3
                  val img = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(Color.LTGRAY)
                  }
                  val rg = RadioGroup(this)
                  opts.forEachIndexed { i, o ->
                      rg.addView(RadioButton(this).apply {
                          text = o.label
                          id = i + 1
                          isChecked = i == 0
                          setOnClickListener { ytSel = i }
                      })
                  }
                  list.addView(LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(img, LinearLayout.LayoutParams(tw, th))
                      addView(rg, LinearLayout.LayoutParams(0, -2, 1f))
                  })
                  loadThumb(opts[0], img)
                  btn.isEnabled = true
              }

              // ---------- Grid ----------
              private fun setSel(i: Int, v: Boolean) {
                  if (i >= chosen.size || i >= overlays.size) return
                  chosen[i] = v
                  overlays[i].visibility = if (v) View.VISIBLE else View.GONE
              }

              private fun syncAll() {
                  bulk = true
                  allBox.isChecked = chosen.isNotEmpty() && chosen.all { it }
                  bulk = false
              }

              private fun show(found: List<Media>) {
                  pollStop = true
                  busy(false)
                  ytMode = false
                  items.clear()
                  overlays.clear()
                  list.removeAllViews()
                  items.addAll(found)
                  chosen = BooleanArray(found.size)
                  bulk = true
                  allBox.isChecked = false
                  bulk = false
                  allBox.visibility = if (found.size > 1) View.VISIBLE else View.GONE
                  val gap = dp(4)
                  val cw = (resources.displayMetrics.widthPixels - dp(32) - gap * 6) / 3
                  val ch = cw * 4 / 3
                  val grid = GridLayout(this).apply { columnCount = 3 }
                  found.forEachIndexed { i, m ->
                      val cell = FrameLayout(this)
                      val img = ImageView(this).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.LTGRAY)
                      }
                      val ov = View(this).apply {
                          setBackgroundColor(Color.argb(160, 255, 255, 255))
                          visibility = View.GONE
                      }
                      cell.addView(img, FrameLayout.LayoutParams(-1, -1))
                      cell.addView(ov, FrameLayout.LayoutParams(-1, -1))
                      if (m.video) {
                          cell.addView(TextView(this).apply {
                              text = if (m.live) "● Live" else "▶ Video"
                              textSize = 11f
                              setTextColor(Color.WHITE)
                              setBackgroundColor(Color.argb(150, 0, 0, 0))
                              setPadding(dp(6), dp(2), dp(6), dp(2))
                          }, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START))
                      }
                      overlays.add(ov)
                      cell.setOnClickListener { setSel(i, !chosen[i]); syncAll() }
                      grid.addView(cell, GridLayout.LayoutParams().apply {
                          width = cw
                          height = ch
                          setMargins(gap, gap, gap, gap)
                      })
                      loadThumb(m, img)
                  }
                  list.addView(grid)
                  btn.isEnabled = true
                  if (found.size == 1) {
                      setSel(0, true)
                      say("Downloading…")
                      download()
                  } else {
                      val nv = found.count { it.video }
                      say("Found $nv video(s) and ${found.size - nv} photo(s). Tap to select." + if (diag.isNotEmpty()) "\n($diag)" else "")
                  }
              }

              private fun loadThumb(m: Media, v: ImageView) {
                  if (m.thumb.isEmpty()) return
                  Thread {
                      try {
                          val o = BitmapFactory.Options().apply { inSampleSize = 2 }
                          val bmp = BitmapFactory.decodeStream(open(m.thumb, m.ref).inputStream, null, o)
                          runOnUiThread { v.setImageBitmap(bmp) }
                      } catch (e: Exception) {
                      }
                  }.start()
              }

              // ---------- Download ----------
              private fun download() {
                  val sel = if (ytMode) listOf(items[ytSel]) else items.filterIndexed { i, _ -> i < chosen.size && chosen[i] }
                  if (sel.isEmpty()) {
                      say("Tap at least one item first.")
                      return
                  }
                  btn.isEnabled = false
                  val g = gen
                  Thread {
                      var ok = 0
                      sel.forEachIndexed { n, m ->
                          if (g == gen) say("Downloading ${n + 1} of ${sel.size}… (keep the app open)")
                          try {
                              save(m, n)
                              ok++
                          } catch (e: Exception) {
                              lastErr = e.message ?: e.javaClass.simpleName
                          }
                      }
                      runOnUiThread {
                          if (g == gen) {
                              status.text = if (ok == sel.size) "Done: $ok of ${sel.size} saved to your gallery (album EasyDownloader)."
                              else "Done: $ok of ${sel.size} saved. Error: $lastErr"
                              btn.isEnabled = true
                          }
                      }
                  }.start()
              }

              private fun sizeOf(u: String, ref: String): Long {
                  val c = open(u, ref)
                  c.setRequestProperty("Range", "bytes=0-0")
                  val cr = c.getHeaderField("Content-Range")
                  val s = if (cr != null && cr.contains("/")) (cr.substringAfter("/").trim().toLongOrNull() ?: -1L) else c.contentLengthLong
                  c.disconnect()
                  return s
              }

              // measure every candidate link and keep the biggest file (= best quality)
              private fun pickBest(m: Media): String {
                  val c = (listOf(m.url) + m.alts).distinct()
                  if (c.size == 1) return c[0]
                  var best = c[0]
                  var bs = -1L
                  for (u in c) {
                      val s = try { sizeOf(u, m.ref) } catch (e: Exception) { -1L }
                      if (s > bs) { bs = s; best = u }
                  }
                  return best
              }

              private fun newItem(name: String, mime: String, video: Boolean): Pair<Uri, ContentValues> {
                  val v = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, (if (video) "Movies" else "Pictures") + "/EasyDownloader")
                      put(MediaStore.MediaColumns.IS_PENDING, 1)
                  }
                  val col = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  return Pair(contentResolver.insert(col, v)!!, v)
              }

              private fun finishItem(p: Pair<Uri, ContentValues>) {
                  p.second.clear()
                  p.second.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  contentResolver.update(p.first, p.second, null, null)
              }

              private fun save(m: Media, n: Int) {
                  if (m.audio.isNotEmpty()) { saveMux(m, n); return }
                  if (m.live) { saveLive(m, n); return }
                  val url = pickBest(m)
                  val path = url.substringBefore("?").lowercase()
                  val ext = if (m.video) "mp4" else if (path.endsWith(".png")) "png" else if (path.endsWith(".webp")) "webp" else "jpg"
                  val mime = if (m.video) "video/mp4" else when (ext) {
                      "png" -> "image/png"
                      "webp" -> "image/webp"
                      else -> "image/jpeg"
                  }
                  val item = newItem("easydl_${System.currentTimeMillis()}_$n.$ext", mime, m.video)
                  try {
                      contentResolver.openOutputStream(item.first)!!.use { o ->
                          if (m.ua.isNotEmpty()) fetchChunks(url, o, m.ua, m.size, "Video", m.ytId, m.itag)
                          else {
                              val c = open(url, m.ref)
                              c.inputStream.use { i ->
                                  val head = ByteArray(16)
                                  var n = 0
                                  while (n < 16) {
                                      val r = i.read(head, n, 16 - n)
                                      if (r < 0) break
                                      n += r
                                  }
                                  if (m.video && kindOf(head, n) == "audio") throw IOException("This file is audio only, not a video")
                                  o.write(head, 0, n)
                                  i.copyTo(o)
                              }
                          }
                      }
                  } catch (e: Exception) {
                      contentResolver.delete(item.first, null, null)
                      throw e
                  }
                  finishItem(item)
              }

              private fun readAll(u: String, ref: String): ByteArray = open(u, ref).inputStream.use { it.readBytes() }

              private fun writeBytes(b: ByteArray, name: String, mime: String, video: Boolean) {
                  val item = newItem(name, mime, video)
                  try {
                      contentResolver.openOutputStream(item.first)!!.use { it.write(b) }
                  } catch (e: Exception) {
                      contentResolver.delete(item.first, null, null)
                      throw e
                  }
                  finishItem(item)
              }

              // live photo = short video clip (TikTok itself saves it as a normal MP4)
              private fun saveLive(m: Media, n: Int) {
                  val b = readAll(pickBest(m), m.ref)
                  if (kindOf(b, minOf(16, b.size)) == "audio") throw IOException("This clip is sound only, not a video")
                  writeBytes(b, "easydl_live_${System.currentTimeMillis()}_$n.mp4", "video/mp4", true)
              }

              private class Cur(var pos: Long = 0L, var pct: Int = -1)

              private fun pull(url: String, ua: String, endv: Long, useParam: Boolean, out: OutputStream, buf: ByteArray, st: Cur, size: Long, label: String) {
                  val start = st.pos
                  val u = if (useParam) "$url&range=$start-$endv" else url
                  val c = open(u, "https://www.youtube.com/", ua)
                  c.setRequestProperty("Origin", "https://www.youtube.com")
                  if (!useParam) c.setRequestProperty("Range", "bytes=$start-$endv")
                  val code = c.responseCode
                  if (code >= 400) { c.disconnect(); throw IOException("HTTP $code") }
                  if (!useParam && code == 200 && start > 0) { c.disconnect(); throw IOException("range ignored") }
                  var got = 0L
                  c.inputStream.use { i ->
                      var r = i.read(buf)
                      while (r >= 0) {
                          out.write(buf, 0, r)
                          got += r
                          st.pos += r
                          val pct = (st.pos * 100 / size).toInt()
                          if (pct != st.pct) { st.pct = pct; say("$label $pct%") }
                          if (st.pos > endv) break
                          r = i.read(buf)
                      }
                  }
                  if (got == 0L) throw IOException("empty")
              }

              // download in pieces; when YouTube blocks a piece, resume from the same spot through another YouTube route
              private fun fetchChunks(url0: String, out: OutputStream, ua0: String, size: Long, label: String, id: String, itag: Int) {
                  val buf = ByteArray(65536)
                  if (size <= 0) {
                      val c = open(url0, "", ua0)
                      c.inputStream.use { i ->
                          var r = i.read(buf)
                          while (r >= 0) { out.write(buf, 0, r); r = i.read(buf) }
                      }
                      return
                  }
                  val srcs = ArrayList<Pair<String, String>>()
                  srcs.add(Pair(url0, ua0))
                  var expanded = false
                  var cur = 0
                  val st = Cur()
                  while (st.pos < size) {
                      var ok = false
                      var why = ""
                      var idx = cur
                      while (!ok) {
                          if (idx >= srcs.size) {
                              if (expanded || id.isEmpty() || itag <= 0) break
                              expanded = true
                              say("$label: trying another YouTube route…")
                              srcs.addAll(ytSources(id, itag, size, url0))
                              if (idx >= srcs.size) break
                          }
                          val s = srcs[idx]
                          for (variant in 0..1) {
                              val len = if (variant == 0) 9437184L else 1048576L
                              val endv = minOf(st.pos + len, size) - 1
                              try {
                                  pull(s.first, s.second, endv, variant == 1, out, buf, st, size, label)
                                  ok = true
                                  break
                              } catch (e: IOException) {
                                  why = e.message ?: "network error"
                                  if (st.pos >= size) { ok = true; break }
                              }
                          }
                          if (ok) cur = idx else idx++
                      }
                      if (!ok) throw IOException("YouTube stopped the download at ${maxOf(st.pct, 0)}% ($why)")
                  }
              }

              private fun saveMux(m: Media, n: Int) {
                  val vf = File(cacheDir, "v_${System.nanoTime()}.bin")
                  val af = File(cacheDir, "a_${System.nanoTime()}.bin")
                  try {
                      vf.outputStream().use { fetchChunks(m.url, it, m.ua, m.size, "Video", m.ytId, m.itag) }
                      af.outputStream().use { fetchChunks(m.audio, it, m.ua, m.asize, "Audio", m.ytId, m.aitag) }
                      say("Merging video and audio…")
                      val ext = if (m.webm) "webm" else "mp4"
                      val item = newItem("easydl_yt_${System.currentTimeMillis()}_$n.$ext", if (m.webm) "video/webm" else "video/mp4", true)
                      try {
                          contentResolver.openFileDescriptor(item.first, "rw")!!.use { mux(vf.path, af.path, it.fileDescriptor, m.webm) }
                      } catch (e: Exception) {
                          contentResolver.delete(item.first, null, null)
                          throw e
                      }
                      finishItem(item)
                  } finally {
                      vf.delete()
                      af.delete()
                  }
              }

              private fun trackOf(ex: MediaExtractor, prefix: String): Int {
                  for (i in 0 until ex.trackCount) {
                      if (ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME)?.startsWith(prefix) == true) return i
                  }
                  throw IOException("No $prefix track")
              }

              private fun mux(vp: String, ap: String, fd: FileDescriptor, webm: Boolean) {
                  val vex = MediaExtractor()
                  vex.setDataSource(vp)
                  val aex = MediaExtractor()
                  aex.setDataSource(ap)
                  val vt = trackOf(vex, "video/")
                  val at = trackOf(aex, "audio/")
                  vex.selectTrack(vt)
                  aex.selectTrack(at)
                  val mx = MediaMuxer(fd, if (webm) MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM else MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val vi = mx.addTrack(vex.getTrackFormat(vt))
                  val ai = mx.addTrack(aex.getTrackFormat(at))
                  mx.start()
                  val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                  val info = MediaCodec.BufferInfo()
                  while (true) {
                      val vtm = vex.sampleTime
                      val atm = aex.sampleTime
                      if (vtm < 0 && atm < 0) break
                      val useV = vtm >= 0 && (atm < 0 || vtm <= atm)
                      val ex = if (useV) vex else aex
                      val sz = ex.readSampleData(buf, 0)
                      if (sz < 0) break
                      info.set(0, sz, ex.sampleTime, ex.sampleFlags)
                      mx.writeSampleData(if (useV) vi else ai, buf, info)
                      ex.advance()
                  }
                  mx.stop()
                  mx.release()
                  vex.release()
                  aex.release()
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Easy Downloader v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
