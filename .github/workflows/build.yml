              // ---------- clean player: the found video plays here, without the web page (so no ads at all) ----------
              // clean player: a small built-in page that only contains the video (hls.js plays streams with picture AND sound)
              private fun showClean(m: Media) {
                  stopClean()
                  val cw = WebView(this)
                  cw.settings.javaScriptEnabled = true
                  cw.settings.domStorageEnabled = true
                  cw.settings.mediaPlaybackRequiresUserGesture = false
                  cw.settings.userAgentString = UAD
                  cw.setBackgroundColor(Color.BLACK)
                  cw.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean = true
                  }
                  cw.webChromeClient = object : android.webkit.WebChromeClient() {
                      override fun onShowCustomView(v: View, cb: android.webkit.WebChromeClient.CustomViewCallback) {
                          fullBox.removeAllViews()
                          fullBox.addView(v, FrameLayout.LayoutParams(-1, -1))
                          fullBox.visibility = View.VISIBLE
                          fullCb = cb
                      }
                      override fun onHideCustomView() {
                          fullBox.removeAllViews()
                          fullBox.visibility = View.GONE
                          fullCb = null
                      }
                  }
                  cw.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun bad() {
                          runOnUiThread {
                              if (clean === cw && playerBox.visibility == View.VISIBLE) {
                                  showPageView()
                                  say("This video does not play here, so the web page is shown. You can still tap Download below.")
                              }
                          }
                      }
                  }, "C")
                  val src = m.url.replace("\\", "\\\\").replace("\"", "\\\"")
                  val html = "<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
                      "<style>html,body{margin:0;height:100%;background:#000}video{width:100%;height:100%;object-fit:contain}</style></head>" +
                      "<body><video id=\"v\" controls autoplay playsinline></video>" +
                      "<script src=\"https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js\"></script>" +
                      "<script>var u=\"" + src + "\",v=document.getElementById('v'),isHls=" + m.hls + ";" +
                      "var fail=function(){try{C.bad()}catch(e){}};" +
                      "if(isHls&&window.Hls&&Hls.isSupported()){var h=new Hls();h.on(Hls.Events.ERROR,function(e,d){if(d.fatal)fail()});h.loadSource(u);h.attachMedia(v)}" +
                      "else{v.src=u;v.onerror=fail}" +
                      "var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;v.play()});" +
                      "setTimeout(function(){if(!(v.currentTime>0))fail()},15000);</script></body></html>"
                  // same address as the site, so the video server accepts the request
                  cw.loadDataWithBaseURL(m.ref.ifEmpty { genPage }, html, "text/html", "utf-8", null)
                  playerBox.addView(cw, FrameLayout.LayoutParams(-1, -1))
                  clean = cw
                  cleanShown = true
                  playerBox.visibility = View.VISIBLE
                  viewBtn.visibility = View.VISIBLE
                  viewBtn.text = "Web page"
                  web?.evaluateJavascript("document.querySelectorAll('video').forEach(function(v){v.pause();v.muted=true})", null)
              }

              private fun showPageView() {
                  clean?.evaluateJavascript("try{document.getElementById('v').pause()}catch(e){}", null)
                  playerBox.visibility = View.GONE
                  viewBtn.text = "Player"
              }

              private fun stopClean() {
                  clean?.destroy()
                  clean = null
                  cleanShown = false
                  if (::playerBox.isInitialized) {
                      playerBox.removeAllViews()
                      playerBox.visibility = View.GONE
                  }
                  if (::viewBtn.isInitialized) viewBtn.visibility = View.GONE
              }

