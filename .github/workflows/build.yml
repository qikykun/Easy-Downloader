                  poll(my, 0)
              }

              private fun addGen(u: String, ref: String) {
                  if (!u.startsWith("http")) return
                  synchronized(genUrls) {
                      if (genUrls.size < 80 && genUrls.none { it == u }) {
                          genUrls.add(u)
                          genRef[u] = ref
                      }
                  }
              }

              // real video files start with known bytes; web pages and error pages do not
              private fun isVideo(h: ByteArray, n: Int): Boolean {
                  if (n < 4) return false
                  if (n >= 8) {
                      val box = String(h, 4, 4)
                      if (box == "ftyp") return !(n >= 12 && String(h, 8, 4) in setOf("M4A ", "avif", "avis", "heic", "heix", "mif1", "msf1"))
                      if (box == "moov" || box == "mdat" || box == "free" || box == "skip" || box == "wide") return true
                  }
                  val b0 = h[0].toInt() and 0xFF
                  if (b0 == 0x1A && (h[1].toInt() and 0xFF) == 0x45 && (h[2].toInt() and 0xFF) == 0xDF && (h[3].toInt() and 0xFF) == 0xA3) return true
                  if (b0 == 0x47 && String(h, 0, 3) != "GIF") return true
                  if (String(h, 0, 3) == "FLV") return true
                  if (n >= 12 && String(h, 0, 4) == "RIFF" && String(h, 8, 4) == "AVI ") return true
                  return false
              }

              // look at the first bytes and the size of a link without downloading it
              private fun probe(u: String, ref: String): Pair<String, Long> {
                  val c = open(u, ref, UAD)
                  c.setRequestProperty("Range", "bytes=0-15")
                  try {
                      val code = c.responseCode
                      if (code >= 400) return Pair("bad", -1L)
                      val cr = c.getHeaderField("Content-Range")
                      val size = if (cr != null && cr.contains("/")) (cr.substringAfter("/").trim().toLongOrNull() ?: -1L)
                          else if (code == 206) -1L else c.contentLengthLong
                      val h = ByteArray(16)
                      var n = 0
                      c.inputStream.use { i ->
                          while (n < 16) {
                              val r = i.read(h, n, 16 - n)
                              if (r < 0) break
                              n += r
                          }
                      }
                      val head = String(h, 0, n).trimStart('\uFEFF', ' ', '\n', '\r')
                      if (head.startsWith("#EXTM3U")) return Pair("hls", size)
                      return Pair(if (isVideo(h, n)) "video" else "bad", size)
                  } finally {
                      c.disconnect()
                  }
              }

              private fun checkGen(my: Int, list: List<String>) {
                  genChecking = true
                  Thread {
                      try {
                          for (u in list) {
                              if (my != gen) break
                              if (ADS.any { u.lowercase().contains(it) }) continue
                              val lp = u.lowercase().substringBefore("?")
                              if (Regex("\\.(ts|m4s|aac|m4a|vtt)$").containsMatchIn(lp) || Regex("(seg|segment|frag|chunk)[-_]?\\d").containsMatchIn(lp)) continue
                              val ref = genRef[u] ?: genPage
                              val r = try { probe(u, ref) } catch (e: Exception) { Pair("bad", -1L) }
                              if (r.first == "video" && (r.second < 0 || r.second >= 300000)) {
                                  synchronized(genGood) { genGood.add(Media(u, true, "", ref, size = r.second, gua = UAD)) }
                              } else if (r.first == "hls") {
                                  val body = try { txt(u, ref) } catch (e: Exception) { "" }
                                  val master = body.contains("#EXT-X-STREAM-INF")
                                  val seg = body.lines().map { it.trim() }.firstOrNull { it.isNotEmpty() && !it.startsWith("#") }?.lowercase() ?: ""
                                  // a list with only sound (players often load picture and sound separately)
                                  val audioOnly = !master && (u.lowercase().contains("audio") || seg.contains("audio") || Regex("\\.(aac|m4a|mp3)(\\?|$)").containsMatchIn(seg))
                                  synchronized(genGood) { genGood.add(Media(u, true, "", ref, hls = true, size = if (master) 1L else 0L, gua = UAD, label = if (audioOnly) "audio" else "")) }
                              }
                          }
                      } finally {
                          genChecking = false
                      }
                  }.start()
              }

              // the biggest real video file wins (= best quality); a stream list is used when there is no file
              private fun bestGen(good: List<Media>): Media? {
                  val files = good.filter { !it.hls }
                  val lists = good.filter { it.hls && it.label != "audio" }
                  val sounds = good.filter { it.hls && it.label == "audio" }
                  val f = files.maxByOrNull { it.size }
                  var l = lists.maxByOrNull { it.size }
                  // picture-only list: download its sound list too and join them
                  if (l != null) {
                      val others = good.filter { it.hls && it.url != l!!.url && it.size == 0L }.map { it.url }
                      val snd = if (l.size == 0L && sounds.isNotEmpty()) sounds[0].url else ""
                      l = Media(l.url, true, "", l.ref, hls = true, gua = UAD, audio = snd, alts = others, size = l.size)
                  }
                  return if (f != null && (l == null || f.size >= 20L * 1048576)) f else l ?: f
              }

              // last resort for Threads: read the public embed page without JavaScript
              // Instagram asked to log in: first try the ways that work without an account (post data and the embed page)
              private fun igRescue(my: Int) {
                  val link = lastLink
                  if (igRescueTried) { showLogin("Instagram", link); return }
                  igRescueTried = true
                  pollStop = true
                  say("Instagram asked to log in. Trying without login…")
                  val code = Regex("instagram\\.com/(?:[^/?#]+/)?(?:p|reels?|tv)/([A-Za-z0-9_-]+)").find(link)?.groupValues?.get(1)
                  Thread {
                      var r: Pair<String, List<Media>> = Pair("", emptyList())
                      igWhy = ""
                      if (code != null) {
                          r = try { igGql(code) } catch (e: Exception) { igWhy = "data: " + (e.message ?: "error").take(60); Pair("", emptyList()) }
                          if (r.second.isEmpty()) r = try { igEmbed(code) } catch (e: Exception) { igWhy += "; embed: " + (e.message ?: "error").take(60); Pair("", emptyList()) }
                      } else igWhy = "no post code in link"
                      runOnUiThread {
                          if (my != gen) return@runOnUiThread
                          if (r.second.isEmpty()) {
                              showLogin("Instagram", link)
                              status.text = "Instagram only shows this post to logged-in viewers." + if (igWhy.isNotEmpty()) "\n($igWhy)" else ""
                              return@runOnUiThread
                          }
                          if (r.first.isNotEmpty()) setSrc(r.first, "instagram")
                          if (r.second.any { it.video }) vetThen(my, r.second) else show(r.second)
                      }
                  }.start()
              }

              private fun igGql(code: String): Pair<String, List<Media>> {
                  val vars = "{\"shortcode\":\"$code\",\"fetch_tagged_user_count\":null,\"hoisted_comment_id\":null,\"hoisted_reply_id\":null}"
                  val u = "https://www.instagram.com/graphql/query/?doc_id=8845758582119845&variables=" + URLEncoder.encode(vars, "UTF-8")
                  val ck = CookieManager.getInstance().getCookie("https://www.instagram.com") ?: ""
                  val csrf = Regex("csrftoken=([^;]+)").find(ck)?.groupValues?.get(1) ?: ""
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", UAD)
                  c.setRequestProperty("X-IG-App-ID", "936619743392459")
                  c.setRequestProperty("X-ASBD-ID", "129477")
                  c.setRequestProperty("X-IG-WWW-Claim", "0")
                  c.setRequestProperty("X-Requested-With", "XMLHttpRequest")
                  c.setRequestProperty("X-CSRFToken", csrf)
                  c.setRequestProperty("Referer", "https://www.instagram.com/p/$code/")
                  c.setRequestProperty("Origin", "https://www.instagram.com")
                  c.setRequestProperty("Accept", "*/*")
                  if (ck.isNotEmpty()) c.setRequestProperty("Cookie", ck)
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  if (c.responseCode >= 400) { igWhy = "data: HTTP ${c.responseCode}"; return Pair("", emptyList()) }
                  val j = JSONObject(c.inputStream.bufferedReader().readText())
                  val n = j.optJSONObject("data")?.let { it.optJSONObject("xdt_shortcode_media") ?: it.optJSONObject("shortcode_media") }
                  if (n == null) { igWhy = "data: empty"; return Pair("", emptyList()) }
                  val r = igNodes(n)
                  if (r.second.isEmpty()) igWhy = "data: no files"
                  return r
              }

              private fun igEmbed(code: String): Pair<String, List<Media>> {
                  val html = open("https://www.instagram.com/p/$code/embed/captioned/", "", UA).inputStream.bufferedReader().readText()
                  val raw = Regex("\"contextJSON\":\"((?:[^\"\\\\]|\\\\.)*)\"").find(html)?.groupValues?.get(1)
                  if (raw != null) {
                      try {
                          val ctx = JSONObject(JSONObject("{\"c\":\"$raw\"}").getString("c"))
                          val n = findShortcode(ctx)
                          if (n != null) { val r = igNodes(n); if (r.second.isNotEmpty()) return r }
                      } catch (e: Exception) { }
                  }
                  // last resort: the pictures/videos written in the embed page itself
                  val clean = html.replace("&amp;", "&").replace("\\/", "/").replace("\\u0026", "&")
                  val user = Regex("\"username\":\"([A-Za-z0-9._]+)\"").find(clean)?.groupValues?.get(1) ?: ""
                  val out = LinkedHashMap<String, Media>()
                  for (m in Regex("https://[^\"'\\s<>\\\\]+").findAll(clean)) {
                      val u = m.value
                      val l = u.lowercase()
                      if (!(l.contains("cdninstagram.com") || l.contains("fbcdn.net"))) continue
                      if (l.contains("t51.2885-19") || l.contains("s150x150") || l.contains("s320x320") || l.contains("p150x150")) continue
                      if (l.contains("static.cdninstagram") || l.contains("rsrc.php") || !l.contains("/v/")) continue
                      val name = u.substringBefore("?").substringAfterLast("/")
                      if (l.contains(".mp4")) out.putIfAbsent(name, Media(u, true, "", "https://www.instagram.com/"))
                      else if (l.contains(".jpg") || l.contains(".webp") || l.contains(".heic")) out.putIfAbsent(name, Media(u, false, u, "https://www.instagram.com/"))
                  }
                  if (out.isEmpty()) igWhy += "; embed: no files"
                  return Pair(user, out.values.take(20).toList())
              }

              private fun findShortcode(o: Any?): JSONObject? {
                  if (o is JSONObject) {
                      if (o.has("shortcode") && (o.has("display_url") || o.has("video_url"))) return o
                      val ks = o.keys()
                      while (ks.hasNext()) { findShortcode(o.opt(ks.next()))?.let { return it } }
                  } else if (o is JSONArray) {
                      for (i in 0 until o.length()) findShortcode(o.opt(i))?.let { return it }
                  }
                  return null
              }

              // post data (graphql style) -> files: videos (with their sound file when given separately) and full-size photos
              private fun igNodes(n: JSONObject): Pair<String, List<Media>> {
                  val user = n.optJSONObject("owner")?.optString("username") ?: ""
                  val edges = n.optJSONObject("edge_sidecar_to_children")?.optJSONArray("edges")
                  val nodes = ArrayList<JSONObject>()
                  if (edges != null && edges.length() > 0) {
                      for (i in 0 until edges.length()) edges.optJSONObject(i)?.optJSONObject("node")?.let { nodes.add(it) }
                  } else nodes.add(n)
                  val out = ArrayList<Media>()
                  val ref = "https://www.instagram.com/"
                  for (x in nodes) {
                      val photo = best(x.optJSONArray("display_resources"))?.takeIf { it.isNotEmpty() } ?: x.optString("display_url")
                      val vu = x.optString("video_url")
                      if (x.optBoolean("is_video") && vu.startsWith("http")) {
                          val man = x.optJSONObject("dash_info")?.optString("video_dash_manifest") ?: ""
                          val d = if (man.isNotEmpty()) dashPair(man) else null
                          if (d != null) out.add(Media(d.first, true, photo, ref, audio = d.second, ua = UA, label = "dash", alts = listOf(vu)))
                          else out.add(Media(vu, true, photo, ref))
                      } else if (photo.startsWith("http")) out.add(Media(photo, false, photo, ref))
                  }
                  return Pair(user, out)
              }

              private fun thEmbed(user: String, code: String): List<Media> {
                  val html = try {
                      open("https://www.threads.com/@$user/post/$code/embed/", "", UAD).inputStream.bufferedReader().readText()
                  } catch (e: Exception) { return emptyList() }
                  val clean = html.replace("&amp;", "&").replace("\\/", "/").replace("\\u0026", "&")
                  val out = LinkedHashMap<String, Media>()
                  for (m in Regex("https://[^\"'\\s<>\\\\]+").findAll(clean)) {
                      val u = m.value
                      val l = u.lowercase()
                      if (!(l.contains("cdninstagram.com") || l.contains("fbcdn.net"))) continue
                      if (l.contains("t51.2885-19") || l.contains("s150x150") || l.contains("s320x320")) continue
                      val name = u.substringBefore("?").substringAfterLast("/")
                      if (l.contains(".mp4")) out.putIfAbsent(name, Media(u, true, "", "https://www.threads.com/"))
                      else if (l.contains(".jpg") || l.contains(".webp") || l.contains(".heic")) out.putIfAbsent(name, Media(u, false, u, "https://www.threads.com/"))
                  }
                  return out.values.take(20).toList()
              }

              private fun kinds(docs: List<String>): String =
