              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleShare(intent)
              }

              override fun onBackPressed() {
                  if (fullBox.visibility == View.VISIBLE) fullCb?.onCustomViewHidden()
                  else if (viewer.visibility == View.VISIBLE) closeViewer()
                  else if (selMode) exitSel()
                  else if (loginHost.visibility == View.VISIBLE) finishLogin(false)
                  else if (webHost.visibility == View.VISIBLE) webBack()
                  else if (page == 1) showPage(0)
                  else super.onBackPressed()
              }

              private fun handleShare(i: Intent?) {
                  if (i == null || i.action != Intent.ACTION_SEND) return
                  val t = i.getStringExtra(Intent.EXTRA_TEXT) ?: return
                  val link = LINK.find(t)?.value
                  if (link == null) {
                      status.text = "No supported link found in the shared text."
                      return
                  }
                  skipClipUntil = SystemClock.elapsedRealtime() + 2000
                  start(link)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || SystemClock.elapsedRealtime() < skipClipUntil) return
                  if (loginHost.visibility == View.VISIBLE) return
                  if (webHost.visibility == View.VISIBLE) return
                  if (viewer.visibility == View.VISIBLE) return
                  val link = clipLink() ?: return
                  if (link == lastLink) {
                      // already used: just put it back in the box (tap Download to run it again)
                      if (input.text.toString() != link) {
                          quiet = true
                          input.setText(link)
                          quiet = false
                      }
                      return
                  }
                  start(link)
              }

              private fun say(s: String) {
                  val g = dlGen.get()
                  if (g != null) note(s)
                  if (g != null && g != gen && webHost.visibility != View.VISIBLE) return
                  runOnUiThread {
                      status.text = s
                      loaderText.text = s
                      webStatus.text = s
                  }
              }

              private class Cancelled : IOException("Download cancelled")

              // called inside every download loop: stops right away after ✕ was pressed
              private fun chk() {
                  val t = dlTok.get() ?: return
                  if (t != cancelTok.get()) throw Cancelled()
              }

              private fun cancelDownloads() {
                  if (active.get() == 0) return
                  cancelTok.incrementAndGet()
                  dlText.text = "Cancelling…"
              }

              private fun note(text: String) {
                  runOnUiThread { if (active.get() > 0) dlText.text = text }
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastNote < 800) return
                  lastNote = now
                  try {
                      (getSystemService(NOTIFICATION_SERVICE) as android.app.NotificationManager).notify(DlService.ID, DlService.note(this, text, true))
                  } catch (e: Exception) {
                  }
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (viewer.visibility != View.VISIBLE && webHost.visibility != View.VISIBLE && loginHost.visibility != View.VISIBLE &&
                      fullBox.visibility != View.VISIBLE && loader.visibility != View.VISIBLE) swipe.onTouchEvent(ev)
                  return super.dispatchTouchEvent(ev)
              }

              private fun markTabs() {
                  val tabs = listOf(tabDl, tabFiles, tabHist)
                  for (k in tabs.indices) {
                      tabs[k].setTextColor(if (page == k) Color.rgb(46, 160, 67) else Color.GRAY)
                      tabs[k].setBackgroundColor(if (page == k) hiCol else Color.TRANSPARENT)
                  }
              }

              private fun showPage(p: Int) {
                  if (p == page) return
                  page = p
                  val w = resources.displayMetrics.widthPixels.toFloat()
                  content.animate().translationX(-p * w).setDuration(220).start()
                  filesPage.animate().translationX((1 - p) * w).setDuration(220).start()
                  histPage.animate().translationX((2 - p) * w).setDuration(220).start()
                  markTabs()
                  if (p == 1) refreshFiles()
                  if (p == 2) refreshHist()
              }

              // ---------- History ----------
              private fun loadHist(): JSONArray = try {
                  JSONArray(getSharedPreferences("easydl", MODE_PRIVATE).getString("hist", "[]") ?: "[]")
              } catch (e: Exception) { JSONArray() }

              private fun saveHist(a: JSONArray) {
                  getSharedPreferences("easydl", MODE_PRIVATE).edit().putString("hist", a.toString()).apply()
              }

              private fun addHist(link: String, src: String, state: String) {
                  if (link.isEmpty()) return
                  runOnUiThread {
                      val old = loadHist()
                      val a = JSONArray()
                      a.put(JSONObject().put("link", link).put("src", src).put("state", state.take(160)).put("time", System.currentTimeMillis()))
                      for (i in 0 until old.length()) {
                          if (a.length() >= 200) break
                          val o = old.optJSONObject(i) ?: continue
                          if (o.optString("link") != link) a.put(o)
                      }
                      saveHist(a)
                      if (page == 2) refreshHist()
                  }
              }

              private fun refreshHist() {
                  histList.removeAllViews()
                  val a = loadHist()
                  if (a.length() == 0) {
                      histList.addView(TextView(this).apply { text = "No history yet."; setPadding(0, dp(12), 0, 0) })
                      return
                  }
                  val fmt = java.text.SimpleDateFormat("d MMM yyyy, HH:mm", java.util.Locale.getDefault())
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      val link = o.optString("link")
                      val st = o.optString("state")
                      val good = st.startsWith("Done")
                      histList.addView(LinearLayout(this).apply {
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(8), 0, dp(8))
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL
                              addView(TextView(this@MainActivity).apply { text = parseSrc(o.optString("src") + "_000000000000").let { val t = accText(it); if (it.first.isNotEmpty()) t + " · " + platName(it.second) else t }; setTextColor(fgCol); textSize = 15f })
                              addView(TextView(this@MainActivity).apply {
                                  text = (if (good) "✓ " else "✕ ") + st
                                  setTextColor(if (good) Color.rgb(46, 160, 67) else Color.rgb(211, 47, 47))
                                  textSize = 13f
                              })
                              addView(TextView(this@MainActivity).apply { text = link; setTextColor(subCol); textSize = 12f; maxLines = 1; ellipsize = android.text.TextUtils.TruncateAt.END })
                              addView(TextView(this@MainActivity).apply { text = fmt.format(java.util.Date(o.optLong("time"))); setTextColor(subCol); textSize = 12f })
                          }, LinearLayout.LayoutParams(0, -2, 1f))
                          addView(Button(this@MainActivity).apply {
                              text = "Retry"
                              setOnClickListener {
                                  showPage(0)
                                  lastLink = ""
                                  start(link)
                              }
                          })
                      }, LinearLayout.LayoutParams(-1, -2))
                  }
              }

              private fun askPermissions() {
                  val want = if (android.os.Build.VERSION.SDK_INT >= 33)
                      arrayOf("android.permission.POST_NOTIFICATIONS", "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO")
                  else arrayOf("android.permission.READ_EXTERNAL_STORAGE")
                  val need = want.filter { checkSelfPermission(it) != android.content.pm.PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (page == 1) refreshFiles()
              }

              // ---------- My files ----------
              private fun queryFiles(): List<FileItem> {
                  val out = ArrayList<FileItem>()
                  for (pass in 0..1) {
                      val col = if (pass == 0) MediaStore.Images.Media.EXTERNAL_CONTENT_URI else MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                      val proj = arrayOf(android.provider.BaseColumns._ID, MediaStore.MediaColumns.DATE_ADDED, MediaStore.MediaColumns.DISPLAY_NAME,
                          MediaStore.MediaColumns.SIZE, MediaStore.MediaColumns.DURATION)
                      try {
                          contentResolver.query(col, proj, MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?", arrayOf("%EasyDownloader%"), null)?.use { c ->
                              while (c.moveToNext()) {
                                  out.add(FileItem(android.content.ContentUris.withAppendedId(col, c.getLong(0)), pass == 1,
                                      c.getString(2) ?: "", c.getLong(3), c.getLong(1), c.getLong(4)))
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out.sortedByDescending { it.date }
              }

              // the account / site the file came from (first part of the file name)
              private fun srcLabel(name: String): String = accText(parseSrc(name))

              private fun mbText(b: Long): String = if (b >= 1048576) String.format(java.util.Locale.US, "%.1f MB", b / 1048576.0) else "${b / 1024} KB"

              private fun durText(ms: Long): String {
                  val t = ms / 1000
                  return if (t >= 3600) String.format(java.util.Locale.US, "%d:%02d:%02d", t / 3600, t % 3600 / 60, t % 60)
                      else String.format(java.util.Locale.US, "%d:%02d", t / 60, t % 60)
              }

              private fun refreshFiles() {
                  Thread {
                      val all = queryFiles()
                      runOnUiThread {
                          allFiles = all
                          selected.retainAll(all.map { it.uri }.toSet())
                          if (selected.isEmpty()) exitSel()
                          renderFiles()
                      }
                  }.start()
              }

              private fun renderFiles() {
                  if (!::filesList.isInitialized) return
                  filesList.removeAllViews()
                  selViews.clear()
                  val q = searchBox.text.toString().trim().lowercase()
                  var shown = allFiles.filter { f ->
                      (fType == 0 || (fType == 1 && !f.video) || (fType == 2 && f.video)) &&
                          (fPlat.isEmpty() || parseSrc(f.name).second == fPlat) &&
                          (q.isEmpty() || f.name.lowercase().contains(q) || srcLabel(f.name).lowercase().contains(q) || platName(parseSrc(f.name).second).lowercase().contains(q))
                  }
                  shown = when (fSort) {
                      1 -> shown.sortedBy { it.date }
                      2 -> shown.sortedByDescending { it.size }
                      3 -> shown.sortedBy { it.size }
                      4 -> shown.sortedBy { srcLabel(it.name).lowercase() }
                      else -> shown
                  }
                  filesInfo.text = if (allFiles.isEmpty()) "Nothing downloaded yet."
                      else "${shown.size} of ${allFiles.size} file(s). Tap to open, press and hold to select."
                  val fmt = java.text.SimpleDateFormat("d MMM yyyy, HH:mm", java.util.Locale.getDefault())
                  val th = dp(72)
                  for (f in shown.take(500)) {
                      val img = ImageView(this).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.LTGRAY)
                      }
                      val thumb = FrameLayout(this)
                      thumb.addView(img, FrameLayout.LayoutParams(-1, -1))
                      if (f.video) thumb.addView(TextView(this).apply {
                          text = "▶"
                          textSize = 11f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.argb(150, 0, 0, 0))
                          setPadding(dp(4), dp(1), dp(4), dp(1))
                      }, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START))
                      val mark = TextView(this).apply {
                          text = "✓"
                          textSize = 22f
                          setTextColor(Color.rgb(46, 160, 67))
                          setPadding(dp(8), 0, dp(4), 0)
                          visibility = if (f.uri in selected) View.VISIBLE else View.GONE
                      }
                      val row = LinearLayout(this).apply {
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(6), 0, dp(6))
                          addView(thumb, LinearLayout.LayoutParams(th, th))
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL
                              setPadding(dp(12), 0, 0, 0)
                              val ps = parseSrc(f.name)
                              addView(TextView(this@MainActivity).apply { text = accText(ps); textSize = 15f; setTextColor(fgCol); maxLines = 1 })
                              addView(TextView(this@MainActivity).apply {
                                  text = (if (ps.first.isNotEmpty() && ps.second.isNotEmpty()) platName(ps.second) + " · " else "") + (if (f.video) "Video" else "Photo") + (if (f.video && f.dur > 0) " · " + durText(f.dur) else "") + " · " + mbText(f.size)
                                  textSize = 13f
                                  setTextColor(subCol)
                              })
                              addView(TextView(this@MainActivity).apply { text = fmt.format(java.util.Date(f.date * 1000)); textSize = 12f; setTextColor(subCol) })
                          }, LinearLayout.LayoutParams(0, -2, 1f))
                          addView(mark)
                          setBackgroundColor(if (f.uri in selected) hiCol else Color.TRANSPARENT)
                          setOnClickListener { if (selMode) toggleSel(f.uri) else openViewer(f) }
                          setOnLongClickListener {
                              selMode = true
                              toggleSel(f.uri)
                              true
                          }
                      }
                      selViews[f.uri] = row
                      filesList.addView(row, LinearLayout.LayoutParams(-1, -2))
                      thumbPool.execute {
                          try {
                              val b = contentResolver.loadThumbnail(f.uri, android.util.Size(th, th), null)
                              runOnUiThread { img.setImageBitmap(b) }
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              // drop-down: what to show (type and where it came from)
              private fun filterMenu(b: Button) {
                  val pm = android.widget.PopupMenu(this, b)
                  val types = listOf("All files", "Photos only", "Videos only")
                  types.forEachIndexed { k, n -> pm.menu.add(0, k, k, (if (k == fType && fPlat.isEmpty()) "✓ " else "") + n) }
                  val plats = allFiles.map { parseSrc(it.name).second }.filter { it.isNotEmpty() }.distinct().sortedBy { platName(it).lowercase() }
                  plats.forEachIndexed { k, pl -> pm.menu.add(1, 100 + k, 100 + k, (if (pl == fPlat) "✓ " else "") + "From " + platName(pl)) }
                  pm.setOnMenuItemClickListener { mi ->
                      if (mi.itemId < 100) {
                          fType = mi.itemId
                          fPlat = ""
                      } else fPlat = plats[mi.itemId - 100]
                      b.text = "Filter: " + (if (fPlat.isNotEmpty()) platName(fPlat) else listOf("All", "Photos", "Videos")[fType]) + " ▾"
                      renderFiles()
                      true
                  }
                  pm.show()
              }

              private fun markRow(u: Uri) {
                  val row = selViews[u] as? LinearLayout ?: return
                  row.setBackgroundColor(if (u in selected) hiCol else Color.TRANSPARENT)
                  row.getChildAt(row.childCount - 1).visibility = if (u in selected) View.VISIBLE else View.GONE
              }

              private fun toggleSel(u: Uri) {
                  if (!selected.remove(u)) selected.add(u)
                  markRow(u)
                  if (selected.isEmpty()) exitSel()
                  else {
                      selMode = true
                      selBar.visibility = View.VISIBLE
                      selText.text = "${selected.size} selected"
                  }
              }

              private fun exitSel() {
                  selMode = false
                  val was = ArrayList(selected)
                  selected.clear()
                  for (u in was) markRow(u)
                  if (::selBar.isInitialized) selBar.visibility = View.GONE
              }

              // asks first, so nothing is deleted by accident
              private fun askDelete(list: List<Uri>) {
                  if (list.isEmpty()) return
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Delete ${list.size} file(s)?")
                      .setMessage("They will be removed from Easy Downloader and your gallery, and moved to your phone's trash.")
                      .setNegativeButton("Cancel", null)
                      .setPositiveButton("Delete") { _, _ -> trashFiles(list) }
                      .show()
              }

              private fun trashFiles(list: List<Uri>) {
                  Thread {
                      val left = ArrayList<Uri>()
                      for (u in list) {
                          try {
                              val done = if (android.os.Build.VERSION.SDK_INT >= 30) {
                                  val v = ContentValues()
                                  v.put(MediaStore.MediaColumns.IS_TRASHED, 1)
                                  contentResolver.update(u, v, null, null) > 0
                              } else contentResolver.delete(u, null, null) > 0
                              if (!done) left.add(u)
                          } catch (e: Exception) {
                              left.add(u)
                          }
                      }
                      runOnUiThread {
                          exitSel()
                          if (left.isNotEmpty() && android.os.Build.VERSION.SDK_INT >= 30) {
                              // files from an older install need the phone's own permission screen
                              try {
                                  val pi = MediaStore.createTrashRequest(contentResolver, left, true)
                                  startIntentSenderForResult(pi.intentSender, 42, null, 0, 0, 0)
                              } catch (e: Exception) {
                                  filesInfo.text = "Some files could not be deleted."
                              }
                          } else if (left.isNotEmpty()) filesInfo.text = "Some files could not be deleted."
                          refreshFiles()
                      }
                  }.start()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 42) refreshFiles()
              }

              private fun openViewer(f: FileItem) {
                  viewer.removeAllViews()
                  if (f.video) {
                      val vv = android.widget.VideoView(this)
                      val area = FrameLayout(this)
                      area.addView(vv, FrameLayout.LayoutParams(-1, -1, Gravity.CENTER))
                      viewer.addView(area, FrameLayout.LayoutParams(-1, -1).apply { setMargins(0, dp(96), 0, dp(120)) })
                      val mc = android.widget.MediaController(this)
                      mc.setAnchorView(area)
                      vv.setMediaController(mc)
                      vv.setVideoURI(f.uri)
                      vv.setOnPreparedListener { vv.start(); mc.show(4000) }
                  } else {
                      val iv = ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_CENTER }
                      viewer.addView(iv, FrameLayout.LayoutParams(-1, -1))
                      Thread {
                          try {
                              val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              contentResolver.openInputStream(f.uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                              var ss = 1
                              val maxSide = maxOf(resources.displayMetrics.widthPixels, resources.displayMetrics.heightPixels) * 2
                              while (maxOf(o.outWidth, o.outHeight) / ss > maxSide) ss *= 2
                              val o2 = BitmapFactory.Options().apply { inSampleSize = ss }
                              val b = contentResolver.openInputStream(f.uri)?.use { BitmapFactory.decodeStream(it, null, o2) }
                              runOnUiThread { iv.setImageBitmap(b) }
                          } catch (e: Exception) {
                          }
                      }.start()
                  }
                  viewer.addView(Button(this).apply {
                      text = "✕"
                      setOnClickListener { closeViewer() }
                  }, FrameLayout.LayoutParams(dp(56), dp(56), Gravity.TOP or Gravity.END).apply { setMargins(0, dp(32), dp(8), 0) })
                  viewer.addView(Button(this).apply {
                      text = "🗑"
                      setOnClickListener {
                          closeViewer()
                          askDelete(listOf(f.uri))
                      }
                  }, FrameLayout.LayoutParams(dp(56), dp(56), Gravity.TOP or Gravity.START).apply { setMargins(dp(8), dp(32), 0, 0) })
                  viewer.visibility = View.VISIBLE
              }

              private fun closeViewer() {
                  for (i in 0 until viewer.childCount) {
                      val c = viewer.getChildAt(i)
                      if (c is FrameLayout && c.childCount > 0) (c.getChildAt(0) as? VideoView)?.stopPlayback()
                  }
                  viewer.visibility = View.GONE
                  viewer.removeAllViews()
              }

              private fun closeWeb() {
                  if (webHost.visibility != View.VISIBLE) return
                  stopClean()
                  webHost.visibility = View.GONE
                  webBox.removeAllViews()
                  web?.destroy()
                  web = null
              }

