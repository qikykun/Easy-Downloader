              }

              // shows every TikTok quality (also the HD copy from the helper service) so you can pick one
              private fun ttQuality(my: Int, web0: List<Media>, first: Media) {
                  pollStop = true
                  say("Getting the qualities…")
                  val page = lastLink
                  Thread {
                      val opts = ArrayList<Media>()
                      try {
                          Thread.sleep(1100)
                          val d = ttData(page)
                          if (d != null) {
                              val abs = { u: String -> if (u.startsWith("/")) "https://www.tikwm.com$u" else u }
                              val hd = d.optString("hdplay")
                              if (hd.isNotEmpty()) opts.add(Media(abs(hd), true, first.thumb, "", size = d.optLong("hd_size"), itag = 100000,
                                  label = "HD (best)" + mb(d.optLong("hd_size")) + " · no watermark"))
                              val pl = d.optString("play")
                              if (pl.isNotEmpty() && pl != hd) opts.add(Media(abs(pl), true, first.thumb, "", size = d.optLong("size"), itag = 1,
                                  label = "Normal" + mb(d.optLong("size")) + " · no watermark"))
                          }
                      } catch (e: Exception) {
                      }
                      opts.addAll(web0)
                      // measure every option and show the real size; the same file is listed once
                      val measured = ArrayList<Media>()
                      val sizes = HashSet<Long>()
                      for (m in opts) {
                          val fu = if (m.url.contains("tikwm.com")) (try { finalUrl(m.url) } catch (e: Exception) { m.url }) else m.url
                          val tk = try { tracksAt(fu, m.ref) } catch (e: Exception) { null }
                          val sz = tk?.size ?: -1L
                          val real = if (sz > 0) sz else m.size
                          if (real > 0 && !sizes.add(real)) continue
                          if (tk != null && tk.known && !tk.a) continue
                          val base = m.label.replace(Regex(" · [0-9]+ MB"), "")
                          val lab = if (real > 0) base.substringBefore(" · no watermark") + mb(real) + (if (base.contains("no watermark")) " · no watermark" else "") else base
                          measured.add(Media(m.url, true, m.thumb, m.ref, alts = m.alts, size = real, itag = m.itag, label = lab))
                      }
                      val sorted = measured.sortedByDescending { it.size }
                      runOnUiThread {
                          if (my == gen) {
                              if (sorted.isEmpty()) show(listOf(first))
                              else {
                                  // ready-chosen: the sharpest H.265 file without watermark (same kind TikTok itself plays)
                                  val nw = sorted.filter { it.label.contains("no watermark") }
                                  val best = nw.filter { it.label.contains("H.265") && it.itag in 1..9999 }
                                      .maxWithOrNull(compareBy<Media> { it.itag }.thenBy { it.size }) ?: nw.firstOrNull()
                                  showYt(sorted, accText(parseSrc(srcName + "_000000000000")), if (best == null) 0 else sorted.indexOf(best))
                                  list.addView(TextView(this).apply {
                                      text = "H.265 gives a sharper picture in a smaller file. TikTok only gives some qualities to logged-in viewers."
                                      setPadding(0, dp(12), 0, dp(4))
                                      setTextColor(subCol)
                                  })
                                  list.addView(Button(this).apply {
                                      text = if (hasCookie("https://www.tiktok.com", "sessionid=")) "Logged in to TikTok ✓" else "Log in to TikTok for more qualities (once)"
                                      setOnClickListener { showLogin("TikTok", page) }
                                  })
                              }
                          }
                      }
                  }.start()
              }

              private fun d0(l: List<Media>) = l.none { it.itag >= 100000 }

              private fun finalUrl(u0: String): String {
                  var u = u0
                  for (k in 0 until 6) {
                      val c = URL(u).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.setRequestProperty("User-Agent", UAD)
                      c.setRequestProperty("Range", "bytes=0-0")
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      try {
                          val code = c.responseCode
                          if (code in 300..399) {
                              val loc = c.getHeaderField("Location") ?: return u
                              u = URL(URL(u), loc).toString()
                          } else return u
                      } finally {
                          c.disconnect()
                      }
                  }
                  return u
              }

              private fun ttData(page: String): JSONObject? {
                  for (t in 0..2) {
                      // the free service allows about 1 request per second
                      if (t > 0) Thread.sleep(1500)
                      try {
                          val r = ttCall(page)
                          if (r.optInt("code", -1) == 0 && r.optJSONObject("data") != null) { ttNote = ""; return r.optJSONObject("data") }
                          ttNote = r.optString("msg").ifEmpty { "no data" }
                      } catch (e: Exception) {
                          ttNote = e.message ?: "network error"
                      }
                  }
                  return null
              }

              // public TikTok helper service (the same kind other downloader apps use)
              @Volatile private var ttNote = ""
              @Volatile private var igInfo = ""
              private val ttOpts = ArrayList<Media>()

              private fun ttCall(page: String): JSONObject {
                  val c = URL("https://www.tikwm.com/api/").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.setRequestProperty("User-Agent", UAD)
                  c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8")
                  c.setRequestProperty("Accept", "application/json")
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  c.outputStream.use { it.write(("url=" + URLEncoder.encode(page, "UTF-8") + "&hd=1&count=12&cursor=0&web=1").toByteArray()) }
                  if (c.responseCode >= 400) throw IOException("HTTP ${c.responseCode}")
                  return JSONObject(c.inputStream.bufferedReader().readText())
              }

              private fun ttBackup(page: String): List<Media> {
                  val d = ttData(page) ?: return emptyList()
                  val abs = { u: String -> if (u.startsWith("/")) "https://www.tikwm.com$u" else u }
                  d.optJSONObject("author")?.optString("unique_id")?.takeIf { it.isNotEmpty() }?.let { setSrc(it, "tiktok") }
                  val imgs = d.optJSONArray("images")
                  if (imgs != null && imgs.length() > 0) {
                      val out = ArrayList<Media>()
                      for (i in 0 until imgs.length()) { val u = imgs.optString(i); if (u.startsWith("http")) out.add(Media(u, false, u)) }
                      return out
                  }
                  val hdp = d.optString("hdplay")
                  if (hdp.isEmpty()) ttNote = "TikTok has no HD copy of this video"
                  val urls = listOf(hdp, d.optString("play")).filter { it.isNotEmpty() }.map(abs).distinct()
                  if (urls.isEmpty()) return emptyList()
                  return listOf(Media(urls[0], true, abs(d.optString("cover")), alts = urls.drop(1)))
              }

              private fun withNet(found: List<Media>): List<Media> {
                  val net = synchronized(netVideos) { ArrayList(netVideos) }
                  if (net.isEmpty()) return found
                  val have = found.map { it.url.substringBefore("?") }.toSet()
                  val extra = net.filter { it.substringBefore("?") !in have }
                      .map { Media(it, true, found[0].thumb, "https://www.tiktok.com/", live = true) }
                  return found + extra
              }

              // opens the photo viewer of a Facebook album and flips through the photos so all of them get loaded
              private fun fbNudge(w: WebView) {
                  w.evaluateJavascript("""(function(){
          if(!window.__o){var a=document.querySelector('a[href*="/photo"],a[href*="photo.php"],a[href*="pcb."]');if(a){window.__o=1;a.click()}return}
          var t=document.activeElement||document.body;
          ['keydown','keyup'].forEach(function(n){var e=new KeyboardEvent(n,{key:'ArrowRight',code:'ArrowRight',keyCode:39,which:39,bubbles:true});t.dispatchEvent(e);document.dispatchEvent(e)});
          var nx=document.querySelector('[aria-label="Next photo"],[aria-label="Next"]');if(nx)nx.click()})()""", null)
              }

              private fun jsonRoots(d: String): List<JSONObject> {
                  val s = d.trim().removePrefix("for (;;);")
                  val roots = ArrayList<JSONObject>()
                  try {
                      roots.add(JSONObject(s))
                  } catch (e: Exception) {
                      for (line in s.split("\n")) {
                          try { roots.add(JSONObject(line)) } catch (e2: Exception) { }
                      }
                  }
                  return roots
              }

              // ----- TikTok -----
              private fun parseTT(docs: List<String>, id: String): List<Media> {
                  for (d in docs) {
                      for (r in jsonRoots(d)) {
                          val item = findItem(r, id) ?: continue
                          val res = collectTT(item)
                          if (res.isNotEmpty()) return res
                      }
                  }
                  return emptyList()
              }

              private fun findItem(n: Any?, id: String): JSONObject? {
                  if (n is JSONObject) {
                      val s = n.optJSONObject("itemStruct")
                      if (s != null && (id.isEmpty() || s.optString("id") == id)) return s
                      for (k in n.keys()) findItem(n.opt(k), id)?.let { return it }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) findItem(n.opt(i), id)?.let { return it }
                  }
                  return null
              }

              // every link that looks like a video file inside some JSON (used to find live photo clips)
              private fun videoUrls(n: Any?, skip: Set<String>, out: LinkedHashSet<String> = LinkedHashSet()): List<String> {
                  if (n is JSONObject) {
                      for (k in n.keys()) {
                          if (k in skip) continue
                          videoUrls(n.opt(k), skip, out)
                      }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) videoUrls(n.opt(i), skip, out)
                  } else if (n is String && n.startsWith("http")) {
                      val l = n.lowercase()
                      if (!l.contains("audio") && (l.contains("mime_type=video") || l.contains("/video/tos") || Regex("\\.mp4(\\?|$)").containsMatchIn(l))) out.add(n)
                  }
                  return out.toList()
              }

              private fun keyList(o: JSONObject?): String {
                  if (o == null) return "-"
                  val l = ArrayList<String>()
                  for (k in o.keys()) l.add(k)
                  return l.take(25).joinToString(",")
              }

              private fun collectTT(item: JSONObject): List<Media> {
                  val ref = "https://www.tiktok.com/"
                  val out = ArrayList<Media>()
                  val ip = item.optJSONObject("imagePost")
                  val imgs = ip?.optJSONArray("images")
                  if (imgs != null && imgs.length() > 0) {
                      var live = 0
                      for (i in 0 until imgs.length()) {
                          val o = imgs.optJSONObject(i) ?: continue
                          val ul = o.optJSONObject("imageURL")?.optJSONArray("urlList")
                          var u = ""
                          if (ul != null) for (k in 0 until ul.length()) {
                              val c = ul.optString(k)
                              if (c.startsWith("http") && !c.lowercase().contains("watermark")) { u = c; break }
                          }
                          if (u.isEmpty()) u = ul?.optString(0) ?: ""
                          val vs = videoUrls(o, emptySet())
                          if (vs.isNotEmpty()) {
                              out.add(Media(vs[0], true, u, ref, live = true, alts = vs.drop(1), still = u))
                              live++
                          } else if (u.isNotEmpty()) {
                              out.add(Media(u, false, u, ref))
                          }
                      }
                      if (live == 0) {
                          val first = out.firstOrNull()?.thumb ?: ""
                          for (u in videoUrls(item, setOf("music")).distinct().take(12)) {
                              out.add(Media(u, true, first, ref, live = true))
                              live++
                          }
                      }
                      if (live == 0) {
                          diag = "TikTok's web page lists photos only. If this post has live photos, their clips are not included in the web data."
                      }
                      return out
                  }
                  val au = item.optJSONObject("author")?.optString("uniqueId") ?: item.optString("author")
                  if (au.isNotEmpty() && !au.startsWith("{")) setSrc(au, "tiktok")
                  val v = item.optJSONObject("video") ?: return out
                  val h264 = ArrayList<Pair<Long, String>>()
                  val other = ArrayList<Pair<Long, String>>()
                  val rates = v.optJSONArray("bitrateInfo")
                  ttOpts.clear()
                  val cov0 = v.optString("cover").ifEmpty { v.optString("originCover") }
                  if (rates != null) {
                      for (i in 0 until rates.length()) {
                          val r = rates.optJSONObject(i) ?: continue
                          val pa = r.optJSONObject("PlayAddr")
                          val u = pa?.optJSONArray("UrlList")?.optString(0) ?: ""
                          if (u.isEmpty()) continue
                          val hgt = minOf(pa!!.optInt("Width"), pa.optInt("Height")).let { if (it <= 0) maxOf(pa.optInt("Width"), pa.optInt("Height")) else it }
                          val sz = pa.optLong("DataSize")
                          val cdc = if (r.optString("CodecType").contains("264")) "H.264" else "H.265"
                          ttOpts.add(Media(u, true, cov0, ref, size = maxOf(sz, 0L), itag = hgt,
                              label = (if (hgt > 0) "${hgt}p · " else "") + cdc + mb(sz) + " · no watermark"))
                          val e = Pair(r.optLong("Bitrate"), u)
                          if (r.optString("CodecType").contains("264")) h264.add(e) else other.add(e)
                      }
                  }
                  val urls = ArrayList<String>()
                  (h264 + other).sortedByDescending { it.first }.forEach { urls.add(it.second) }
                  // downloadAddr is the copy WITH the TikTok watermark: only used when nothing else exists
                  val wm = v.optString("downloadAddr").takeIf { it.startsWith("http") }
                  if (wm != null) ttOpts.add(Media(wm, true, cov0, ref, itag = 50000, label = "With TikTok watermark"))
                  v.optString("playAddr").takeIf { it.startsWith("http") }?.let { urls.add(it) }
                  if (urls.isEmpty()) other.sortedByDescending { it.first }.forEach { urls.add(it.second) }
                  // newer TikTok pages keep the links in other places: take every video link inside the video data
                  if (urls.isEmpty()) urls.addAll(videoUrls(v, setOf("cover", "originCover", "dynamicCover", "shareCover", "subtitleInfos", "claInfo")))
                  if (urls.isEmpty() && wm != null) urls.add(wm)
                  val all = urls.distinct().take(10)
                  val cover = v.optString("cover").ifEmpty { v.optString("originCover") }
                  // the app later measures every candidate and downloads the biggest file (highest quality)
                  if (all.isNotEmpty()) out.add(Media(all[0], true, cover, ref, alts = all.drop(1), page = lastLink))
                  return out
              }

              // ----- Threads / Instagram posts -----
              private fun parseTh(docs: List<String>, code: String): List<Media> {
                  for (d in docs) {
                      for (r in jsonRoots(d)) {
                          val p = findPost(r, code) ?: continue
                          val res = collectTh(p)
                          if (res.isNotEmpty()) return res
                      }
                  }
                  return emptyList()
              }

              private fun findPost(n: Any?, code: String): JSONObject? {
                  if (n is JSONObject) {
                      if ((code.isEmpty() || n.optString("code") == code) &&
                          (n.has("image_versions2") || n.has("video_versions") || n.has("carousel_media"))) return n
                      for (k in n.keys()) findPost(n.opt(k), code)?.let { return it }
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) findPost(n.opt(i), code)?.let { return it }
                  }
                  return null
              }

              private fun collectTh(p: JSONObject): List<Media> {
                  val out = ArrayList<Media>()
                  val un = p.optJSONObject("user")?.optString("username") ?: p.optJSONObject("owner")?.optString("username") ?: ""
                  if (un.isNotEmpty()) setSrc(un, if (plat == "th") "threads" else "instagram")
                  val car = p.optJSONArray("carousel_media")
                  if (car != null && car.length() > 0) {
                      for (i in 0 until car.length()) oneTh(car.optJSONObject(i))?.let { out.add(it) }
                  } else {
                      oneTh(p)?.let { out.add(it) }
                  }
                  return out
              }

              private fun oneTh(o: JSONObject?): Media? {
                  if (o == null) return null
                  val thumb = best(o.optJSONObject("image_versions2")?.optJSONArray("candidates")) ?: ""
                  val vids = cands(o.optJSONArray("video_versions"))
                  val dash = dashPair(o.optString("video_dash_manifest"))
                  if (dash != null) return Media(dash.first, true, thumb, audio = dash.second, ua = UA, label = "dash", alts = vids)
                  return if (vids.isNotEmpty()) Media(vids[0], true, thumb, alts = vids.drop(1))
                  else if (thumb.isNotEmpty()) Media(thumb, false, thumb)
                  else null
              }

              // DASH list (picture and sound in separate files): best picture + best sound
              private class Rep(val url: String, val audio: Boolean, val codec: String, val bw: Long, val h: Int = 0)

              private fun dashReps(xml: String): List<Rep> {
                  val out = ArrayList<Rep>()
                  if (xml.isEmpty() || !xml.contains("<Representation")) return out
                  for (m in Regex("<Representation([^>]*)>(.*?)</Representation>", RegexOption.DOT_MATCHES_ALL).findAll(xml)) {
                      val at = m.groupValues[1]
                      val url = Regex("<BaseURL>(.*?)</BaseURL>", RegexOption.DOT_MATCHES_ALL).find(m.groupValues[2])?.groupValues?.get(1)
                          ?.replace("&amp;", "&")?.trim() ?: continue
                      val bw = Regex("bandwidth=\"(\\d+)\"").find(at)?.groupValues?.get(1)?.toLongOrNull() ?: 0L
                      val set = xml.substring(0, m.range.first).substringAfterLast("<AdaptationSet")
                      val mime = Regex("mimeType=\"([^\"]+)\"").find(at)?.groupValues?.get(1)
                          ?: Regex("mimeType=\"([^\"]+)\"").find(set)?.groupValues?.get(1)
                          ?: Regex("contentType=\"([^\"]+)\"").find(set)?.groupValues?.get(1) ?: ""
                      val codec = Regex("codecs=\"([^\"]+)\"").find(at)?.groupValues?.get(1) ?: Regex("codecs=\"([^\"]+)\"").find(set)?.groupValues?.get(1) ?: ""
                      val hh = Regex("\\bheight=\"(\\d+)\"").find(at)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                      if (mime.startsWith("audio") || mime.startsWith("video")) out.add(Rep(url, mime.startsWith("audio"), codec, bw, hh))
                  }
                  return out
              }

              // best picture (H.264/H.265 first, because those join into MP4 everywhere) + best sound
              private fun dashPair(xml: String): Pair<String, String>? {
                  val r = dashReps(xml)
                  val a = r.filter { it.audio }.maxByOrNull { it.bw } ?: return null
                  val vs = r.filter { !it.audio }
                  val top = vs.maxOfOrNull { it.h } ?: return null
                  val v = vs.filter { (it.codec.startsWith("avc") || it.codec.startsWith("hvc") || it.codec.startsWith("hev")) && it.h * 10 >= top * 9 }.maxByOrNull { it.bw }
                      ?: vs.filter { it.h == top }.maxByOrNull { it.bw } ?: return null
                  return Pair(v.url, a.url)
              }

              // all video links of a post, biggest picture first (entries without a picture size are usually audio only)
              private fun cands(a: JSONArray?): List<String> {
                  if (a == null) return emptyList()
                  val l = ArrayList<Pair<Long, String>>()
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      val u = o.optString("url")
                      if (u.isEmpty()) continue
                      l.add(Pair(o.optLong("width") * o.optLong("height"), u))
                  }
                  return l.sortedByDescending { it.first }.map { it.second }
              }

              private fun kindOf(h: ByteArray, n: Int): String {
                  if (n >= 3 && h[0] == 'I'.code.toByte() && h[1] == 'D'.code.toByte() && h[2] == '3'.code.toByte()) return "audio"
                  if (n >= 2 && (h[0].toInt() and 0xFF) == 0xFF && (h[1].toInt() and 0xE0) == 0xE0) return "audio"
                  if (n >= 12 && String(h, 4, 4) == "ftyp" && String(h, 8, 4) == "M4A ") return "audio"
                  return "other"
              }

              // read the first bytes of a file to see what it really is
              private fun sniff(u: String, ref: String): String {
                  val c = open(u, ref)
                  c.setRequestProperty("Range", "bytes=0-15")
                  val h = ByteArray(16)
                  var n = 0
                  try {
                      c.inputStream.use { i ->
                          while (n < 16) {
                              val r = i.read(h, n, 16 - n)
                              if (r < 0) break
                              n += r
                          }
                      }
                  } finally {
                      c.disconnect()
                  }
                  return kindOf(h, n)
              }

              // Threads / Instagram: make sure every "video" really is a video (not an audio file) before showing it
              // what a video file really holds: picture track, sound track, total size (reads only the start of the file)
              private class Trk(val url: String, val v: Boolean, val a: Boolean, val size: Long, val codec: String = "", val known: Boolean = true)

              private fun tracksAt(u: String, ref: String): Trk {
                  val c = open(u, ref)
                  c.setRequestProperty("Range", "bytes=0-262143")
                  try {
                      if (c.responseCode >= 400) return Trk(u, false, false, -1L)
                      val cr = c.getHeaderField("Content-Range")
                      val size = if (cr != null && cr.contains("/")) (cr.substringAfter("/").trim().toLongOrNull() ?: -1L) else c.contentLengthLong
                      val buf = ByteArrayOutputStream()
                      c.inputStream.use { i ->
                          val b = ByteArray(16384)
                          var r = i.read(b)
                          while (r >= 0 && buf.size() < 262144) { buf.write(b, 0, r); r = i.read(b) }
                      }
                      val h = buf.toByteArray()
                      if (kindOf(h, minOf(16, h.size)) == "audio") return Trk(u, false, true, size)
                      var v = false
                      var a = false
                      var k = 0
                      while (k + 16 < h.size) {
                          if (h[k] == 'h'.code.toByte() && h[k + 1] == 'd'.code.toByte() && h[k + 2] == 'l'.code.toByte() && h[k + 3] == 'r'.code.toByte()) {
                              val t = String(h, k + 12, 4)
                              if (t == "vide") v = true
                              if (t == "soun") a = true
                          }
                          k++
                      }
                      val known = v || a
                      if (!v && !a) v = true
                      val txt = String(h, Charsets.ISO_8859_1)
                      val codec = listOf("avc1", "avc3", "hvc1", "hev1", "vp09", "av01").firstOrNull { txt.contains(it) } ?: ""
                      return Trk(u, v, a, size, codec, known)
                  } finally {
                      c.disconnect()
                  }
              }

              // makes sure every "video" really has a picture, and adds the sound when it comes as a separate file
              private fun vetThen(my: Int, found: List<Media>) {
                  vetting = true
                  pollStop = true
                  say("Checking files…")
                  Thread {
                      val good = ArrayList<Media>()
                      val single = found.count { it.video } == 1
                      if (single && (plat == "th" || plat == "ig")) {
                          // give the page player a moment to load its files
                          var waited = 0
                          while (waited < 5000 && synchronized(netVideos) { netVideos.size } < 2) { Thread.sleep(500); waited += 500 }
                      }
                      val net = if (single) synchronized(netVideos) { ArrayList(netVideos) } else ArrayList()
                      for (m in found) {
                          if (!m.video || m.label == "dash") { good.add(m); continue }
                          if (plat == "tt") {
                              var pick: String? = null
                              for (u in (listOf(m.url) + m.alts).distinct()) {
                                  val k = try { sniff(u, m.ref) } catch (e: Exception) { "other" }
                                  if (k != "audio") { pick = u; break }
                              }
                              if (pick != null) good.add(Media(pick, true, m.thumb, m.ref, live = m.live, still = m.still))
                              else if (m.thumb.isNotEmpty()) good.add(Media(m.thumb, false, m.thumb, m.ref))
                              continue
                          }
                          val t0 = try { tracksAt(m.url, m.ref) } catch (e: Exception) { null }
                          if (t0 == null || !t0.known || (t0.v && t0.a)) {
                              // normal case (or the check could not read it): the post's own video file, like before
                              good.add(Media(m.url, true, m.thumb, m.ref, alts = m.alts))
                              continue
                          }
                          val all = (listOf(m.url) + m.alts + listOf(m.audio) + net).filter { it.startsWith("http") }.distinct().take(12)
                          val tr = listOf(t0) + all.drop(1).mapNotNull { u -> try { tracksAt(u, m.ref) } catch (e: Exception) { null } }
                          val both = tr.filter { it.v && it.a }.maxByOrNull { it.size }
                          // VP9 / AV1 pictures cannot be joined into an MP4 on most phones: use H.264 / H.265 ones
                          val okc = setOf("", "avc1", "avc3", "hvc1", "hev1")
                          val vOnly = tr.filter { it.v && !it.a && it.known && it.codec in okc }.maxByOrNull { it.size }
                          val vAny = tr.filter { it.v && !it.a && it.known }.maxByOrNull { it.size }
                          val aOnly = tr.filter { !it.v && it.a }.maxByOrNull { it.size }
                          igInfo = "files: ${tr.count { it.v && it.a }} with sound, ${tr.count { it.v && !it.a }} picture-only (" +
                              tr.filter { it.v && !it.a }.map { it.codec.ifEmpty { "?" } }.distinct().joinToString("/") + "), ${tr.count { !it.v && it.a }} sound-only"
                          when {
                              both != null && (vOnly == null || aOnly == null || both.size >= vOnly.size) -> good.add(Media(both.url, true, m.thumb, m.ref))
                              vOnly != null && aOnly != null -> good.add(Media(vOnly.url, true, m.thumb, m.ref, audio = aOnly.url, ua = UA, label = "dash",
                                  alts = listOfNotNull(both?.url)))
                              // only VP9 pictures: join them with the sound into a WebM video (the sound is converted to Opus)
                              vAny != null && aOnly != null -> good.add(Media(vAny.url, true, m.thumb, m.ref, audio = aOnly.url, ua = UA, label = "dash"))
                              vOnly != null -> good.add(Media(vOnly.url, true, m.thumb, m.ref, label = "nosound"))
                              t0.v -> good.add(Media(m.url, true, m.thumb, m.ref, label = "nosound"))
                              m.thumb.isNotEmpty() -> {
                                  good.add(Media(m.thumb, false, m.thumb, m.ref))
                                  diag = "This post has only music, no video, so its photo is shown"
                              }
                          }
                      }
                      runOnUiThread {
                          if (my == gen) {
                              if (good.isEmpty()) fail(my, "This post has no photo or video of its own (only sound or a link preview), so there is nothing to download.")
                              else show(good)
                          }
                      }
                  }.start()
              }

              private fun best(a: JSONArray?, needSize: Boolean = false): String? {
                  if (a == null) return null
                  var url: String? = null
                  var area = -1L
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      val u = o.optString("url")
                      if (u.isEmpty()) continue
                      val s = o.optLong("width") * o.optLong("height")
                      if (needSize && s <= 0L) continue
                      if (s > area) { area = s; url = u }
                  }
                  return url
              }

              // ---------- Instagram stories / highlights (needs login) ----------
              private fun startIg(link: String, my: Int) {
                  val hl = Regex("instagram\\.com/stories/highlights/(\\d+)").find(link)?.groupValues?.get(1)
                  val su = Regex("instagram\\.com/stories/([A-Za-z0-9._]+)(?:/(\\d+))?").find(link)
                  var shareHl: String? = null
                  val sm = Regex("instagram\\.com/s/([A-Za-z0-9_=-]+)").find(link)
                  if (sm != null) {
                      try {
                          val d = String(Base64.decode(sm.groupValues[1], Base64.URL_SAFE))
                          if (d.startsWith("highlight:")) shareHl = d.removePrefix("highlight:")
                      } catch (e: Exception) { }
                  }
                  val reelHl = hl ?: shareHl
                  val user = su?.groupValues?.get(1)
                  if (reelHl != null || (user != null && user != "highlights")) {
                      val sid = Regex("story_media_id=(\\d+)").find(link)?.groupValues?.get(1)
                          ?: su?.groupValues?.get(2)?.ifEmpty { null }
                      igStory(link, my, reelHl, user, sid)
                  } else {
                      say("Opening Instagram post… (up to 25 seconds)")
                      newWeb(my, UAD).loadUrl(link)
                      poll(my, 0)
                  }
              }

              private fun igApi(u: String, cookie: String): String {
                  val csrf = Regex("csrftoken=([^;]+)").find(cookie)?.groupValues?.get(1) ?: ""
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("X-IG-App-ID", "936619743392459")
                  c.setRequestProperty("X-CSRFToken", csrf)
                  c.setRequestProperty("X-Requested-With", "XMLHttpRequest")
                  c.setRequestProperty("Cookie", cookie)
                  c.setRequestProperty("Referer", "https://www.instagram.com/")
                  c.setRequestProperty("Accept", "*/*")
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  val code = c.responseCode
                  if (code == 400 || code == 401 || code == 403) throw AuthFail(code)
                  if (code >= 400) throw IOException("HTTP $code")
                  return c.inputStream.bufferedReader().readText()
              }

              private fun walkMedia(n: Any?, out: ArrayList<JSONObject>, ids: HashSet<String>) {
                  if (n is JSONObject) {
                      if (n.has("video_versions") || n.has("image_versions2")) {
                          if (ids.add(n.optString("pk", n.optString("id")))) out.add(n)
                          return
                      }
                      for (k in n.keys()) walkMedia(n.opt(k), out, ids)
                  } else if (n is JSONArray) {
                      for (i in 0 until n.length()) walkMedia(n.opt(i), out, ids)
                  }
              }

              private fun igStory(link: String, my: Int, hlId: String?, user: String?, storyId: String?) {
                  val cookie = CookieManager.getInstance().getCookie("https://www.instagram.com") ?: ""
                  if (!cookie.contains("sessionid=")) {
                      showLogin("Instagram", link)
                      return
                  }
                  say("Fetching stories…")
                  Thread {
                      try {
                          var reel = if (hlId != null) "highlight:$hlId" else ""
                          if (reel.isEmpty()) {
                              val j = JSONObject(igApi("https://www.instagram.com/api/v1/users/web_profile_info/?username=$user", cookie))
                              reel = j.optJSONObject("data")?.optJSONObject("user")?.optString("id") ?: ""
                              if (reel.isEmpty()) throw IOException("User not found")
                          }
                          val body = igApi("https://www.instagram.com/api/v1/feed/reels_media/?reel_ids=" + URLEncoder.encode(reel, "UTF-8"), cookie)
                          val nodes = ArrayList<JSONObject>()
                          walkMedia(JSONObject(body), nodes, HashSet())
                          var found: List<Media> = nodes.mapNotNull { oneTh(it) }
                          if (storyId != null) {
                              val idx = nodes.indexOfFirst { it.optString("pk") == storyId || it.optString("id").startsWith(storyId) }
                              if (idx >= 0) found = listOfNotNull(oneTh(nodes[idx]))
                          }
                          runOnUiThread {
                              if (my == gen) {
                                  if (found.isEmpty()) fail(my, "No active stories found (they disappear after 24 hours).")
                                  else show(found)
                              }
                          }
                      } catch (e: AuthFail) {
                          runOnUiThread { if (my == gen) showLogin("Instagram", link) }
                      } catch (e: Exception) {
                          fail(my, "Failed: ${e.message}")
                      }
                  }.start()
              }

              // ----- Facebook -----
              private fun dec(s: String): String = try {
                  JSONObject("{\"a\":\"$s\"}").getString("a")
              } catch (e: Exception) {
                  s.replace("\\/", "/").replace("\\u0026", "&").replace("&amp;", "&")
              }

              private fun grab(d: String, rx: String): String? {
                  val m = Regex(rx).find(d) ?: return null
                  return dec(m.groupValues[1])
              }

              private fun tick0(docs: List<String>) = docs.size > 0

              private fun parseFb(docs: List<String>, final: Boolean): List<Media> {
                  val ref = "https://www.facebook.com/"
                  var hd = ""
                  var sd = ""
                  var thumb = ""
                  val photos = LinkedHashMap<String, String>()
                  var og = ""
                  for (d in docs) {
                      if (hd.isEmpty()) hd = grab(d, "\"browser_native_hd_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"playable_url_quality_hd\":\"([^\"]+)\"")
                          ?: grab(d, "\"hd_src\":\"([^\"]+)\"") ?: ""
                      if (sd.isEmpty()) sd = grab(d, "\"browser_native_sd_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"playable_url\":\"([^\"]+)\"")
                          ?: grab(d, "\"sd_src\":\"([^\"]+)\"") ?: ""
                      if (thumb.isEmpty()) thumb = grab(d, "\"preferred_thumbnail\":\\{\"image\":\\{\"uri\":\"([^\"]+)\"") ?: ""
                      if (og.isEmpty()) og = Regex("property=\"og:image\" content=\"([^\"]+)\"").find(d)?.groupValues?.get(1)?.replace("&amp;", "&") ?: ""
                      for (m in Regex("\"all_subattachments\":\\{\"count\":(\\d+)").findAll(d)) {
                          val c = m.groupValues[1].toIntOrNull() ?: 0
                          if (c > fbTotal) fbTotal = c
                      }
                      for (m in Regex("\"(?:viewer_image|photo_image)\":\\{[^}]*?\"uri\":\"([^\"]+)\"").findAll(d)) {
                          val u = dec(m.groupValues[1])
                          photos.putIfAbsent(u.substringBefore("?").substringAfterLast("/"), u)
                      }
                  }
                  for (d in docs) {
                      val nm = grab(d, "\"owner\":\\{\"__typename\":\"(?:User|Page)\",(?:\"[a-z_]+\":[^,]*,)*?\"name\":\"([^\"]+)\"")
                          ?: grab(d, "\"actors\":\\[\\{\"__typename\":\"(?:User|Page)\",\"name\":\"([^\"]+)\"")
                      if (!nm.isNullOrEmpty()) { setSrc(nm, "facebook"); break }
                  }
                  if (hd.isNotEmpty() || sd.isNotEmpty()) {
                      val first = if (hd.isNotEmpty()) hd else sd
                      val alts = if (hd.isNotEmpty() && sd.isNotEmpty()) listOf(sd) else emptyList()
                      return listOf(Media(first, true, thumb.ifEmpty { og }, ref, alts = alts))
                  }
                  if (photos.isNotEmpty() && (final || tick0(docs))) return photos.values.take(30).map { Media(it, false, it, ref) }
                  if (final && og.isNotEmpty()) return listOf(Media(og, false, og, ref))
                  return emptyList()
              }

              // ---------- YouTube ----------
              private fun startYt(link: String, my: Int) {
                  val id = Regex("(?:youtu\\.be/|[?&]v=|/shorts/|/live/|/embed/)([A-Za-z0-9_-]{11})").find(link)?.groupValues?.get(1)
                  if (id == null) {
                      fail(my, "Could not find a video ID in this YouTube link.")
                      return
                  }
                  val isShort = link.contains("/shorts/")
                  say("Reading YouTube formats…")
                  Thread {
                      try {
                          val r = ytFetch(id)
                          runOnUiThread {
                              if (my == gen) {
                                  if (isShort) autoOne(r.first[0]) else showYt(r.first, r.second)
                              }
                          }
                      } catch (e: Exception) {
                          fail(my, "YouTube: ${e.message}")
                      }
                  }.start()
              }

              private fun visitorId(): String = try {
                  val h = open("https://www.youtube.com/", "", UAD).inputStream.bufferedReader().readText()
                  Regex("\"(?:VISITOR_DATA|visitorData)\":\"([^\"]+)\"").find(h)?.groupValues?.get(1) ?: ""
              } catch (e: Exception) { "" }

              private fun ytPlayer(id: String, c: YC, visitor: String): JSONObject {
                  val client = JSONObject().put("clientName", c.name).put("clientVersion", c.ver).put("hl", "en").put("gl", "US")
                      .put("userAgent", c.ua)
                  if (c.android) client.put("deviceMake", "Oculus").put("deviceModel", "Quest 3")
                      .put("androidSdkVersion", 32).put("osName", "Android").put("osVersion", "12L")
                  if (c.vision) client.put("deviceMake", "Apple").put("deviceModel", "RealityDevice17,1")
                      .put("osName", "visionOS").put("osVersion", "26.5.23O471")
                  if (visitor.isNotEmpty()) client.put("visitorData", visitor)
                  val ctx = JSONObject().put("client", client)
                  if (c.embed) ctx.put("thirdParty", JSONObject().put("embedUrl", "https://www.youtube.com/watch?v=$id"))
                  val body = JSONObject().put("context", ctx)
                      .put("videoId", id).put("contentCheckOk", true).put("racyCheckOk", true)
                  val u = URL("https://www.youtube.com/youtubei/v1/player?prettyPrint=false").openConnection() as HttpURLConnection
                  u.requestMethod = "POST"
                  u.doOutput = true
                  u.setRequestProperty("Content-Type", "application/json")
                  u.setRequestProperty("User-Agent", c.ua)
                  u.setRequestProperty("X-YouTube-Client-Name", c.id)
                  u.setRequestProperty("X-YouTube-Client-Version", c.ver)
                  u.setRequestProperty("Origin", "https://www.youtube.com")
                  if (visitor.isNotEmpty()) u.setRequestProperty("X-Goog-Visitor-Id", visitor)
                  u.connectTimeout = 20000
                  u.readTimeout = 30000
                  u.outputStream.use { it.write(body.toString().toByteArray()) }
                  val text = try {
                      u.inputStream.bufferedReader().readText()
                  } catch (e: Exception) {
                      throw IOException("HTTP ${u.responseCode}")
                  }
                  return JSONObject(text)
              }

              private fun ytFetch(id: String): Pair<List<Media>, String> {
                  var reason = ""
                  val visitor = visitorId()
                  for (c in YT) {
                      try {
                          val j = ytPlayer(id, c, visitor)
                          val sd = j.optJSONObject("streamingData")
                          if (sd == null) {
                              if (reason.isEmpty()) reason = j.optJSONObject("playabilityStatus")?.optString("reason") ?: "no streams"
                              continue
                          }
                          val opts = buildYt(id, sd, c.ua)
                          if (opts.isNotEmpty()) {
                              val au = j.optJSONObject("videoDetails")?.optString("author") ?: ""
                              if (au.isNotEmpty()) setSrc(au, "youtube")
                              return Pair(opts, j.optJSONObject("videoDetails")?.optString("title") ?: "")
                          }
                          if (reason.isEmpty()) reason = "no direct download formats for this video"
                      } catch (e: Exception) {
                          if (reason.isEmpty()) reason = e.message ?: "network error"
                      }
                  }
                  throw IOException((if (reason.isEmpty()) "video unavailable" else reason) + " (all ${YT.size} methods failed)")
              }

              // the same file (same format number and size) as offered through every other YouTube route
              private fun ytSources(id: String, itag: Int, size: Long, skip: String): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val visitor = visitorId()
                  for (c in YT) {
                      try {
                          val sd = ytPlayer(id, c, visitor).optJSONObject("streamingData") ?: continue
                          for (pass in 0..1) {
                              val a = sd.optJSONArray(if (pass == 0) "formats" else "adaptiveFormats") ?: continue
                              for (i in 0 until a.length()) {
                                  val o = a.optJSONObject(i) ?: continue
                                  if (o.optInt("itag") != itag) continue
                                  val u = o.optString("url")
                                  if (u.isEmpty() || u == skip) continue
                                  val cl = o.optString("contentLength").toLongOrNull() ?: 0L
                                  if (size > 0 && cl != size) continue
                                  out.add(Pair(u, c.ua))
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out
              }

              private fun mb(b: Long): String = if (b > 0) " · ${b / 1048576} MB" else ""

              // original-language sound track scores highest (many videos also carry dubbed tracks)
              private fun langScore(o: JSONObject): Int {
                  val t = o.optJSONObject("audioTrack")
                  val name = (t?.optString("displayName") ?: "").lowercase()
                  val u = o.optString("url").lowercase()
                  if (name.contains("original") || u.contains("acont%3doriginal") || u.contains("acont=original")) return 3
                  if (name.contains("descriptive") || u.contains("acont%3ddescriptive") || u.contains("acont=descriptive")) return -2
                  if (t != null && t.optBoolean("audioIsDefault")) return 2
                  if (name.contains("dub") || u.contains("acont%3ddubbed") || u.contains("acont=dubbed")) return -1
                  return 1
              }

              private fun buildYt(id: String, sd: JSONObject, ua: String): List<Media> {
                  val prog = ArrayList<Fmt>()
                  val vmp4 = ArrayList<Fmt>()
                  val vweb = ArrayList<Fmt>()
                  var amp4: Fmt? = null
                  var aweb: Fmt? = null
                  for (pass in 0..1) {
                      val a = sd.optJSONArray(if (pass == 0) "formats" else "adaptiveFormats") ?: continue
                      for (i in 0 until a.length()) {
                          val o = a.optJSONObject(i) ?: continue
                          val u = o.optString("url")
                          if (u.isEmpty()) continue
                          val mt = o.optString("mimeType")
                          val mime = mt.substringBefore(";").trim()
                          val codecs = mt.substringAfter("codecs=\"", "").substringBefore("\"")
                          val f = Fmt(u, o.optInt("height"), mime, codecs, o.optLong("bitrate"),
                              o.optString("contentLength").toLongOrNull() ?: 0L, o.optInt("fps"), o.optInt("itag"), langScore(o))
                          if (pass == 0) {
                              if (mime == "video/mp4") prog.add(f)
                          } else if (mime == "video/mp4" && codecs.startsWith("avc1")) {
                              vmp4.add(f)
                          } else if (mime == "video/webm" && codecs.startsWith("vp")) {
                              vweb.add(f)
                          } else if (mime == "audio/mp4") {
                              val cur = amp4
                              if (cur == null || f.lang > cur.lang || (f.lang == cur.lang && f.br > cur.br)) amp4 = f
                          } else if (mime == "audio/webm") {
                              val cur = aweb
                              if (cur == null || f.lang > cur.lang || (f.lang == cur.lang && f.br > cur.br)) aweb = f
                          }
                      }
                  }
                  val thumb = "https://i.ytimg.com/vi/$id/hqdefault.jpg"
                  val res = ArrayList<Pair<Int, Media>>()
                  val heights = (vmp4.map { it.h } + vweb.map { it.h }).filter { it > 0 }.distinct().sortedDescending()
                  val am = amp4
                  val aw = aweb
                  for (h in heights) {
                      val m = vmp4.filter { it.h == h }.maxByOrNull { it.br }
                      val w = vweb.filter { it.h == h }.maxByOrNull { it.br }
                      if (m != null && am != null) {
                          res.add(Pair(h, Media(m.url, true, thumb, audio = am.url, label = "${h}p${if (m.fps > 30) m.fps.toString() else ""} · MP4${mb(m.size + am.size)}",
                              ua = ua, size = m.size, asize = am.size, ytId = id, itag = m.itag, aitag = am.itag)))
                      } else if (w != null && aw != null) {
                          res.add(Pair(h, Media(w.url, true, thumb, audio = aw.url, webm = true, label = "${h}p${if (w.fps > 30) w.fps.toString() else ""} · WebM${mb(w.size + aw.size)}",
                              ua = ua, size = w.size, asize = aw.size, ytId = id, itag = w.itag, aitag = aw.itag)))
                      }
                  }
                  for (p in prog) {
                      if (p.h in heights && res.isNotEmpty()) continue
                      res.add(Pair(p.h, Media(p.url, true, thumb, label = "${p.h}p · MP4 (with sound)${mb(p.size)}", ua = ua, size = p.size, ytId = id, itag = p.itag)))
                  }
                  return res.sortedByDescending { it.first }.map { it.second }
              }

              private fun autoOne(m: Media) {
                  busy(false)
                  items.clear()
                  items.add(m)
                  overlays.clear()
                  chosen = booleanArrayOf(true)
                  ytMode = false
                  say("Downloading…")
                  download()
              }

              private fun showYt(opts: List<Media>, title: String, pick: Int = 0) {
                  busy(false)
                  items.clear()
                  items.addAll(opts)
                  overlays.clear()
                  chosen = BooleanArray(0)
                  ytMode = true
                  ytSel = if (pick in opts.indices) pick else 0
                  allBox.visibility = View.GONE
                  list.removeAllViews()
                  status.text = "Choose a quality, then tap Download."
                  if (title.isNotEmpty()) list.addView(TextView(this).apply {
                      text = title
                      textSize = 15f
                      setPadding(0, 0, 0, dp(8))
                  })
                  val total = resources.displayMetrics.widthPixels - dp(32)
                  val tw = total * 2 / 5
                  val th = tw * 4 / 3
                  val img = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(Color.LTGRAY)
                  }
                  val rg = RadioGroup(this)
                  opts.forEachIndexed { i, o ->
                      rg.addView(RadioButton(this).apply {
                          text = o.label
                          id = i + 1
                          isChecked = i == ytSel
                          setOnClickListener { ytSel = i }
                      })
                  }
                  list.addView(LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(img, LinearLayout.LayoutParams(tw, th))
                      addView(rg, LinearLayout.LayoutParams(0, -2, 1f))
                  })
                  loadThumb(opts[0], img)
                  btn.isEnabled = true
              }

              // ---------- Grid ----------
              private fun setSel(i: Int, v: Boolean) {
                  if (i >= chosen.size || i >= overlays.size) return
                  chosen[i] = v
                  overlays[i].visibility = if (v) View.VISIBLE else View.GONE
              }

              private fun syncAll() {
                  bulk = true
                  allBox.isChecked = chosen.isNotEmpty() && chosen.all { it }
                  bulk = false
              }

              private fun show(found: List<Media>) {
                  pollStop = true
                  busy(false)
                  closeWeb()
                  ytMode = false
                  items.clear()
                  overlays.clear()
                  list.removeAllViews()
                  items.addAll(found)
                  chosen = BooleanArray(found.size)
                  bulk = true
                  allBox.isChecked = false
                  bulk = false
                  allBox.visibility = if (found.size > 1) View.VISIBLE else View.GONE
                  val gap = dp(4)
                  val cw = (resources.displayMetrics.widthPixels - dp(32) - gap * 6) / 3
                  val ch = cw * 4 / 3
                  val grid = GridLayout(this).apply { columnCount = 3 }
                  found.forEachIndexed { i, m ->
                      val cell = FrameLayout(this)
                      val img = ImageView(this).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.LTGRAY)
                      }
                      val ov = View(this).apply {
                          setBackgroundColor(Color.argb(160, 255, 255, 255))
                          visibility = View.GONE
                      }
                      cell.addView(img, FrameLayout.LayoutParams(-1, -1))
                      cell.addView(ov, FrameLayout.LayoutParams(-1, -1))
                      if (m.video) {
                          cell.addView(TextView(this).apply {
                              text = if (m.live) "● Live" else "▶ Video"
                              textSize = 11f
                              setTextColor(Color.WHITE)
                              setBackgroundColor(Color.argb(150, 0, 0, 0))
                              setPadding(dp(6), dp(2), dp(6), dp(2))
                          }, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START))
                      }
                      overlays.add(ov)
                      cell.setOnClickListener { setSel(i, !chosen[i]); syncAll() }
                      grid.addView(cell, GridLayout.LayoutParams().apply {
                          width = cw
                          height = ch
                          setMargins(gap, gap, gap, gap)
                      })
                      loadThumb(m, img)
                  }
                  list.addView(grid)
                  btn.isEnabled = true
                  if (found.size == 1) {
                      setSel(0, true)
                      say("Downloading…")
                      download()
                  } else {
                      val nv = found.count { it.video }
                      say("Found $nv video(s) and ${found.size - nv} photo(s). Tap to select." + if (diag.isNotEmpty()) "\n($diag)" else "")
                  }
              }

              private fun loadThumb(m: Media, v: ImageView) {
                  if (m.thumb.isEmpty()) return
                  Thread {
                      try {
                          val o = BitmapFactory.Options().apply { inSampleSize = 2 }
                          val bmp = BitmapFactory.decodeStream(open(m.thumb, m.ref).inputStream, null, o)
                          runOnUiThread { v.setImageBitmap(bmp) }
                      } catch (e: Exception) {
                      }
                  }.start()
              }

              // ---------- Download ----------
              private fun download() {
                  val sel = if (ytMode) listOf(items[ytSel]) else items.filterIndexed { i, _ -> i < chosen.size && chosen[i] }
                  if (sel.isEmpty()) {
                      say("Tap at least one item first.")
                      return
                  }
                  btn.isEnabled = false
                  runDownloads(sel)
              }

              // downloads keep going in the background; you can switch to other apps
              private fun runDownloads(sel: List<Media>) {
                  val g = gen
                  val src = srcName
                  val link = lastLink.ifEmpty { input.text.toString() }
                  if (active.getAndIncrement() == 0) {
                      try { startForegroundService(Intent(this, DlService::class.java)) } catch (e: Exception) { }
                  }
                  dlText.text = "Downloading…"
                  dlBar.visibility = View.VISIBLE
                  val tok = cancelTok.get()
                  Thread {
                      dlGen.set(g)
                      dlTok.set(tok)
                      dlSrc.set(src)
                      var ok = 0
                      var err = ""
                      var stopped = false
                      warn = ""
                      try {
                          for (n in sel.indices) {
                              if (tok != cancelTok.get()) { stopped = true; break }
                              say("Downloading ${n + 1} of ${sel.size}… (you can use other apps)")
                              try {
                                  save(sel[n], n)
                                  ok++
                              } catch (e: Cancelled) {
                                  stopped = true
                                  break
                              } catch (e: Exception) {
                                  err = e.message ?: e.javaClass.simpleName
                              }
                          }
                      } finally {
                          val msg = if (stopped) "Download cancelled." + (if (ok > 0) " $ok file(s) were already saved." else "")
                              else if (ok == sel.size) "Done: $ok of ${sel.size} saved (album EasyDownloader)." + (if (warn.isNotEmpty()) " Note: $warn" else "")
                              else "Done: $ok of ${sel.size} saved. Error: $err"
                          lastNote = 0L
                          addHist(link, src, if (stopped) "Cancelled" else if (ok == sel.size) "Done: $ok file(s) saved" else "Failed: $err")
                          if (active.decrementAndGet() == 0) {
                              try { stopService(Intent(this, DlService::class.java)) } catch (e: Exception) { }
                              try { (getSystemService(NOTIFICATION_SERVICE) as android.app.NotificationManager).cancel(DlService.ID) } catch (e: Exception) { }
                          }
                          try {
                              (getSystemService(NOTIFICATION_SERVICE) as android.app.NotificationManager).notify(DlService.DONE + g % 1000, DlService.note(this, msg, false))
                          } catch (e: Exception) { }
                          runOnUiThread {
                              if (active.get() == 0) dlBar.visibility = View.GONE
                              if (g == gen) {
                                  status.text = msg
                                  btn.isEnabled = true
                                  if (webHost.visibility == View.VISIBLE) webStatus.text = msg
                              }
                              if (page == 1) refreshFiles()
                          }
                      }
                  }.start()
              }

              private fun sizeOf(u: String, ref: String): Long {
                  val c = open(u, ref)
                  c.setRequestProperty("Range", "bytes=0-0")
                  val cr = c.getHeaderField("Content-Range")
                  val s = if (cr != null && cr.contains("/")) (cr.substringAfter("/").trim().toLongOrNull() ?: -1L) else c.contentLengthLong
                  c.disconnect()
                  return s
              }

              // measure every candidate link and keep the biggest file (= best quality)
              private fun pickBest(m: Media): String {
                  val c = (listOf(m.url) + m.alts).distinct()
                  if (c.size == 1) return c[0]
                  var best = c[0]
                  var bs = -1L
                  for (u in c) {
                      val s = try { sizeOf(u, m.ref) } catch (e: Exception) { -1L }
                      if (s > bs) { bs = s; best = u }
                  }
                  return best
              }

              private fun newItem(name: String, mime: String, video: Boolean): Pair<Uri, ContentValues> {
                  val v = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, (if (video) "Movies" else "Pictures") + "/EasyDownloader")
                      put(MediaStore.MediaColumns.IS_PENDING, 1)
                  }
                  val col = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  return Pair(contentResolver.insert(col, v)!!, v)
              }

              private fun finishItem(p: Pair<Uri, ContentValues>) {
                  p.second.clear()
                  p.second.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  contentResolver.update(p.first, p.second, null, null)
              }

              private class Fatal(msg: String) : IOException(msg)

              // keeps downloading from where it stopped when the connection drops
              private fun fetchResume(url: String, ref: String, ua: String, out: OutputStream): Long {
                  val buf = ByteArray(65536)
                  var pos = 0L
                  var total = -1L
                  var tries = 0
                  var pct = -1
                  while (true) {
                      val c = open(url, ref, ua)
                      c.readTimeout = 60000
                      c.setRequestProperty("Range", "bytes=$pos-")
                      try {
                          val code = c.responseCode
                          if (code == 416 && total > 0 && pos >= total) return pos
                          if (code >= 400) throw IOException("HTTP $code")
                          if (pos > 0 && code != 206) throw Fatal("The connection dropped and this site does not allow resuming")
                          if (total < 0) {
                              val cr = c.getHeaderField("Content-Range")
                              total = if (cr != null && cr.contains("/")) (cr.substringAfter("/").trim().toLongOrNull() ?: -1L)
                                  else c.contentLengthLong.let { if (it > 0) it + pos else -1L }
                          }
                          c.inputStream.use { i ->
                              if (pos == 0L) {
                                  val head = ByteArray(16)
                                  var n = 0
                                  while (n < 16) {
                                      val r = i.read(head, n, 16 - n)
                                      if (r < 0) break
                                      n += r
                                  }
                                  if (!isVideo(head, n)) throw Fatal("The site sent a web page instead of the video")
                                  out.write(head, 0, n)
                                  pos += n
                              }
                              var r = i.read(buf)
                              while (r >= 0) {
                                  chk()
                                  out.write(buf, 0, r)
                                  pos += r
                                  if (total > 0) {
                                      val p = (pos * 100 / total).toInt()
                                      if (p != pct) { pct = p; say("Video $p% (${pos / 1048576} of ${total / 1048576} MB)") }
                                  }
                                  r = i.read(buf)
                              }
                          }
                          if (total < 0 || pos >= total) return pos
                          throw IOException("connection closed early")
                      } catch (e: Fatal) {
                          throw e
                      } catch (e: Cancelled) {
                          throw e
                      } catch (e: IOException) {
                          tries++
                          if (tries > 15) throw IOException("The connection kept dropping at ${maxOf(pct, 0)}% (${e.message})")
                          say("Connection dropped, resuming… (${maxOf(pct, 0)}%)")
                          Thread.sleep(2000)
                      } finally {
                          c.disconnect()
                      }
                  }
              }

              private fun saveWeb(m: Media, n: Int) {
                  val item = newItem("${pre()}web_${System.currentTimeMillis()}_$n.mp4", "video/mp4", true)
                  try {
                      val total = contentResolver.openOutputStream(item.first)!!.use { fetchResume(m.url, m.ref, m.gua, it) }
                      if (total < 300000) throw IOException("The file is too small to be the real video")
                  } catch (e: Exception) {
                      contentResolver.delete(item.first, null, null)
                      throw e
                  }
                  finishItem(item)
              }

              private class PhotoInstead : IOException("photo with music")

              private fun save(m: Media, n: Int) {
                  try {
                      save0(m, n)
                  } catch (e: Cancelled) {
                      throw e
                  } catch (e: PhotoInstead) {
                      // a photo post with music: the post has no real video, so keep its photo
                      save0(Media(m.thumb, false, m.thumb, m.ref), n)
                      warn = "That post is a photo with music, so the photo was saved."
                  } catch (e: Exception) {
                      // joining picture and sound failed: save the ready-made file with sound instead
                      if (m.label == "dash" && m.alts.isNotEmpty()) save0(Media(m.alts[0], true, m.thumb, m.ref), n)
                      else if (m.label == "dash" && m.thumb.isNotEmpty()) {
                          save0(Media(m.url, true, m.thumb, m.ref), n)
                          warn = "The sound could not be joined, so the video was saved without sound."
                      } else throw e
                  }
              }

              private fun save0(m: Media, n: Int) {
                  if (m.hls) { saveHls(m, n); return }
                  if (m.audio.isNotEmpty()) { saveMux(m, n); return }
                  if (m.gua.isNotEmpty() && !m.hls) { saveWeb(m, n); return }
                  if (m.hls) { saveHls(m, n); return }
                  if (m.live) { saveLive(m, n); return }
                  if (m.label == "nosound") warn = "The site gave this video without sound, and no separate sound file was found. ($igInfo)"
                  var mm = m
                  if (m.page.isNotEmpty() && m.video) {
                      // TikTok: the HD copy (1080p, H.265, no watermark) is often not in the web page data
                      say("Looking for the HD version…")
                      val hd = try { ttBackup(m.page).firstOrNull { it.video } } catch (e: Exception) { null }
                      if (hd != null) mm = Media(m.url, true, m.thumb, m.ref, alts = m.alts + listOf(hd.url) + hd.alts)
                      warn = if (hd == null) "HD version not available (${ttNote.ifEmpty { "no answer" }})." else ""
                  }
                  val url = pickBest(mm).let { if (it.contains("tikwm.com")) finalUrl(it) else it }
                  if (m.page.isNotEmpty() && m.video) {
                      val mbs = try { sizeOf(url, m.ref) } catch (e: Exception) { -1L }
                      if (mbs > 0) warn = (if (url.contains("tikwm")) "HD version · " else "") + "${mbs / 1048576} MB. " + warn
                  }
                  val path = url.substringBefore("?").lowercase()
                  val ext = if (m.video) "mp4" else if (path.endsWith(".png")) "png" else if (path.endsWith(".webp")) "webp" else "jpg"
                  val mime = if (m.video) "video/mp4" else when (ext) {
                      "png" -> "image/png"
                      "webp" -> "image/webp"
                      else -> "image/jpeg"
                  }
                  val item = newItem("${pre()}${System.currentTimeMillis()}_$n.$ext", mime, m.video)
                  try {
                      contentResolver.openOutputStream(item.first)!!.use { o ->
                          if (m.ua.isNotEmpty()) fetchChunks(url, o, m.ua, m.size, "Video", m.ytId, m.itag)
                          else {
                              val c = open(url, m.ref, if (m.gua.isNotEmpty()) m.gua else UA)
                              c.inputStream.use { i ->
                                  val head = ByteArray(16)
                                  var n = 0
                                  while (n < 16) {
                                      val r = i.read(head, n, 16 - n)
                                      if (r < 0) break
                                      n += r
                                  }
                                  if (m.video && kindOf(head, n) == "audio") {
                                      if (m.thumb.isNotEmpty() && m.thumb != m.url) throw PhotoInstead()
                                      throw IOException("This file is audio only, not a video")
                                  }
                                  if (m.gua.isNotEmpty() && !isVideo(head, n)) throw IOException("The site sent a web page instead of the video")
                                  o.write(head, 0, n)
                                  var total = n.toLong()
                                  val cb = ByteArray(65536)
                                  var rr = i.read(cb)
                                  while (rr >= 0) {
                                      chk()
                                      o.write(cb, 0, rr)
                                      total += rr
                                      rr = i.read(cb)
                                  }
                                  if (m.gua.isNotEmpty() && total < 300000) throw IOException("The file is too small to be the real video")
                              }
                          }
                      }
                  } catch (e: Exception) {
                      contentResolver.delete(item.first, null, null)
                      throw e
                  }
                  finishItem(item)
              }

              private fun txt(u: String, ref: String): String = open(u, ref, UAD).inputStream.bufferedReader().readText()

              private fun absUrl(base: String, rel: String): String = URL(URL(base), rel).toString()

              private fun attr(line: String, key: String): String? =
                  Regex("[:,]" + key + "=(\"[^\"]*\"|[^,]*)").find(line)?.groupValues?.get(1)?.trim('"')

              private class Seg(val url: String, val keyUrl: String, val iv: ByteArray?, val seq: Long)
              private class Pl(val segs: List<Seg>, val map: String, val protectedStream: Boolean)

              private fun hexIv(s: String): ByteArray {
                  val h = s.removePrefix("0x").removePrefix("0X").padStart(32, '0')
                  return ByteArray(16) { h.substring(it * 2, it * 2 + 2).toInt(16).toByte() }
              }

              private fun parseMedia(url: String, ref: String): Pl {
                  val t = txt(url, ref)
                  val segs = ArrayList<Seg>()
                  var seq = 0L
                  var key = ""
                  var iv: ByteArray? = null
                  var map = ""
                  var prot = false
                  for (raw in t.lines()) {
                      val l = raw.trim()
                      if (l.startsWith("#EXT-X-MEDIA-SEQUENCE:")) seq = l.substringAfter(":").trim().toLongOrNull() ?: 0L
                      else if (l.startsWith("#EXT-X-MAP:")) map = absUrl(url, attr(l, "URI") ?: "")
                      else if (l.startsWith("#EXT-X-KEY:")) {
                          val mth = attr(l, "METHOD") ?: "NONE"
                          if (mth == "AES-128") {
                              key = absUrl(url, attr(l, "URI") ?: "")
                              iv = attr(l, "IV")?.let { hexIv(it) }
                          } else if (mth == "NONE") {
                              key = ""
                              iv = null
                          } else prot = true
                      } else if (l.isNotEmpty() && !l.startsWith("#")) {
                          segs.add(Seg(absUrl(url, l), key, iv, seq))
                          seq++
                      }
                  }
                  return Pl(segs, map, prot)
              }

              private fun getSeg(s: Seg, ref: String, keys: java.util.concurrent.ConcurrentHashMap<String, ByteArray>): ByteArray {
                  var last: Exception? = null
                  for (a in 0..5) {
                      if (a > 0) Thread.sleep(1500L * a)
                      try {
                          var b = open(s.url, ref, UAD).inputStream.use { it.readBytes() }
                          if (s.keyUrl.isNotEmpty()) {
                              val k = keys.getOrPut(s.keyUrl) { open(s.keyUrl, ref, UAD).inputStream.use { it.readBytes() } }
                              val iv = s.iv ?: ByteArray(16).also {
                                  var v = s.seq
                                  for (j in 15 downTo 8) { it[j] = (v and 0xFF).toByte(); v = v shr 8 }
                              }
                              val c = javax.crypto.Cipher.getInstance("AES/CBC/PKCS5Padding")
                              c.init(javax.crypto.Cipher.DECRYPT_MODE, javax.crypto.spec.SecretKeySpec(k, "AES"), javax.crypto.spec.IvParameterSpec(iv))
                              b = c.doFinal(b)
                          }
                          return b
                      } catch (e: Exception) {
                          last = e
                      }
                  }
                  throw IOException("A piece of the video could not be loaded (${last?.message})")
              }

              private fun fetchPl(p: Pl, ref: String, out: File, label: String) {
                  if (p.protectedStream) throw IOException("This video is copy-protected (DRM) and cannot be saved")
                  if (p.segs.isEmpty()) throw IOException("The video list is empty")
                  val keys = java.util.concurrent.ConcurrentHashMap<String, ByteArray>()
                  out.outputStream().buffered().use { o ->
                      if (p.map.isNotEmpty()) o.write(open(p.map, ref, UAD).inputStream.use { it.readBytes() })
                      val pool = java.util.concurrent.Executors.newFixedThreadPool(4)
                      try {
                          var i = 0
                          while (i < p.segs.size) {
                              val batch = p.segs.subList(i, minOf(i + 8, p.segs.size))
                              val fs = batch.map { sg -> pool.submit(java.util.concurrent.Callable { getSeg(sg, ref, keys) }) }
                              chk()
                              for (f in fs) {
                                  try {
                                      o.write(f.get())
                                  } catch (e: java.util.concurrent.ExecutionException) {
                                      throw IOException(e.cause?.message ?: "download failed")
                                  }
                              }
                              i += batch.size
                              say("$label ${i * 100 / p.segs.size}%")
                          }
                      } finally {
                          pool.shutdownNow()
                      }
                  }
              }

              private fun saveHls(m: Media, n: Int) {
                  val ref = m.ref
                  val top = txt(m.url, ref)
                  var vurl = m.url
                  var aurl = ""
                  if (top.contains("#EXT-X-STREAM-INF")) {
                      val ls = top.lines().map { it.trim() }
                      var bestScore = -1L
                      var bestUri = ""
                      var group = ""
                      for (i in ls.indices) {
                          if (!ls[i].startsWith("#EXT-X-STREAM-INF")) continue
                          val res = (attr(ls[i], "RESOLUTION") ?: "").split("x")
                          val px = (res.getOrNull(0)?.toLongOrNull() ?: 0L) * (res.getOrNull(1)?.toLongOrNull() ?: 0L)
                          val score = px * 1000000L + (attr(ls[i], "BANDWIDTH")?.toLongOrNull() ?: 0L)
                          var j = i + 1
                          while (j < ls.size && (ls[j].isEmpty() || ls[j].startsWith("#"))) j++
                          if (j < ls.size && score > bestScore) {
                              bestScore = score
                              bestUri = ls[j]
                              group = attr(ls[i], "AUDIO") ?: ""
                          }
                      }
                      if (bestUri.isEmpty()) throw IOException("No video found in the list")
                      vurl = absUrl(m.url, bestUri)
                      if (group.isNotEmpty()) {
                          var any = ""
                          var def = ""
                          for (l in ls) {
                              if (!l.startsWith("#EXT-X-MEDIA") || attr(l, "TYPE") != "AUDIO" || attr(l, "GROUP-ID") != group) continue
                              val uri = attr(l, "URI") ?: continue
                              if (any.isEmpty()) any = uri
                              if (def.isEmpty() && attr(l, "DEFAULT") == "YES") def = uri
                          }
                          val pick = if (def.isNotEmpty()) def else any
                          if (pick.isNotEmpty()) aurl = absUrl(m.url, pick)
                      }
                  }
                  if (aurl.isEmpty() && m.audio.isNotEmpty()) aurl = m.audio
                  val vf = File(cacheDir, "h_v_${System.nanoTime()}.bin")
                  val af = File(cacheDir, "h_a_${System.nanoTime()}.bin")
                  try {
                      val vp = parseMedia(vurl, ref)
                      fetchPl(vp, ref, vf, "Video")
                      if (aurl.isEmpty() && !tracksOf(vf.path).second) {
                          // the picture came without sound: look for the matching sound list
                          say("Looking for the sound…")
                          for (alt in m.alts) {
                              if (alt != vurl && soundOnly(alt, ref)) { aurl = alt; break }
                          }
                          if (aurl.isEmpty()) warn = "This stream has no sound track that could be found."
                      }
                      if (aurl.isNotEmpty()) fetchPl(parseMedia(aurl, ref), ref, af, "Audio")
                      say("Saving…")
                      val item = newItem("${pre()}web_${System.currentTimeMillis()}_$n.mp4", "video/mp4", true)
                      var ok = false
                      try {
                          contentResolver.openFileDescriptor(item.first, "rw")!!.use { remux(vf.path, if (aurl.isNotEmpty()) af.path else "", it.fileDescriptor) }
                          ok = true
                      } catch (e: Exception) {
                          contentResolver.delete(item.first, null, null)
                          if (aurl.isNotEmpty()) throw IOException("Could not merge video and audio (${e.message})")
                      }
                      if (ok) {
                          finishItem(item)
                      } else {
                          // could not convert: keep the raw stream so nothing is lost
                          val fmp4 = vp.map.isNotEmpty()
                          writeBytes(vf.readBytes(), "${pre()}web_${System.currentTimeMillis()}_$n." + (if (fmp4) "mp4" else "ts"), if (fmp4) "video/mp4" else "video/mp2t", true)
                      }
                  } finally {
                      vf.delete()
                      af.delete()
                  }
              }

              // copy video (and sound) tracks into a clean MP4
              // which tracks a file has: (picture, sound)
              private fun tracksOf(path: String): Pair<Boolean, Boolean> {
                  val ex = MediaExtractor()
                  try {
                      ex.setDataSource(path)
                      var v = false
                      var a = false
                      for (i in 0 until ex.trackCount) {
                          val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("video/")) v = true
                          if (mime.startsWith("audio/")) a = true
                      }
                      return Pair(v, a)
                  } catch (e: Exception) {
                      return Pair(true, true)
                  } finally {
                      ex.release()
                  }
              }

              // downloads only the first piece of a list to see whether it is sound only
              private fun soundOnly(url: String, ref: String): Boolean {
                  val t = File(cacheDir, "probe_${System.nanoTime()}.bin")
                  try {
                      val pl = parseMedia(url, ref)
                      if (pl.protectedStream || pl.segs.isEmpty()) return false
                      t.outputStream().use { o ->
                          if (pl.map.isNotEmpty()) o.write(open(pl.map, ref, UAD).inputStream.use { it.readBytes() })
                          o.write(getSeg(pl.segs[0], ref, java.util.concurrent.ConcurrentHashMap()))
                      }
                      val tr = tracksOf(t.path)
                      return !tr.first && tr.second
                  } catch (e: Exception) {
                      return false
                  } finally {
                      t.delete()
                  }
              }

              private fun remux(vp: String, ap: String, fd: FileDescriptor) {
                  val mx = MediaMuxer(fd, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val exs = ArrayList<MediaExtractor>()
                  val maps = ArrayList<HashMap<Int, Int>>()
                  var started = false
                  try {
                      for (k in 0..1) {
                          val path = if (k == 0) vp else ap
                          if (path.isEmpty()) continue
                          val ex = MediaExtractor()
                          ex.setDataSource(path)
                          exs.add(ex)
                          val mp = HashMap<Int, Int>()
                          for (i in 0 until ex.trackCount) {
                              val f = ex.getTrackFormat(i)
                              val mime = f.getString(MediaFormat.KEY_MIME) ?: ""
                              val take = if (k == 0) (mime.startsWith("video/") || (ap.isEmpty() && mime.startsWith("audio/"))) else mime.startsWith("audio/")
                              if (take) {
                                  ex.selectTrack(i)
                                  mp[i] = mx.addTrack(f)
                              }
                          }
                          maps.add(mp)
                      }
                      if (maps.all { it.isEmpty() }) throw IOException("No video track")
                      mx.start()
                      started = true
                      val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                      val info = MediaCodec.BufferInfo()
                      while (true) {
                          var bi = -1
                          var bt = Long.MAX_VALUE
                          for (i in exs.indices) {
                              val t = exs[i].sampleTime
                              if (t >= 0 && t < bt) { bt = t; bi = i }
                          }
                          if (bi < 0) break
                          val ex = exs[bi]
                          val outIdx = maps[bi][ex.sampleTrackIndex]
                          val sz = ex.readSampleData(buf, 0)
                          if (sz < 0) break
                          if (outIdx != null) {
                              info.set(0, sz, ex.sampleTime, ex.sampleFlags)
                              mx.writeSampleData(outIdx, buf, info)
                          }
                          ex.advance()
                      }
                  } finally {
                      try { if (started) mx.stop() } catch (e: Exception) { }
                      mx.release()
                      for (e in exs) e.release()
                  }
              }

              private fun readAll(u: String, ref: String): ByteArray = open(u, ref).inputStream.use { it.readBytes() }

              private fun writeBytes(b: ByteArray, name: String, mime: String, video: Boolean) {
                  val item = newItem(name, mime, video)
                  try {
                      contentResolver.openOutputStream(item.first)!!.use { it.write(b) }
                  } catch (e: Exception) {
                      contentResolver.delete(item.first, null, null)
                      throw e
                  }
                  finishItem(item)
              }

              // live photo = short video clip (TikTok itself saves it as a normal MP4)
              private fun saveLive(m: Media, n: Int) {
                  val b = readAll(pickBest(m), m.ref)
                  if (kindOf(b, minOf(16, b.size)) == "audio") throw IOException("This clip is sound only, not a video")
                  writeBytes(b, "${pre()}live_${System.currentTimeMillis()}_$n.mp4", "video/mp4", true)
              }

              private class Cur(var pos: Long = 0L, var pct: Int = -1)

              private fun pull(url: String, ua: String, endv: Long, useParam: Boolean, out: OutputStream, buf: ByteArray, st: Cur, size: Long, label: String) {
                  val start = st.pos
                  val u = if (useParam) "$url&range=$start-$endv" else url
                  val c = open(u, "https://www.youtube.com/", ua)
                  c.setRequestProperty("Origin", "https://www.youtube.com")
                  if (!useParam) c.setRequestProperty("Range", "bytes=$start-$endv")
                  val code = c.responseCode
                  if (code >= 400) { c.disconnect(); throw IOException("HTTP $code") }
                  if (!useParam && code == 200 && start > 0) { c.disconnect(); throw IOException("range ignored") }
                  var got = 0L
                  c.inputStream.use { i ->
                      var r = i.read(buf)
                      while (r >= 0) {
                          chk()
                          out.write(buf, 0, r)
                          got += r
                          st.pos += r
                          val pct = (st.pos * 100 / size).toInt()
                          if (pct != st.pct) { st.pct = pct; say("$label $pct%") }
                          if (st.pos > endv) break
                          r = i.read(buf)
                      }
                  }
                  if (got == 0L) throw IOException("empty")
              }

              // download in pieces; when YouTube blocks a piece, resume from the same spot through another YouTube route
              private fun fetchChunks(url0: String, out: OutputStream, ua0: String, size: Long, label: String, id: String, itag: Int) {
                  val buf = ByteArray(65536)
                  if (size <= 0) {
                      val c = open(url0, "", ua0)
                      c.inputStream.use { i ->
                          var r = i.read(buf)
                          while (r >= 0) { chk(); out.write(buf, 0, r); r = i.read(buf) }
                      }
                      return
                  }
                  val srcs = ArrayList<Pair<String, String>>()
                  srcs.add(Pair(url0, ua0))
                  var expanded = false
                  var cur = 0
                  val st = Cur()
                  while (st.pos < size) {
                      var ok = false
                      var why = ""
                      var idx = cur
                      while (!ok) {
                          if (idx >= srcs.size) {
                              if (expanded || id.isEmpty() || itag <= 0) break
                              expanded = true
                              say("$label: trying another YouTube route…")
                              srcs.addAll(ytSources(id, itag, size, url0))
                              if (idx >= srcs.size) break
                          }
                          val s = srcs[idx]
                          for (variant in 0..1) {
                              val len = if (variant == 0) 9437184L else 1048576L
                              val endv = minOf(st.pos + len, size) - 1
                              try {
                                  pull(s.first, s.second, endv, variant == 1, out, buf, st, size, label)
                                  ok = true
                                  break
                              } catch (e: IOException) {
                                  if (e is Cancelled) throw e
                                  why = e.message ?: "network error"
                                  if (st.pos >= size) { ok = true; break }
                              }
                          }
                          if (ok) cur = idx else idx++
                      }
                      if (!ok) throw IOException("YouTube stopped the download at ${maxOf(st.pct, 0)}% ($why)")
                  }
              }

              private fun saveMux(m: Media, n: Int) {
                  val vf = File(cacheDir, "v_${System.nanoTime()}.bin")
                  val af = File(cacheDir, "a_${System.nanoTime()}.bin")
                  try {
                      vf.outputStream().use { fetchChunks(m.url, it, m.ua, m.size, "Video", m.ytId, m.itag) }
                      af.outputStream().use { fetchChunks(m.audio, it, m.ua, m.asize, "Audio", m.ytId, m.aitag) }
                      say("Merging video and audio…")
                      val ext = if (m.webm) "webm" else "mp4"
                      val item = newItem("${pre()}${if (m.ytId.isEmpty()) "web" else "yt"}_${System.currentTimeMillis()}_$n.$ext", if (m.webm) "video/webm" else "video/mp4", true)
                      try {
                          contentResolver.openFileDescriptor(item.first, "rw")!!.use { mux(vf.path, af.path, it.fileDescriptor, m.webm) }
                      } catch (e: Exception) {
                          contentResolver.delete(item.first, null, null)
                          throw e
                      }
                      finishItem(item)
                  } finally {
                      vf.delete()
                      af.delete()
                  }
              }

              private class Smp(val data: ByteArray, val pts: Long, val flags: Int)

              // turns any sound file (e.g. AAC) into Opus samples, which WebM can hold
              private fun toOpus(ap: String): Pair<MediaFormat, List<Smp>> {
                  val ex = MediaExtractor()
                  ex.setDataSource(ap)
                  val t = trackOf(ex, "audio/")
                  ex.selectTrack(t)
                  val inF = ex.getTrackFormat(t)
                  val dec = MediaCodec.createDecoderByType(inF.getString(MediaFormat.KEY_MIME)!!)
                  dec.configure(inF, null, null, 0)
                  dec.start()
                  val pcm = ByteArrayOutputStream()
                  var rate = inF.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                  var ch = inF.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                  val info = MediaCodec.BufferInfo()
                  var inDone = false
                  var outDone = false
                  while (!outDone) {
                      chk()
                      if (!inDone) {
                          val ii = dec.dequeueInputBuffer(10000)
                          if (ii >= 0) {
                              val b = dec.getInputBuffer(ii)!!
                              val n = ex.readSampleData(b, 0)
                              if (n < 0) { dec.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM); inDone = true }
                              else { dec.queueInputBuffer(ii, 0, n, ex.sampleTime, 0); ex.advance() }
                          }
                      }
                      val oi = dec.dequeueOutputBuffer(info, 10000)
                      if (oi == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val f = dec.outputFormat
                          rate = f.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                          ch = f.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      } else if (oi >= 0) {
                          val b = dec.getOutputBuffer(oi)!!
                          val arr = ByteArray(info.size)
                          b.position(info.offset)
                          b.get(arr)
                          pcm.write(arr)
                          dec.releaseOutputBuffer(oi, false)
                          if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outDone = true
                      }
                  }
                  dec.stop(); dec.release(); ex.release()
                  // 16-bit samples -> stereo (or mono) at 48 kHz
                  val raw = pcm.toByteArray()
                  val frames = raw.size / 2 / ch
                  val oc = minOf(ch, 2)
                  val sb = java.nio.ByteBuffer.wrap(raw).order(java.nio.ByteOrder.LITTLE_ENDIAN).asShortBuffer()
                  val outFrames = (frames.toLong() * 48000 / rate).toInt()
                  val res = ShortArray(outFrames * oc)
                  for (i in 0 until outFrames) {
                      val pos = i.toDouble() * rate / 48000.0
                      val i0 = minOf(pos.toInt(), frames - 1)
                      val i1 = minOf(i0 + 1, frames - 1)
                      val fr = pos - i0
                      for (c in 0 until oc) {
                          val a = sb.get(i0 * ch + c).toInt()
                          val b = sb.get(i1 * ch + c).toInt()
                          res[i * oc + c] = (a + (b - a) * fr).toInt().toShort()
                      }
                  }
                  val ef = MediaFormat.createAudioFormat("audio/opus", 48000, oc)
                  ef.setInteger(MediaFormat.KEY_BIT_RATE, 128000)
                  val enc = MediaCodec.createEncoderByType("audio/opus")
                  enc.configure(ef, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  enc.start()
                  var outFmt: MediaFormat? = null
                  val list = ArrayList<Smp>()
                  var fed = 0
                  var eos = false
                  var done = false
                  while (!done) {
                      chk()
                      if (!eos) {
                          val ii = enc.dequeueInputBuffer(10000)
                          if (ii >= 0) {
                              val b = enc.getInputBuffer(ii)!!
                              val cap = minOf(b.capacity() / 2 / oc, 960 * 2)
                              val n = minOf(cap, outFrames - fed)
                              if (n <= 0) { enc.queueInputBuffer(ii, 0, 0, fed * 1000000L / 48000, MediaCodec.BUFFER_FLAG_END_OF_STREAM); eos = true }
                              else {
                                  b.clear()
                                  val bb = b.order(java.nio.ByteOrder.LITTLE_ENDIAN)
                                  for (k in 0 until n * oc) bb.putShort(res[fed * oc + k])
                                  enc.queueInputBuffer(ii, 0, n * oc * 2, fed * 1000000L / 48000, 0)
                                  fed += n
                              }
                          }
                      }
                      val oi = enc.dequeueOutputBuffer(info, 10000)
                      if (oi == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) outFmt = enc.outputFormat
                      else if (oi >= 0) {
                          if (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG == 0 && info.size > 0) {
                              val b = enc.getOutputBuffer(oi)!!
                              val arr = ByteArray(info.size)
                              b.position(info.offset)
                              b.get(arr)
                              list.add(Smp(arr, info.presentationTimeUs, info.flags))
                          }
                          enc.releaseOutputBuffer(oi, false)
                          if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) done = true
                      }
                  }
                  val fmt = outFmt ?: enc.outputFormat
                  enc.stop(); enc.release()
                  return Pair(fmt, list)
              }

              private fun muxWebmOpus(vp: String, ap: String, fd: FileDescriptor) {
                  say("Converting the sound…")
                  val (af, samples) = toOpus(ap)
                  val vex = MediaExtractor()
                  vex.setDataSource(vp)
                  val vt = trackOf(vex, "video/")
                  vex.selectTrack(vt)
                  val mx = MediaMuxer(fd, MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM)
                  val vi = mx.addTrack(vex.getTrackFormat(vt))
                  val ai = mx.addTrack(af)
                  mx.start()
                  val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                  val info = MediaCodec.BufferInfo()
                  var k = 0
                  while (true) {
                      val vtm = vex.sampleTime
                      if (vtm < 0 && k >= samples.size) break
                      if (vtm >= 0 && (k >= samples.size || vtm <= samples[k].pts)) {
                          val sz = vex.readSampleData(buf, 0)
                          if (sz < 0) break
                          info.set(0, sz, vtm, vex.sampleFlags)
                          mx.writeSampleData(vi, buf, info)
                          vex.advance()
                      } else {
                          val sm = samples[k++]
                          val bb = ByteBuffer.wrap(sm.data)
                          info.set(0, sm.data.size, sm.pts, 0)
                          mx.writeSampleData(ai, bb, info)
                      }
                  }
                  mx.stop()
                  mx.release()
                  vex.release()
              }

              private fun trackOf(ex: MediaExtractor, prefix: String): Int {
                  for (i in 0 until ex.trackCount) {
                      if (ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME)?.startsWith(prefix) == true) return i
                  }
                  throw IOException("No $prefix track")
              }

              private fun mux(vp: String, ap: String, fd: FileDescriptor, webm: Boolean) {
                  if (!webm) {
                      val vm = try {
                          val e = MediaExtractor(); e.setDataSource(vp)
                          val r = e.getTrackFormat(trackOf(e, "video/")).getString(MediaFormat.KEY_MIME) ?: ""
                          e.release(); r
                      } catch (e: Exception) { "" }
                      val copyJoin = {
                          val fo = java.io.FileOutputStream(fd)
                          fo.channel.truncate(0L); fo.channel.position(0L)
                          FragJoin.join(vp, ap, java.io.BufferedOutputStream(fo, 1 shl 16))
                      }
                      if (!(vm == "video/avc" || vm == "video/hevc")) {
                          try { copyJoin(); return } catch (e: Exception) { if (vm.isNotEmpty() && vm != "video/avc" && vm != "video/hevc") throw e }
                      }
                      try { mux1(vp, ap, fd, false) } catch (e: Exception) { copyJoin() }
                      return
                  }
                  mux1(vp, ap, fd, true)
              }

              private fun mux1(vp: String, ap: String, fd: FileDescriptor, webm: Boolean) {
                  if (webm) {
                      val aex0 = MediaExtractor()
                      aex0.setDataSource(ap)
                      val am = aex0.getTrackFormat(trackOf(aex0, "audio/")).getString(MediaFormat.KEY_MIME) ?: ""
                      aex0.release()
                      if (am != "audio/opus" && am != "audio/vorbis") { muxWebmOpus(vp, ap, fd); return }
                  }
                  val vex = MediaExtractor()
                  vex.setDataSource(vp)
                  val aex = MediaExtractor()
                  aex.setDataSource(ap)
                  val vt = trackOf(vex, "video/")
                  val at = trackOf(aex, "audio/")
                  vex.selectTrack(vt)
                  aex.selectTrack(at)
                  val mx = MediaMuxer(fd, if (webm) MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM else MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val vi = mx.addTrack(vex.getTrackFormat(vt))
                  val ai = mx.addTrack(aex.getTrackFormat(at))
                  mx.start()
                  val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                  val info = MediaCodec.BufferInfo()
                  while (true) {
                      val vtm = vex.sampleTime
                      val atm = aex.sampleTime
                      if (vtm < 0 && atm < 0) break
                      val useV = vtm >= 0 && (atm < 0 || vtm <= atm)
                      val ex = if (useV) vex else aex
                      val sz = ex.readSampleData(buf, 0)
                      if (sz < 0) break
                      info.set(0, sz, ex.sampleTime, ex.sampleFlags)
                      mx.writeSampleData(if (useV) vi else ai, buf, info)
                      ex.advance()
                  }
                  mx.stop()
                  mx.release()
                  vex.release()
                  aex.release()
              }
          }

          // joins a picture-only fragmented MP4 (any codec, e.g. VP9) and a sound-only fragmented MP4 (e.g. AAC)
          // into one MP4 by copying the boxes as they are (no re-encoding), like Instagram's own player does
          object FragJoin {
              private class Box(val type: String, val off: Long, val size: Long)
              private class Frag(val moofOff: Long, val moofSize: Long, val mdatOff: Long, val mdatSize: Long, val v: Boolean, val start: Double)
              private class Src(val raf: java.io.RandomAccessFile, val trak: ByteArray, val trex: ByteArray?, val mvhd: ByteArray,
                                val scale: Long, val dur: Long, val frags: List<Frag>)

              private fun u32(b: ByteArray, o: Int): Long =
                  ((b[o].toLong() and 0xFF) shl 24) or ((b[o + 1].toLong() and 0xFF) shl 16) or ((b[o + 2].toLong() and 0xFF) shl 8) or (b[o + 3].toLong() and 0xFF)
              private fun u64(b: ByteArray, o: Int): Long = (u32(b, o) shl 32) or u32(b, o + 4)
              private fun p32(b: ByteArray, o: Int, v: Long) { for (i in 0..3) b[o + i] = (v shr (24 - 8 * i)).toByte() }
              private fun p64(b: ByteArray, o: Int, v: Long) { p32(b, o, v ushr 32); p32(b, o + 4, v and 0xFFFFFFFFL) }
              private fun typ(b: ByteArray, o: Int) = String(b, o, 4, Charsets.ISO_8859_1)

              private fun top(raf: java.io.RandomAccessFile): List<Box> {
                  val out = ArrayList<Box>()
                  val len = raf.length()
                  var p = 0L
                  val h = ByteArray(16)
                  while (p + 8 <= len) {
                      raf.seek(p); raf.readFully(h, 0, 8)
                      var s = u32(h, 0)
                      val t = typ(h, 4)
                      if (s == 1L) { raf.readFully(h, 8, 8); s = u64(h, 8) }
                      if (s == 0L) s = len - p
                      if (s < 8) break
                      out.add(Box(t, p, s))
                      p += s
                  }
                  return out
              }

              // children of a box held in memory: (type, start, size)
              private fun kids(b: ByteArray, s: Int, e: Int): List<Triple<String, Int, Int>> {
                  val out = ArrayList<Triple<String, Int, Int>>()
                  var p = s
                  while (p + 8 <= e) {
                      var sz = u32(b, p).toInt()
                      if (sz == 0) sz = e - p
                      if (sz < 8 || p + sz > e) break
                      out.add(Triple(typ(b, p + 4), p, sz))
                      p += sz
                  }
                  return out
              }
              private fun kid(b: ByteArray, s: Int, e: Int, t: String) = kids(b, s, e).firstOrNull { it.first == t }

              private fun read(raf: java.io.RandomAccessFile, off: Long, size: Long): ByteArray {
                  val b = ByteArray(size.toInt()); raf.seek(off); raf.readFully(b); return b
              }

              private fun load(path: String, wantVideo: Boolean): Src {
                  val raf = java.io.RandomAccessFile(path, "r")
                  val bs = top(raf)
                  val mb = bs.firstOrNull { it.type == "moov" } ?: throw java.io.IOException("no moov")
                  val moov = read(raf, mb.off, mb.size)
                  val mvhdK = kid(moov, 8, moov.size, "mvhd") ?: throw java.io.IOException("no mvhd")
                  val mvhd = moov.copyOfRange(mvhdK.second, mvhdK.second + mvhdK.third)
                  var trak: ByteArray? = null
                  var id = 0L
                  var scale = 1L
                  for (k in kids(moov, 8, moov.size).filter { it.first == "trak" }) {
                      val t = moov.copyOfRange(k.second, k.second + k.third)
                      val mdia = kid(t, 8, t.size, "mdia") ?: continue
                      val hd = kid(t, mdia.second + 8, mdia.second + mdia.third, "hdlr") ?: continue
                      val h = typ(t, hd.second + 16)
                      if ((wantVideo && h == "vide") || (!wantVideo && h == "soun")) {
                          val tk = kid(t, 8, t.size, "tkhd")!!
                          id = u32(t, tk.second + if (t[tk.second + 8].toInt() == 1) 28 else 20)
                          val md = kid(t, mdia.second + 8, mdia.second + mdia.third, "mdhd")!!
                          scale = u32(t, md.second + if (t[md.second + 8].toInt() == 1) 28 else 20)
                          trak = t
                          break
                      }
                  }
                  if (trak == null) throw java.io.IOException(if (wantVideo) "no picture track" else "no sound track")
                  var trex: ByteArray? = null
                  kid(moov, 8, moov.size, "mvex")?.let { mx ->
                      for (k in kids(moov, mx.second + 8, mx.second + mx.third).filter { it.first == "trex" })
                          if (u32(moov, k.second + 12) == id) trex = moov.copyOfRange(k.second, k.second + k.third)
                  }
                  val defDur = trex?.let { u32(it, 20) } ?: 0L
                  val frags = ArrayList<Frag>()
                  var t = 0L
                  var total = 0L
                  for (i in bs.indices) {
                      if (bs[i].type != "moof") continue
                      val md = bs.drop(i + 1).firstOrNull { it.type == "mdat" || it.type == "moof" } ?: continue
                      if (md.type != "mdat") continue
                      val moof = read(raf, bs[i].off, bs[i].size)
                      var start = -1L
                      var d = 0L
                      for (tf in kids(moof, 8, moof.size).filter { it.first == "traf" }) {
                          val e = tf.second + tf.third
                          var dd = defDur
                          kid(moof, tf.second + 8, e, "tfhd")?.let { th ->
                              val fl = u32(moof, th.second + 8) and 0xFFFFFF
                              var o = th.second + 16
                              if (fl and 1L != 0L) o += 8
                              if (fl and 2L != 0L) o += 4
                              if (fl and 8L != 0L) dd = u32(moof, o)
                          }
                          kid(moof, tf.second + 8, e, "tfdt")?.let { td ->
                              start = if (moof[td.second + 8].toInt() == 1) u64(moof, td.second + 12) else u32(moof, td.second + 12)
                          }
                          for (tr in kids(moof, tf.second + 8, e).filter { it.first == "trun" }) {
                              val fl = u32(moof, tr.second + 8) and 0xFFFFFF
                              val n = u32(moof, tr.second + 12)
                              var o = tr.second + 16
                              if (fl and 1L != 0L) o += 4
                              if (fl and 4L != 0L) o += 4
                              val per = (if (fl and 0x100L != 0L) 4 else 0) + (if (fl and 0x200L != 0L) 4 else 0) +
                                  (if (fl and 0x400L != 0L) 4 else 0) + (if (fl and 0x800L != 0L) 4 else 0)
                              if (fl and 0x100L != 0L) {
                                  for (j in 0 until n.toInt()) { if (o + 4 > moof.size) break; d += u32(moof, o); o += per }
                              } else d += n * dd
                          }
                      }
                      if (start < 0) start = t
                      t = start + d
                      total = maxOf(total, t)
                      frags.add(Frag(bs[i].off, bs[i].size, md.off, md.size, wantVideo, start.toDouble() / scale))
                  }
                  if (frags.isEmpty()) throw java.io.IOException("not a fragmented file")
                  return Src(raf, trak!!, trex, mvhd, scale, total, frags)
              }

              private fun box(t: String, vararg parts: ByteArray): ByteArray {
                  val n = 8 + parts.sumOf { it.size }
                  val b = ByteArray(n)
                  p32(b, 0, n.toLong())
                  System.arraycopy(t.toByteArray(Charsets.ISO_8859_1), 0, b, 4, 4)
                  var p = 8
                  for (x in parts) { System.arraycopy(x, 0, b, p, x.size); p += x.size }
                  return b
              }

              // new copy of a track with its own number and length
              private fun fixTrak(t0: ByteArray, id: Long, durMovie: Long, durMedia: Long): ByteArray {
                  val t = t0.copyOf()
                  kid(t, 8, t.size, "tkhd")?.let { k ->
                      if (t[k.second + 8].toInt() == 1) { p32(t, k.second + 28, id); p64(t, k.second + 36, durMovie) }
                      else { p32(t, k.second + 20, id); p32(t, k.second + 28, minOf(durMovie, 0xFFFFFFFFL)) }
                  }
                  kid(t, 8, t.size, "mdia")?.let { m ->
                      kid(t, m.second + 8, m.second + m.third, "mdhd")?.let { k ->
                          if (t[k.second + 8].toInt() == 1) p64(t, k.second + 32, durMedia) else p32(t, k.second + 24, minOf(durMedia, 0xFFFFFFFFL))
                      }
                  }
                  return t
              }

              private fun trex(src: ByteArray?, id: Long): ByteArray {
                  val b = src?.copyOf() ?: ByteArray(32).also { p32(it, 0, 32); System.arraycopy("trex".toByteArray(), 0, it, 4, 4); p32(it, 16, 1) }
                  p32(b, 12, id)
                  return b
              }

              fun join(vp: String, ap: String, out: java.io.OutputStream) {
                  val v = load(vp, true)
                  val a = load(ap, false)
                  try {
                      val ms = u32(v.mvhd, if (v.mvhd[8].toInt() == 1) 28 else 20).coerceAtLeast(1L)
                      val vMovie = v.dur * ms / v.scale
                      val aMovie = a.dur * ms / a.scale
                      val movie = maxOf(vMovie, aMovie)
                      val mvhd = v.mvhd.copyOf()
                      if (mvhd[8].toInt() == 1) p64(mvhd, 32, movie) else p32(mvhd, 24, minOf(movie, 0xFFFFFFFFL))
                      p32(mvhd, mvhd.size - 4, 3)
                      val mehd = ByteArray(20).also { p32(it, 0, 20); System.arraycopy("mehd".toByteArray(), 0, it, 4, 4); it[8] = 1; p64(it, 12, movie) }
                      val moov = box("moov", mvhd, fixTrak(v.trak, 1, vMovie, v.dur), fixTrak(a.trak, 2, aMovie, a.dur),
                          box("mvex", mehd, trex(v.trex, 1), trex(a.trex, 2)))
                      val ftyp = box("ftyp", "isom".toByteArray(), byteArrayOf(0, 0, 2, 0), "isomiso6iso5mp41dash".toByteArray())
                      out.write(ftyp)
                      out.write(moov)
                      var pos = (ftyp.size + moov.size).toLong()
                      val all = (v.frags + a.frags).sortedWith(compareBy<Frag> { it.start }.thenBy { if (it.v) 0 else 1 })
                      var seq = 1L
                      val buf = ByteArray(1 shl 16)
                      for (f in all) {
                          val s = if (f.v) v else a
                          val moof = read(s.raf, f.moofOff, f.moofSize)
                          val shift = pos - f.moofOff
                          kid(moof, 8, moof.size, "mfhd")?.let { p32(moof, it.second + 12, seq++) }
                          for (tf in kids(moof, 8, moof.size).filter { it.first == "traf" }) {
                              kid(moof, tf.second + 8, tf.second + tf.third, "tfhd")?.let { th ->
                                  p32(moof, th.second + 12, if (f.v) 1 else 2)
                                  val fl = u32(moof, th.second + 8) and 0xFFFFFF
                                  if (fl and 1L != 0L) p64(moof, th.second + 16, u64(moof, th.second + 16) + shift)
                              }
                          }
                          out.write(moof)
                          pos += moof.size
                          // keep anything that sat between the fragment header and its data, so offsets stay right
                          var p = f.moofOff + f.moofSize
                          val end = f.mdatOff + f.mdatSize
                          s.raf.seek(p)
                          while (p < end) {
                              val r = s.raf.read(buf, 0, minOf(buf.size.toLong(), end - p).toInt())
                              if (r < 0) break
                              out.write(buf, 0, r)
                              p += r; pos += r
                          }
                      }
                      out.flush()
                  } finally {
                      v.raf.close(); a.raf.close()
                  }
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Easy Downloader v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
