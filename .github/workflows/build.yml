              private fun busy(on: Boolean) = runOnUiThread {
                  anim?.cancel()
                  anim = null
                  if (!on) {
                      barFill.scaleX = 1f
                      loader.visibility = View.GONE
                      return@runOnUiThread
                  }
                  loader.visibility = View.VISIBLE
                  loaderText.text = status.text
                  barFill.scaleX = 0f
                  val ms = when (plat) {
                      "x" -> 6000L
                      "yt" -> 8000L
                      "tt", "th", "ig" -> 16000L
                      "gen" -> 24000L
                      else -> 22000L
                  }
                  anim = ValueAnimator.ofFloat(0f, 0.93f).apply {
                      duration = ms
                      interpolator = DecelerateInterpolator()
                      addUpdateListener { barFill.scaleX = it.animatedValue as Float }
                      start()
                  }
              }

              private fun hasCookie(site: String, key: String): Boolean =
                  (CookieManager.getInstance().getCookie(site) ?: "").contains(key)

              private fun open(u: String, ref: String = "", ua: String = UA): HttpURLConnection {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", ua)
                  if (ref.isNotEmpty()) {
                      c.setRequestProperty("Referer", ref)
                      CookieManager.getInstance().getCookie(u)?.let { c.setRequestProperty("Cookie", it) }
                  }
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  return c
              }

              private fun get(u: String): String = open(u).inputStream.bufferedReader().readText()

              // every WebView is brand new for every link, so data from an earlier link can never leak in
              private fun baseOf(host: String): String {
                  val p = host.lowercase().split(".")
                  if (p.size <= 2) return host.lowercase()
                  return if (p[p.size - 2].length <= 3 && p.last().length == 2) p.takeLast(3).joinToString(".") else p.takeLast(2).joinToString(".")
              }

              private fun newWeb(my: Int, ua: String, big: Boolean = false): WebView {
                  host.removeAllViews()
                  webBox.removeAllViews()
                  web?.destroy()
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.settings.userAgentString = ua
                  if (plat == "gen") {
                      w.settings.mediaPlaybackRequiresUserGesture = false
                      w.settings.javaScriptCanOpenWindowsAutomatically = false
                      w.settings.setSupportMultipleWindows(false)
                      // like a download manager: catch the file when the site starts a download
                      w.setDownloadListener { url, _, _, _, _ -> addGen(url, genPage) }
                      w.webChromeClient = object : android.webkit.WebChromeClient() {
                          // pop-up messages from the page are never shown
                          override fun onJsAlert(v: WebView, u: String?, m: String?, r: android.webkit.JsResult): Boolean { r.cancel(); return true }
                          override fun onJsConfirm(v: WebView, u: String?, m: String?, r: android.webkit.JsResult): Boolean { r.cancel(); return true }
                          override fun onJsPrompt(v: WebView, u: String?, m: String?, d: String?, r: android.webkit.JsPromptResult): Boolean { r.cancel(); return true }
                          override fun onJsBeforeUnload(v: WebView, u: String?, m: String?, r: android.webkit.JsResult): Boolean { r.confirm(); return true }
                          // full screen video
                          override fun onShowCustomView(v: View, cb: android.webkit.WebChromeClient.CustomViewCallback) {
                              fullBox.removeAllViews()
                              fullBox.addView(v, FrameLayout.LayoutParams(-1, -1))
                              fullBox.visibility = View.VISIBLE
                              fullCb = cb
                          }
                          override fun onHideCustomView() {
                              fullBox.removeAllViews()
                              fullBox.visibility = View.GONE
                              fullCb = null
                          }
                      }
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.addJavascriptInterface(Bridge(my), "B")
                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val u = request.url
                          if (plat == "gen" && (u.scheme == "http" || u.scheme == "https")) {
                              // ads open other websites: never leave the page we started on
                              if (request.isForMainFrame && genSettled && baseOf(u.host ?: "") != genBase) {
                                  // do not open the other site, only check if it is the video file itself
                                  val s = u.toString()
                                  if (ADS.none { s.lowercase().contains(it) }) addGen(s, genPage)
                                  return true
                              }
                              return false
                          }
                          if (u.scheme == "http" || u.scheme == "https") return false
                          val id = u.getQueryParameter("id")?.substringBefore("_")
                          if (plat == "th" && u.scheme == "barcelona" && id != null && id.isNotEmpty() && id.all { it.isDigit() }) {
                              val c = shortcode(id)
                              knownCode = c
                              view.loadUrl("https://www.threads.com/t/$c")
                          }
                          return true
                      }

                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): android.webkit.WebResourceResponse? {
                          if (plat == "gen") {
                              val gu = request.url.toString()
                              val gl = gu.lowercase()
                              if (ADS.any { gl.contains(it) }) {
                                  return android.webkit.WebResourceResponse("text/plain", "utf-8", java.io.ByteArrayInputStream(ByteArray(0)))
                              }
                              val gp = gl.substringBefore("?").substringBefore("#")
                              // scripts and frames from other websites are almost always ads
                              val rh = baseOf(request.url.host ?: "")
                              if (genBase.isNotEmpty() && rh != genBase && !request.isForMainFrame) {
                                  val acc = request.requestHeaders?.get("Accept") ?: ""
                                  val lib = LIBS.any { (request.url.host ?: "").lowercase().contains(it) }
                                  if (gp.endsWith(".js") && !lib) return android.webkit.WebResourceResponse("text/javascript", "utf-8", java.io.ByteArrayInputStream(ByteArray(0)))
                                  if (acc.contains("text/html") && !Regex("(embed|player|/e/|/v/|video|stream)").containsMatchIn(gp)) {
                                      return android.webkit.WebResourceResponse("text/html", "utf-8", java.io.ByteArrayInputStream(ByteArray(0)))
                                  }
                              }
                              val static = Regex("\\.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|html?|php|json|xml|ts|m4s|aac|m4a|vtt|srt|key)$").containsMatchIn(gp)
                              val hint = listOf("m3u8", "mpegurl", "playlist", "master", "manifest", "/hls", "video", "stream", "/media", "download", "/file").any { gp.contains(it) }
                              if (gp.endsWith(".mp4") || gp.endsWith(".m3u8") || gp.endsWith(".webm") || gp.endsWith(".mkv") || gp.endsWith(".mov") || gp.endsWith(".m4v") || gl.contains("mime=video") || (hint && !static)) {
                                  synchronized(genUrls) {
                                      if (genUrls.size < 60 && genUrls.none { it == gu }) {
                                          genUrls.add(gu)
                                          genRef[gu] = request.requestHeaders?.get("Referer") ?: lastLink
                                      }
                                  }
                              }
                              return null
                          }
                          if (plat == "th" || plat == "ig") {
                              val u = request.url.toString()
                              val l = u.lowercase()
                              if (l.contains(".mp4") && (l.contains("cdninstagram") || l.contains("fbcdn"))) {
                                  // the player asks for pieces (bytestart/byteend); without them the server sends the whole file
                                  val full = u.replace(Regex("[&?](bytestart|byteend)=\\d+"), "").let { if (!it.contains("?") && it.contains("&")) it.replaceFirst("&", "?") else it }
                                  synchronized(netVideos) {
                                      if (netVideos.size < 30 && netVideos.none { it.substringBefore("?") == full.substringBefore("?") }) netVideos.add(full)
                                  }
                              }
                          }
                          if (plat == "tt") {
                              val u = request.url.toString()
                              val l = u.lowercase()
                              if (!l.contains("audio") && (l.contains("mime_type=video") || l.contains("/video/tos"))) {
                                  synchronized(netVideos) {
                                      if (netVideos.size < 30 && netVideos.none { it.substringBefore("?") == u.substringBefore("?") }) netVideos.add(u)
                                  }
                              }
                          }
                          return null
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          if (plat == "gen" && !genSettled && url != null && url.startsWith("http")) genBase = baseOf(Uri.parse(url).host ?: "")
                          // a new page (you picked a video or went back): look for its video from scratch
                          if (plat == "gen" && genSettled && url != null && url.startsWith("http") && url != genPage) {
                              genPage = url
                              resetGenPage()
                          }
                          if (plat != "tt") view.evaluateJavascript(HOOK, null)
                          if (plat == "gen") view.evaluateJavascript(GEN_HOOK, null)
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          if (plat == "gen" && !genSettled && url != null && url.startsWith("http")) {
                              genBase = baseOf(Uri.parse(url).host ?: "")
                              genSettled = true
                          }
                          if (plat == "gen" && url != null && url.startsWith("http")) genPage = url
                          if (plat != "tt") view.evaluateJavascript(HOOK, null)
                      }
                  }
                  if (plat == "tt" || plat == "th" || plat == "ig") w.settings.mediaPlaybackRequiresUserGesture = false
                  if (big) {
                      webBox.addView(w, FrameLayout.LayoutParams(-1, -1))
                      webBox.addView(playerBox, FrameLayout.LayoutParams(-1, -1))
                      webHost.visibility = View.VISIBLE
                      busy(false)
                  } else if (plat == "th" || plat == "ig" || plat == "tt") host.addView(w, FrameLayout.LayoutParams(dp(360), dp(640)))
                  else host.addView(w, FrameLayout.LayoutParams(1, 1))
                  web = w
                  return w
              }

              // ---------- entry point for every link ----------
              private fun platformOf(l: String): String {
                  val s = l.lowercase()
                  return when {
                      s.contains("tiktok.com") -> "tt"
                      s.contains("threads.") -> "th"
                      s.contains("instagram.com") -> "ig"
                      s.contains("youtube.com") || s.contains("youtu.be") -> "yt"
                      s.contains("facebook.com") || s.contains("fb.watch") || s.contains("fb.com") -> "fb"
                      Regex("^https?://(?:[\\w-]+\\.)*(?:x|twitter)\\.com/").containsMatchIn(s) -> "x"
                      else -> "gen"
                  }
              }

              private fun clean(s: String): String = s.replace(Regex("[^A-Za-z0-9@._\\-]"), "-").replace(Regex("-+"), "-").trim('-', '_').take(50)

              // file names start with "<account>_<platform>_", e.g. alifyaqnada_tiktok_1795..._0.mp4
              private fun setSrc(acc: String, plat0: String) {
                  val a = clean(acc.removePrefix("@"))
                  srcName = if (a.isEmpty()) plat0 else a + "_" + plat0
              }

              private fun srcOf(link: String): Pair<String, String> {
                  val l = link.lowercase()
                  val at = Regex("/@([A-Za-z0-9._]+)").find(link)?.groupValues?.get(1) ?: ""
                  return when {
                      l.contains("tiktok.com") -> Pair(at, "tiktok")
                      l.contains("threads.") -> Pair(at, "threads")
                      l.contains("instagram.com") -> Pair(Regex("instagram\\.com/(?:stories/)?([A-Za-z0-9._]+)/").find(link)?.groupValues?.get(1)
                          ?.takeIf { it !in setOf("p", "reel", "reels", "tv", "stories", "s", "highlights") } ?: "", "instagram")
                      l.contains("youtube.com") || l.contains("youtu.be") -> Pair("", "youtube")
                      l.contains("facebook.com") || l.contains("fb.watch") || l.contains("fb.com") -> Pair("", "facebook")
                      Regex("^https?://(?:[\\w-]+\\.)*(?:x|twitter)\\.com/").containsMatchIn(l) ->
                          Pair(Regex("(?:x|twitter)\\.com/([A-Za-z0-9_]+)/status").find(link)?.groupValues?.get(1)?.takeIf { it != "i" } ?: "", "x")
                      else -> Pair("", try { URL(link).host.removePrefix("www.") } catch (e: Exception) { "web" })
                  }
              }

              private val PLATS = mapOf("tiktok" to "TikTok", "x" to "X", "instagram" to "Instagram", "threads" to "Threads", "youtube" to "YouTube", "facebook" to "Facebook")

              // reads account and platform back from a file name (or from a history entry)
              private fun parseSrc(name: String): Pair<String, String> {
                  val base = name.substringBeforeLast(".")
                  var t = base.split("_")
                  val ts = t.indexOfFirst { it.length >= 12 && it.all { c -> c.isDigit() } }
                  if (ts >= 0) t = t.subList(0, ts)
                  if (t.isNotEmpty() && t.last() in setOf("web", "yt", "live")) t = t.dropLast(1)
                  if (t.isEmpty() || (t.size == 1 && t[0] == "easydl")) return Pair("", "")
                  if (t.size == 1) {
                      val x = t[0]
                      if (x.contains("-@")) return Pair(x.substringAfter("-@"), x.substringBefore("-@"))
                      if (x.startsWith("youtube-")) return Pair(x.removePrefix("youtube-"), "youtube")
                      return Pair("", x)
                  }
                  return Pair(t.dropLast(1).joinToString("_"), t.last())
              }

              private fun platName(p: String): String = PLATS[p] ?: p

              private fun accText(a: Pair<String, String>): String = when {
                  a.first.isEmpty() && a.second.isEmpty() -> "Unknown source"
                  a.first.isEmpty() -> platName(a.second)
                  a.second == "youtube" || a.second == "facebook" -> a.first.replace("-", " ")
                  else -> "@" + a.first
              }

              private fun pre(): String = (dlSrc.get() ?: "easydl") + "_"

              private fun start(link: String) {
                  closeWeb()
                  srcOf(link).let { setSrc(it.first, it.second) }
                  lastLink = link
                  quiet = true
                  input.setText(link)
                  quiet = false
                  val my = ++gen
                  list.removeAllViews()
                  items.clear()
                  overlays.clear()
                  chosen = BooleanArray(0)
                  ytMode = false
                  btn.isEnabled = false
                  allBox.visibility = View.GONE
                  diag = ""
                  lastErr = ""
                  knownCode = ""
                  fbTotal = 0
                  pollStop = false
                  thRetried = false
                  thEmbedTried = false
                  igRescueTried = false
                  fbLast = 0
                  fbStall = 0
                  vetting = false
                  synchronized(netVideos) { netVideos.clear() }
                  ttOpts.clear()
                  synchronized(genUrls) { genUrls.clear(); genRef.clear() }
                  genBase = ""
                  genSeen = -1
                  genChecked.clear()
                  genChecking = false
                  synchronized(genGood) { genGood.clear() }
                  genGoodAt = -1
                  genPage = link
                  genPick = null
                  genSettled = false
                  genDirect = ""
                  genVids = 0
                  genPlaying = ""
                  genBtn.text = "Waiting for the video…"
                  genBtn.isEnabled = false
                  synchronized(captured) { captured.clear(); seen.clear() }
                  plat = platformOf(link)
                  say("Loading…")
                  busy(true)
                  when (plat) {
                      "x" -> startX(link, my)
                      "yt" -> startYt(link, my)
                      "ig" -> startIg(link, my)
                      "fb" -> startFb(link, my)
                      "gen" -> startGen(link, my)
                      else -> startWeb(link, my)
                  }
              }

              private fun showLogin(site: String, retry: String) {
                  busy(false)
                  loginRetry = retry
                  loginSite = site
                  loginTitle.text = "Log in to $site once, then tap Done"
                  loginBox.removeAllViews()
                  loginWeb?.destroy()
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.settings.userAgentString = UA
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.webViewClient = WebViewClient()
                  loginBox.addView(w, FrameLayout.LayoutParams(-1, -1))
                  loginWeb = w
                  w.loadUrl(when (site) {
                      "Instagram" -> "https://www.instagram.com/accounts/login/"
                      "Threads" -> "https://www.threads.com/login"
                      "TikTok" -> "https://www.tiktok.com/login"
                      else -> "https://m.facebook.com/login/"
                  })
                  loginHost.visibility = View.VISIBLE
                  status.text = "Login needed to read this content."
              }

              private fun finishLogin(ok: Boolean) {
                  if (ok && loginSite == "Threads") thLoginDone = true
                  CookieManager.getInstance().flush()
                  loginHost.visibility = View.GONE
                  loginBox.removeAllViews()
                  loginWeb?.destroy()
                  loginWeb = null
                  if (ok && loginRetry.isNotEmpty()) {
                      start(loginRetry)
                  } else {
                      lastLink = ""
                      status.text = "Login cancelled."
                  }
              }

              // ---------- X ----------
              private fun startX(link: String, my: Int) {
                  val id = Regex("/status(?:es)?/(\\d+)").find(link)?.groupValues?.get(1)
                  if (id == null) {
                      fail(my, "Unrecognized X link. Use a post link (it contains /status/ and a number).")
                      return
                  }
                  val user = Regex("(?:x|twitter)\\.com/([A-Za-z0-9_]+)/status").find(link)?.groupValues?.get(1) ?: "i"
                  say("Fetching from X…")
                  val js = """(function(){return ((Number('$id')/1e15)*Math.PI).toString(36).replace(/(0+|\.)/g,'')})()"""
                  newWeb(my, UA).evaluateJavascript(js) { r ->
                      val token = (r ?: "").trim('"')
                      Thread {
                          try {
                              var found: List<Media> = try {
                                  parseX(get("https://cdn.syndication.twimg.com/tweet-result?id=$id&lang=en&token=$token"))
                              } catch (e: Exception) {
                                  emptyList()
                              }
                              if (found.isEmpty()) found = viaFx(user, id, 0)
                              runOnUiThread {
                                  if (my == gen) {
                                      if (found.isEmpty()) fail(my, "No photo or video found. The post may have no media, be deleted, or be from a locked account.")
                                      else show(found)
                                  }
                              }
                          } catch (e: Exception) {
                              fail(my, "Failed: ${e.message}")
                          }
                      }.start()
                  }
              }

              private fun parseX(text: String): List<Media> {
                  val j = JSONObject(text)
                  j.optJSONObject("user")?.optString("screen_name")?.takeIf { it.isNotEmpty() }?.let { setSrc(it, "x") }
                  val out = ArrayList<Media>()
                  xMedia(j.optJSONArray("mediaDetails"), out)
                  xMedia(j.optJSONObject("quoted_tweet")?.optJSONArray("mediaDetails"), out)
                  return out
              }

              private fun xMedia(md: JSONArray?, out: ArrayList<Media>) {
                  if (md == null) return
                  for (i in 0 until md.length()) {
                      val m = md.optJSONObject(i) ?: continue
                      val base = m.optString("media_url_https")
                      val thumb = if (base.isEmpty()) "" else "$base?name=small"
                      if (m.optString("type") == "photo") {
                          if (base.isNotEmpty()) out.add(Media("$base?name=orig", false, thumb))
                      } else {
                          val vs = m.optJSONObject("video_info")?.optJSONArray("variants") ?: continue
                          var best = ""
                          var br = -1L
                          for (k in 0 until vs.length()) {
                              val v = vs.optJSONObject(k) ?: continue
                              if (v.optString("content_type") != "video/mp4") continue
                              val b = v.optLong("bitrate")
                              if (b > br) { br = b; best = v.optString("url") }
                          }
                          if (best.isNotEmpty()) out.add(Media(best, true, thumb))
                      }
                  }
              }

              // backup: FxTwitter (reads sensitive posts, quoted posts and posts that only link to another post)
              private fun viaFx(user: String, id: String, depth: Int): List<Media> {
                  val body = try { get("https://api.fxtwitter.com/$user/status/$id") } catch (e: Exception) { return emptyList() }
                  val t = try { JSONObject(body).optJSONObject("tweet") } catch (e: Exception) { null } ?: return emptyList()
                  val out = ArrayList<Media>()
                  fxMedia(t, out)
                  fxMedia(t.optJSONObject("quote"), out)
                  if (out.isEmpty() && depth == 0) {
                      val others = Regex("status(?:es)?/(\\d+)").findAll(t.optString("text"))
                          .map { it.groupValues[1] }.filter { it != id }.distinct().toList()
                      for (o in others) {
                          val r = viaFx("i", o, 1)
                          if (r.isNotEmpty()) return r
                      }
                  }
                  return out
              }

              private fun fxMedia(t: JSONObject?, out: ArrayList<Media>) {
                  val md = t?.optJSONObject("media") ?: return
                  val all = md.optJSONArray("all")
                  if (all != null && all.length() > 0) {
                      for (i in 0 until all.length()) fxOne(all.optJSONObject(i), out)
                  } else {
                      val ph = md.optJSONArray("photos")
                      val vi = md.optJSONArray("videos")
                      if (ph != null) for (i in 0 until ph.length()) fxOne(ph.optJSONObject(i)?.also { it.put("type", "photo") }, out)
                      if (vi != null) for (i in 0 until vi.length()) fxOne(vi.optJSONObject(i)?.also { it.put("type", "video") }, out)
                  }
              }

              private fun fxOne(m: JSONObject?, out: ArrayList<Media>) {
                  if (m == null) return
                  val url = m.optString("url")
                  if (url.isEmpty()) return
                  if (m.optString("type") == "photo") {
                      val base = url.substringBefore("?")
                      out.add(Media("$base?name=orig", false, "$base?name=small"))
                  } else {
                      out.add(Media(url, true, m.optString("thumbnail_url")))
                  }
              }

              // ---------- Threads / TikTok / Instagram posts / Facebook (through a hidden browser) ----------
              private var ttMobile = false

              private fun startWeb(link: String, my: Int) {
                  say("Opening post… (up to 25 seconds)")
                  ttMobile = false
                  newWeb(my, if (plat == "tt") UAD else UA).loadUrl(link)
                  poll(my, 0)
              }

              private fun startFb(link: String, my: Int) {
                  if (link.contains("/stories/") && !hasCookie("https://www.facebook.com", "c_user=")) {
                      showLogin("Facebook", link)
                      return
                  }
                  say("Opening Facebook post… (up to 25 seconds)")
                  newWeb(my, UAD).loadUrl(link)
                  poll(my, 0)
              }

              private fun poll(my: Int, tick: Int) {
                  if (my != gen || pollStop) return
                  val w = web ?: return
                  w.evaluateJavascript(if (plat == "fb" && tick % 2 == 0) SCRIPTS_FB else SCRIPTS, null)
                  val url = w.url ?: ""
                  val docs = synchronized(captured) { ArrayList(captured) }
                  var found: List<Media> = emptyList()
                  if ((plat == "tt" || plat == "th") && url.contains("/@")) srcOf(url).let { setSrc(it.first, it.second) }
                  if (plat == "th" || plat == "ig") w.evaluateJavascript("document.querySelectorAll('video').forEach(function(v){try{v.muted=true;v.play()}catch(e){}})", null)
                  when (plat) {
                      "tt" -> {
                          val id = Regex("/(?:video|photo)/(\\d+)").find(url)?.groupValues?.get(1) ?: ""
                          if (id.isNotEmpty()) found = parseTT(docs, id)
                          if (found.isEmpty() && tick >= 10) found = parseTT(docs, "")
                          if (found.isEmpty() && tick == 9 && docs.isEmpty() && !ttMobile) {
                              // desktop page gave nothing: try the phone page
                              ttMobile = true
                              newWeb(my, UA).loadUrl(lastLink)
                              handler.postDelayed({ poll(my, 3) }, 1000)
                              return
                          }
                          // the page data has the post but no video link (newer TikTok pages): use the second source right away
                          if (found.isEmpty() && tick >= 6 && url.contains("/video/") && docs.any { it.contains("itemStruct") }) {
                              val net = synchronized(netVideos) { ArrayList(netVideos) }
                              if (net.isNotEmpty()) { show(listOf(Media(net[0], true, "", "https://www.tiktok.com/", alts = net.drop(1).take(5)))); return }
                              ttFallback(my, url)
                              return
                          }
                          if (found.size == 1 && found[0].video && !found[0].live) {
                              val web0 = ArrayList(ttOpts)
                              if (web0.isEmpty()) web0.add(Media(found[0].url, true, found[0].thumb, found[0].ref, alts = found[0].alts, itag = 2,
                                  label = "Standard · no watermark"))
                              ttQuality(my, web0, found[0])
                              return
                          }
                          if (found.isNotEmpty() && found.none { it.video }) {
                              // photo post: watch the page traffic for a few seconds in case live photo clips load
                              found = if (tick < 5) emptyList() else withNet(found)
                          }
                          if (found.isNotEmpty() && found.any { it.live } && !vetting) {
                              vetThen(my, found)
                              return
                          }
                      }
                      "gen" -> {
                          w.evaluateJavascript(GEN_JS, null)
                          w.evaluateJavascript(GEN_HOOK, null)
                          if (cleanShown && playerBox.visibility == View.VISIBLE) w.evaluateJavascript("document.querySelectorAll('video').forEach(function(v){v.pause();v.muted=true})", null)
                          if (genDirect.isNotEmpty() && genPick == null && tick > 0 && tick % 8 == 0 && tick <= 56) {
                              // waiting pages often let the file through on a later try (like pressing back and opening it again)
                              genChecked.remove(genDirect)
                              addGen(genDirect, genPage)
                              if (tick % 16 == 0) w.loadUrl(genDirect)
                          }
                          // every link found is checked first: only real video files count
                          val fresh = synchronized(genUrls) { genUrls.filter { it !in genChecked } }
                          if (fresh.isNotEmpty() && !genChecking) {
                              genChecked.addAll(fresh)
                              checkGen(my, fresh)
                          }
                          val good = synchronized(genGood) { ArrayList(genGood) }
                          // several videos on the page: only the one you play is used
                          val playing = genPlaying
                          var pick: Media? = null
                          if (playing.isNotEmpty()) pick = good.firstOrNull { it.url == playing } ?: good.firstOrNull { it.url.substringBefore("?") == playing.substringBefore("?") }
                          if (pick == null && genVids <= 1) pick = bestGen(good)
                          if (pick == null && genVids > 1 && tick % 5 == 0) say("This page has several videos. Play the one you want, then tap Download below.")
                          if (pick != null && (pick.url != genPick?.url || pick.audio != genPick?.audio)) {
                              genPick = pick
                              genBtn.text = "⬇ Download video" + (if (pick.hls) " (stream, best quality)" else if (pick.size > 0) " (${pick.size / 1048576} MB)" else "")
                              genBtn.isEnabled = true
                              say("Video found. Playing it here without the web page (no ads). Tap Download below to save it.")
                              if (!cleanShown && genVids <= 1 && pick.audio.isEmpty()) showClean(pick)
                              if (genVids > 1) say("Video found. Tap Download below to save the video you are playing.")
                          } else if (pick == null && tick % 5 == 0 && tick < 60) say("Looking for the video… It starts by itself; if not, tap play. (ads are blocked)")
                      }
                      "th", "ig" -> {
                          val rx = if (plat == "th") "/(?:post|t)/([A-Za-z0-9_-]+)" else "/(?:p|reel|reels|tv)/([A-Za-z0-9_-]+)"
                          val code = Regex(rx).find(url)?.groupValues?.get(1) ?: knownCode
                          if (code.isNotEmpty() || (plat == "th" && tick >= 12)) {
                              found = parseTh(docs, code)
                              if (found.isEmpty() && plat == "th" && tick >= 20 && code.isNotEmpty()) found = parseTh(docs, "")
                              if (found.isNotEmpty() && found.any { it.video } && !vetting) {
                                  vetThen(my, found)
                                  return
                              }
                          }
                      }
                      "fb" -> if (tick >= 2) {
                          found = parseFb(docs, tick >= 18)
                          if (found.isNotEmpty() && !found[0].video && fbTotal > found.size && tick < 40) {
                              if (found.size > fbLast) { fbLast = found.size; fbStall = 0 } else fbStall++
                              if (fbStall < 8) {
                                  say("Loading Facebook photos… (${found.size} of $fbTotal)")
                                  fbNudge(w)
                                  found = emptyList()
                              } else {
                                  diag = "Facebook only provided ${found.size} of $fbTotal photos"
                              }
                          }
                      }
                  }
                  if (found.isNotEmpty()) {
                      show(found)
                      return
                  }
                  if (plat == "th") {
                      val cur = if (url.startsWith("http")) url else lastLink
                      if (tick == 12 && docs.isEmpty() && !thRetried) {
                          // nothing arrived: try once more as a desktop browser
                          thRetried = true
                          say("Trying another way…")
                          newWeb(my, UAD).loadUrl(cur)
                          handler.postDelayed({ poll(my, 4) }, 1000)
                          return
                      }
                      if (tick == 18 && !thEmbedTried) {
                          thEmbedTried = true
                          say("Trying the Threads embed page…")
                          val m = Regex("@([^/]+)/post/([A-Za-z0-9_-]+)").find(cur)
                          if (m != null) {
                              Thread {
                                  val r = thEmbed(m.groupValues[1], m.groupValues[2])
                                  runOnUiThread { if (my == gen && !pollStop && r.isNotEmpty()) { if (r.any { it.video }) vetThen(my, r) else show(r) } }
                              }.start()
                          }
                      }
                  }
                  if ((plat == "ig" || plat == "fb") && tick >= 4 && url.contains("login")) {
                      if (plat == "ig" && !hasCookie("https://www.instagram.com", "sessionid=")) { igRescue(my); return }
                      if (plat == "fb" && !hasCookie("https://www.facebook.com", "c_user=")) { showLogin("Facebook", lastLink); return }
                  }
                  if (tick >= (if (plat == "gen") 60 else if (plat == "fb" && fbTotal > 0) 30 else 25)) {
                      if (plat == "gen") {
                          if (tick >= 1800) return
                          if (genPick == null && tick % 5 == 0) say("Tap play on the video. The Download button turns on once the video is found. (ads are blocked)")
                          handler.postDelayed({ poll(my, tick + 1) }, 1000)
                          return
                      }
                      if (plat == "th" && !thLoginDone && !hasCookie("https://www.threads.com", "sessionid=")) { showLogin("Threads", lastLink); return }
                      if (plat == "ig" && !hasCookie("https://www.instagram.com", "sessionid=")) { igRescue(my); return }
                      if (plat == "fb" && !hasCookie("https://www.facebook.com", "c_user=")) { showLogin("Facebook", lastLink); return }
                      if (plat == "tt") {
                          // last try: the video the page itself played
                          val net = synchronized(netVideos) { ArrayList(netVideos) }
                          if (net.isNotEmpty() && !url.contains("/photo/")) {
                              show(listOf(Media(net[0], true, "", "https://www.tiktok.com/", alts = net.drop(1).take(5))))
                              return
                          }
                          ttFallback(my, url)
                          return
                      }
                      fail(my, "Nothing found. url=$url; data=${docs.size}; ${kinds(docs)}")
                      return
                  }
                  handler.postDelayed({ poll(my, tick + 1) }, 1000)
              }

              // ---------- any other website: no ads, straight to the video ----------
              private fun tapCenter(w: WebView) {
                  val x = w.width / 2f
                  val y = w.height / 2f
                  val t = SystemClock.uptimeMillis()
                  w.dispatchTouchEvent(MotionEvent.obtain(t, t, MotionEvent.ACTION_DOWN, x, y, 0))
                  w.dispatchTouchEvent(MotionEvent.obtain(t, t + 60, MotionEvent.ACTION_UP, x, y, 0))
              }

              private fun originOf(u: String): String = try {
                  val x = URL(u)
                  x.protocol + "://" + x.host + "/"
              } catch (e: Exception) { u }

              private fun startGen(link: String, my: Int) {
                  val low = link.lowercase().substringBefore("?").substringBefore("#")
                  if (Regex("\\.(mp4|webm|mkv|mov|m4v|m3u8)$").containsMatchIn(low)) {
                      say("Checking the link…")
                      Thread {
                          val r = try { probe(link, originOf(link)) } catch (e: Exception) { Pair("bad", -1L) }
                          runOnUiThread {
                              if (my == gen) {
                                  when (r.first) {
                                      "video" -> show(listOf(Media(link, true, "", originOf(link), size = r.second, gua = UAD)))
                                      "hls" -> show(listOf(Media(link, true, "", originOf(link), hls = true, gua = UAD)))
                                      else -> {
                                          // the site shows a waiting page first: open it without ads and try the file again
                                          genDirect = link
                                          say("Opening the page without ads…")
                                          newWeb(my, UAD, true).loadUrl(link)
                                          poll(my, 0)
                                      }
                                  }
                              }
                          }
                      }.start()
                      return
                  }
                  say("Opening the page without ads…")
