          // keeps downloads running while you use other apps (shows a notification)
          class DlService : android.app.Service() {
              companion object {
                  @JvmStatic var onCancel: (() -> Unit)? = null
                  const val CH = "dl"
                  const val ID = 7
                  const val DONE = 8
                  fun note(c: android.content.Context, text: String, ongoing: Boolean): android.app.Notification {
                      val nm = c.getSystemService(android.content.Context.NOTIFICATION_SERVICE) as android.app.NotificationManager
                      nm.createNotificationChannel(android.app.NotificationChannel(CH, "Downloads", android.app.NotificationManager.IMPORTANCE_LOW))
                      val open = Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      val pi = android.app.PendingIntent.getActivity(c, 0, open, android.app.PendingIntent.FLAG_IMMUTABLE)
                      val b = android.app.Notification.Builder(c, CH)
                          .setSmallIcon(if (ongoing) android.R.drawable.stat_sys_download else android.R.drawable.stat_sys_download_done)
                          .setContentTitle("Easy Downloader")
                          .setContentText(text)
                          .setOngoing(ongoing)
                          .setAutoCancel(!ongoing)
                          .setOnlyAlertOnce(true)
                          .setContentIntent(pi)
                      if (ongoing) {
                          val cp = android.app.PendingIntent.getBroadcast(c, 1, Intent(c, CancelReceiver::class.java), android.app.PendingIntent.FLAG_IMMUTABLE)
                          b.addAction(android.app.Notification.Action.Builder(
                              android.graphics.drawable.Icon.createWithResource(c, android.R.drawable.ic_menu_close_clear_cancel), "✕ Cancel", cp).build())
                      }
                      return b.build()
                  }
              }

              override fun onBind(i: Intent?): android.os.IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  startForeground(ID, note(this, "Downloading…", true), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  return START_NOT_STICKY
              }
          }

          // the ✕ Cancel button in the notification
          class CancelReceiver : android.content.BroadcastReceiver() {
              override fun onReceive(c: android.content.Context, i: Intent) {
